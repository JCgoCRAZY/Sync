<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Opening Lecture…</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#09131d;color:#f1f5f9;font-family:"Segoe UI",system-ui,sans-serif}
    body{display:grid;place-items:center}.loading{padding:24px;text-align:center}.error{max-width:680px;color:#ffb2b2;line-height:1.5}button{margin-top:16px;padding:10px 14px;border:0;border-radius:9px;background:#123b3d;color:#fff;cursor:pointer}
  </style>
</head>
<body>
  <div class="loading" id="bootstrap-status">Opening Lecture…</div>
  <script>
    (async()=>{
      const status=document.getElementById('bootstrap-status');
      try{
        const response=await fetch(`editor.html`,{cache:'no-store'});
        if(!response.ok)throw new Error(`Editor returned HTTP ${response.status}`);
        let html=await response.text();
        const enhancement='<script src="editor_enhancements.js"><' + '/script>';
        if(!html.includes('editor_enhancements.js')){
          if(html.includes('</body>'))html=html.replace('</body>',`${enhancement}</body>`);
          else html+=enhancement;
        }
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error(error);
        status.className='loading error';
        status.innerHTML=`Lecture could not be opened safely.<br>${String(error?.message||error)}<br><button id="bootstrap-back" type="button">Back to Study Hub</button>`;
        document.getElementById('bootstrap-back')?.addEventListener('click',()=>history.length>1?history.back():location.replace('../index.html'));
      }
    })();
  </script>
</body>
</html>
