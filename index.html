<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#09131d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Study Hub">
  <title>University Study Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Navigation">
      <div class="brand-row">
        <div class="brand-mark">U</div>
        <div class="brand-copy">
          <strong>University</strong>
          <span>Study Hub</span>
        </div>
        <button id="sidebar-close" class="icon-button mobile-only" aria-label="Close navigation">×</button>
      </div>
      <nav id="primary-nav" class="primary-nav"></nav>
      <div class="sidebar-section-label">Courses</div>
      <div id="course-nav" class="course-nav"></div>
      <button id="add-course-nav" class="sidebar-add">＋ Add course</button>
      <div class="sidebar-footer">
        <label class="profile-label" for="profile-select">Profile</label>
        <select id="profile-select"></select>
        <button id="manage-profiles" class="link-button">Manage profiles</button>
      </div>
      <nav id="utility-nav" class="utility-nav" aria-label="Schedule and settings"></nav>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <section class="main-shell">
      <header class="top-header">
        <button id="sidebar-open" class="icon-button mobile-only" aria-label="Open navigation">☰</button>
        <div class="heading-wrap">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle">University workspace</p>
        </div>
        <div class="header-actions">
          <span id="save-indicator" class="save-indicator">✓ Saved</span>
          <button id="cloud-indicator" class="cloud-indicator" type="button" title="Cloud sync status">☁ Local</button>
          <button id="global-add" class="primary-button">＋</button>
        </div>
      </header>
      <main id="page" class="page" tabindex="-1"></main>
    </section>
  </div>

  <div id="auth-gate" class="auth-gate" hidden>
    <div class="auth-card">
      <div class="auth-brand"><div class="brand-mark">U</div><div><strong>University Study Hub</strong><span>Cloud Sync</span></div></div>
      <h2>Sign in to your workspace</h2>
      <p>Your courses, lectures, notes, questions and PDFs can follow you between Windows, Mac and iPad.</p>
      <label>Email<input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com"></label>
      <label>Password<input id="auth-password" type="password" autocomplete="current-password" placeholder="Password"></label>
      <div id="auth-message" class="auth-message"></div>
      <div class="auth-actions">
        <button id="auth-signin" class="primary-button" type="button">Sign in</button>
        <button id="auth-signup" class="secondary-button" type="button">Create account</button>
      </div>
      <div class="auth-links">
        <button id="auth-reset" class="link-button" type="button">Forgot password?</button>
        <button id="auth-offline" class="link-button" type="button">Continue offline on this device</button>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
  <input id="transfer-import" type="file" accept="application/json,.json,.ushub" hidden>
  <input id="schedule-image-import" type="file" accept="image/*" hidden>

  <script src="cloud_sync.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
