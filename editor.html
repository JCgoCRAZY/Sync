        setStatus(error.message || 'Whiteboard could not be saved.', 'error');
      });
      return whiteboardSaveQueue;
    }

    function scheduleWhiteboardSave(delay = 550, successText = '') {
      if (!initialized || !whiteboardExists) return;
      setStatus('Saving…');
      window.clearTimeout(whiteboardSaveTimer);
      whiteboardSaveTimer = window.setTimeout(() => {
        whiteboardSaveTimer = null;
        saveWhiteboardState(successText || '✓ Saved');
      }, Math.max(0, delay));
    }

    async function flushWhiteboardSave() {
      if (whiteboardSaveTimer !== null) {
        window.clearTimeout(whiteboardSaveTimer);
        whiteboardSaveTimer = null;
        await saveWhiteboardState();
      }
      await whiteboardSaveQueue;
    }

    async function saveWhiteboardViewportNow(successText = '') {
      if (!initialized || !whiteboardExists || !(window.pywebview && window.pywebview.api)) return;
      const x = whiteboardLogicalScrollX();
      const y = whiteboardLogicalScrollY();
      const zoom = whiteboardZoomPercent;
      whiteboardScrollX = x;
      whiteboardScrollY = y;
      whiteboardViewportSaveQueue = whiteboardViewportSaveQueue.then(async () => {
        const result = await window.pywebview.api.save_whiteboard_viewport(x, y, zoom);
        if (!result || !result.ok) throw new Error(result && result.error ? result.error : 'Whiteboard position could not be saved.');
        if (successText) setStatus(successText, 'saved');
      }).catch((error) => {
        console.error(error);
      });
      return whiteboardViewportSaveQueue;
    }

    function queueWhiteboardViewportSave(delay = 350, successText = '') {
      if (!initialized || !whiteboardExists) return;
      whiteboardScrollX = whiteboardLogicalScrollX();
      whiteboardScrollY = whiteboardLogicalScrollY();
      if (successText) whiteboardViewportSaveStatusText = successText;
      window.clearTimeout(whiteboardViewportSaveTimer);
      whiteboardViewportSaveTimer = window.setTimeout(() => {
        whiteboardViewportSaveTimer = null;
        const statusText = whiteboardViewportSaveStatusText;
        whiteboardViewportSaveStatusText = '';
        saveWhiteboardViewportNow(statusText);
      }, Math.max(0, delay));
    }

    async function flushWhiteboardViewportSave() {
      if (whiteboardViewportSaveTimer !== null) {
        window.clearTimeout(whiteboardViewportSaveTimer);
        whiteboardViewportSaveTimer = null;
        const statusText = whiteboardViewportSaveStatusText;
        whiteboardViewportSaveStatusText = '';
        await saveWhiteboardViewportNow(statusText);
      }
      await whiteboardViewportSaveQueue;
    }

    function updateWhiteboardToolbarState() {
      whiteboardToggleLabel.textContent = whiteboardModeActive ? 'Lecture' : 'Whiteboard';
      whiteboardToggleButton.title = whiteboardModeActive
        ? 'Return to the normal Lecture document'
        : 'Switch this Lecture to Whiteboard mode';
      lectureOnlyToolbarControls.forEach((control) => {
        control.disabled = whiteboardModeActive;
        control.classList.toggle('whiteboard-toolbar-disabled', whiteboardModeActive);
      });
      for (const control of [createQuestionButton, createTermButton, createInfoButton]) {
        control.disabled = whiteboardModeActive;
        control.classList.toggle('whiteboard-toolbar-disabled', whiteboardModeActive);
      }
      updateFormatMenu();
      updateWhiteboardZoomControls();
    }

    function setWhiteboardMode(active) {
      const next = Boolean(active);
      if (next === whiteboardModeActive) return;
      if (next) {
        finishActiveTextEditor(true);
        clearSlideTextSelection();
        clearSelectedImage();
        if (!infoPopover.hidden) closeInfoPopover(true);
        const created = ensureWhiteboardDimensions();
        whiteboardModeActive = true;
        notesPaper.hidden = true;
        whiteboardShell.hidden = false;
        notesStage.classList.add('whiteboard-active');
        updateWhiteboardWorldSize();
        renderWhiteboardStrokes();
        renderWhiteboardTexts();
        updateWhiteboardToolbarState();
        updateSlidesButton(editorWorkspace.classList.contains('split-preview'));
        whiteboardWorld.classList.toggle('draw-mode', SLIDE_DRAW_TOOLS.has(slideAnnotationMode));
        whiteboardWorld.classList.toggle('text-mode', slideAnnotationMode === 'text');
        window.requestAnimationFrame(() => {
          const scale = whiteboardZoomScale();
          whiteboardScrollport.scrollLeft = Math.max(0, whiteboardScrollX * scale);
          whiteboardScrollport.scrollTop = Math.max(0, whiteboardScrollY * scale);
          updateWhiteboardZoomControls();
        });
        if (created) scheduleWhiteboardSave(0, '✓ Whiteboard created');
      } else {
        finishActiveWhiteboardTextEditor(true);
        whiteboardScrollX = whiteboardLogicalScrollX();
        whiteboardScrollY = whiteboardLogicalScrollY();
        queueWhiteboardViewportSave(0);
        closeSlideTextContextMenu();
        clearWhiteboardTextSelection();
        whiteboardModeActive = false;
        whiteboardShell.hidden = true;
        notesPaper.hidden = false;
        notesStage.classList.remove('whiteboard-active');
        whiteboardWorld.classList.remove('draw-mode', 'text-mode');
        updateWhiteboardToolbarState();
        updateSlidesButton(editorWorkspace.classList.contains('split-preview'));
        if (!editorWorkspace.classList.contains('split-preview')) setSlideAnnotationMode(null);
        window.requestAnimationFrame(() => {
          updateImageLayoutToolbarPosition();
          positionInfoPopover();
        });
      }
    }

    function toggleWhiteboardMode() {
      setWhiteboardMode(!whiteboardModeActive);
    }

    function addWhiteboardHorizontalPage() {
      if (!whiteboardModeActive) return;
      ensureWhiteboardDimensions();
      whiteboardPagesX += 1;
      updateWhiteboardWorldSize();
      scheduleWhiteboardSave(0, '✓ Whiteboard width expanded');
    }

    function addWhiteboardVerticalPage() {
      if (!whiteboardModeActive) return;
      ensureWhiteboardDimensions();
      whiteboardPagesY += 1;
      updateWhiteboardWorldSize();
      scheduleWhiteboardSave(0, '✓ Whiteboard height expanded');
    }

    function whiteboardPointerPosition(event) {
      const bounds = whiteboardWorld.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return null;
      const scale = whiteboardZoomScale();
      return {
        x: Math.max(0, Math.min(whiteboardWorldWidth(), (event.clientX - bounds.left) / scale)),
        y: Math.max(0, Math.min(whiteboardWorldHeight(), (event.clientY - bounds.top) / scale))
      };
    }

    function eraseWhiteboardStrokesAt(position) {
      const radius = annotationEraserRadius(slideAnnotationSettings.eraser_size);
      const radiusSquared = radius * radius;
      let changed = false;
      for (let index = whiteboardStrokes.length - 1; index >= 0; index -= 1) {
        const stroke = whiteboardStrokes[index];
        const points = stroke.points;
        let touched = false;
        if (points.length === 1) {
          const dx = position.x - points[0].x;
          const dy = position.y - points[0].y;
          touched = dx * dx + dy * dy <= radiusSquared;
        } else {
          for (let pointIndex = 1; pointIndex < points.length; pointIndex += 1) {
            const a = points[pointIndex - 1];
            const b = points[pointIndex];
            if (distanceToSegmentSquared(position.x, position.y, a.x, a.y, b.x, b.y) <= radiusSquared) {
              touched = true;
              break;
            }
          }
        }
        if (!touched) continue;
        changed = true;
        whiteboardStrokes.splice(index, 1);
        const path = whiteboardSvg.querySelector(`[data-stroke-id="${CSS.escape(stroke.id)}"]`);
        if (path) path.remove();
      }
      return changed;
    }

    function beginWhiteboardAnnotationPointer(event) {
      if (!whiteboardModeActive || !slideAnnotationMode || event.button !== 0) return;
      if (slideAnnotationMode === 'label') return;
      if (event.target.closest('.whiteboard-text-editor')) return;
      if (slideAnnotationMode === 'text' && activeWhiteboardTextEditor) {
        event.preventDefault();
        event.stopPropagation();
        finishActiveWhiteboardTextEditor(true);
        return;
      }
      const position = whiteboardPointerPosition(event);
      if (!position) return;
      event.preventDefault();
      event.stopPropagation();
      if (slideAnnotationMode === 'text') {
        openWhiteboardTextEditor(position.x, position.y);
        return;
      }
      if (slideAnnotationMode === 'eraser') {
        whiteboardDrawState = {
          mode: 'eraser',
          pointerId: event.pointerId,
          changed: eraseWhiteboardStrokesAt(position)
        };
        try { whiteboardWorld.setPointerCapture(event.pointerId); } catch (_error) {}
        return;
      }
      const tool = slideAnnotationMode;
      const stroke = {
        id: makeSlideAnnotationId('wbstroke'),
        tool,
        color: slideAnnotationSettings[`${tool}_color`],
        size: slideAnnotationSettings[`${tool}_size`],
        points: [{x: position.x, y: position.y}]
      };
      const path = createWhiteboardStrokeElement(stroke);
      whiteboardSvg.appendChild(path);
      whiteboardDrawState = {mode: tool, pointerId: event.pointerId, stroke, path};
      try { whiteboardWorld.setPointerCapture(event.pointerId); } catch (_error) {}
    }

    function moveWhiteboardAnnotationPointer(event) {
      const state = whiteboardDrawState;
      if (!state || event.pointerId !== state.pointerId) return;
      const position = whiteboardPointerPosition(event);
      if (!position) return;
      event.preventDefault();
      event.stopPropagation();
      if (state.mode === 'eraser') {
        if (eraseWhiteboardStrokesAt(position)) state.changed = true;
        return;
      }
      const last = state.stroke.points[state.stroke.points.length - 1];
      const dx = position.x - last.x;
      const dy = position.y - last.y;
      if (dx * dx + dy * dy < 2.25) return;
      state.stroke.points.push({x: position.x, y: position.y});
      state.path.setAttribute('d', whiteboardPathData(state.stroke.points));
    }

    function endWhiteboardAnnotationPointer(event) {
      const state = whiteboardDrawState;
      if (!state || event.pointerId !== state.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      moveWhiteboardAnnotationPointer(event);
      whiteboardDrawState = null;
      try { whiteboardWorld.releasePointerCapture(event.pointerId); } catch (_error) {}
      if (state.mode === 'eraser') {
        if (state.changed) scheduleWhiteboardSave(0, '✓ Whiteboard drawing erased');
        return;
      }
      if (state.stroke.points.length === 1) {
        const point = state.stroke.points[0];
        state.stroke.points.push({x: Math.min(whiteboardWorldWidth(), point.x + 0.1), y: point.y});
        state.path.setAttribute('d', whiteboardPathData(state.stroke.points));
      }
      whiteboardStrokes.push(state.stroke);
      scheduleWhiteboardSave(0, '✓ Whiteboard drawing saved');
    }

    function cancelWhiteboardAnnotationPointer(event) {
      const state = whiteboardDrawState;
      if (!state || event.pointerId !== state.pointerId) return;
      whiteboardDrawState = null;
      try { whiteboardWorld.releasePointerCapture(event.pointerId); } catch (_error) {}
      if (state.mode === 'eraser') {
        if (state.changed) scheduleWhiteboardSave(0, '✓ Whiteboard drawing erased');
      } else if (state.path) {
        state.path.remove();
      }
    }

    function beginWhiteboardPan(event) {
      if (!whiteboardModeActive || event.button !== 2) return;
      if (event.target.closest('.whiteboard-text-annotation, .whiteboard-text-editor')) return;
      event.preventDefault();
      event.stopPropagation();
      whiteboardPanState = {
        pointerId: event.pointerId,
        startClientX: event.clientX,
        startClientY: event.clientY,
        startScrollLeft: whiteboardScrollport.scrollLeft,
        startScrollTop: whiteboardScrollport.scrollTop
      };
      whiteboardScrollport.classList.add('grabbing');
      try { whiteboardScrollport.setPointerCapture(event.pointerId); } catch (_error) {}
    }

    function moveWhiteboardPan(event) {
      const state = whiteboardPanState;
      if (!state || event.pointerId !== state.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      whiteboardScrollport.scrollLeft = state.startScrollLeft - (event.clientX - state.startClientX);
      whiteboardScrollport.scrollTop = state.startScrollTop - (event.clientY - state.startClientY);
    }

    function endWhiteboardPan(event) {
      const state = whiteboardPanState;
      if (!state || event.pointerId !== state.pointerId) return;
      moveWhiteboardPan(event);
      whiteboardPanState = null;
      whiteboardScrollport.classList.remove('grabbing');
      try { whiteboardScrollport.releasePointerCapture(event.pointerId); } catch (_error) {}
      queueWhiteboardViewportSave(0);
    }

    function cancelWhiteboardPan(event) {
      const state = whiteboardPanState;
      if (!state || event.pointerId !== state.pointerId) return;
      whiteboardPanState = null;
      whiteboardScrollport.classList.remove('grabbing');
      try { whiteboardScrollport.releasePointerCapture(event.pointerId); } catch (_error) {}
      queueWhiteboardViewportSave(0);
    }

    function finishActiveWhiteboardTextEditor(commit = true) {
      if (!activeWhiteboardTextEditor) return;
      const state = activeWhiteboardTextEditor;
      const exitTextCreationMode = commit && slideAnnotationMode === 'text' && !state.existing;
      const rich = serializeSlideTextRichContent(state.element, state.fontColor);
      const hasValue = Boolean(rich.text.trim());
      const width = Math.max(64, Math.min(whiteboardWorldWidth(), state.element.offsetWidth || state.width));
      const height = Math.max(30, Math.min(whiteboardWorldHeight(), state.element.offsetHeight || state.height));
      const x = Math.max(0, Math.min(whiteboardWorldWidth() - width, state.element.offsetLeft));
      const y = Math.max(0, Math.min(whiteboardWorldHeight() - height, state.element.offsetTop));
      activeWhiteboardTextEditor = null;
      closeSlideTextFormatToolbar();
      state.element.remove();
      selectedWhiteboardTextId = null;
      if (commit) {
        whiteboardTexts = whiteboardTexts.filter((item) => item.id !== state.id);
        if (hasValue) {
          whiteboardTexts.push({
            id: state.id,
            x,
            y,
            width,
            height,
            text: rich.text,
            font_color: state.fontColor,
            box_color: state.boxColor,
            format_runs: rich.format_runs
          });
        }
      }
      renderWhiteboardTexts();
      if (commit) {
        scheduleWhiteboardSave(0, hasValue ? '✓ Whiteboard text saved' : '✓ Whiteboard text deleted');
      } else {
        scheduleWhiteboardSave(0, '✓ Whiteboard edit cancelled');
      }
      if (exitTextCreationMode) setSlideAnnotationMode(null);
    }

    function openWhiteboardTextEditor(x, y, existing = null) {
      finishActiveTextEditor(true);
      finishActiveWhiteboardTextEditor(true);
      closeSlideTextContextMenu();
      clearWhiteboardTextSelection();
      const width = Math.min(whiteboardWorldWidth(), existing ? existing.width : 280);
      const height = Math.min(whiteboardWorldHeight(), existing ? existing.height : 100);
      x = Math.max(0, Math.min(whiteboardWorldWidth() - width, x));
      y = Math.max(0, Math.min(whiteboardWorldHeight() - height, y));
      const fontColor = existing ? existing.font_color : '#111827';
      const boxColor = existing ? existing.box_color : '#FFFFFF';
      const id = existing ? existing.id : makeSlideAnnotationId('wbtext');
      const editor = document.createElement('div');
      editor.className = 'slide-text-editor whiteboard-text-editor';
      editor.contentEditable = 'true';
      editor.spellcheck = true;
      editor.dataset.placeholder = 'Type on whiteboard…';
      editor.style.left = `${x}px`;
      editor.style.top = `${y}px`;
      editor.style.width = `${width}px`;
      editor.style.height = `${height}px`;
      editor.style.color = fontColor;
      editor.style.backgroundColor = boxColor;
      if (existing) renderSlideTextRichContent(editor, existing);
      if (existing) {
        const existingElement = whiteboardTextLayer.querySelector(`[data-text-id="${CSS.escape(existing.id)}"]`);
        if (existingElement) existingElement.remove();
      }
      whiteboardTextLayer.appendChild(editor);
      activeWhiteboardTextEditor = {
        kind: 'whiteboard',
        id,
        existing: Boolean(existing),
        element: editor,
        x,
        y,
        width,
        height,
        fontColor,
        boxColor,
        selectionStart: 0,
        selectionEnd: 0,
        suspendBlur: false
      };
      slideTextFormatToolbar.hidden = false;
      editor.addEventListener('pointerdown', (event) => event.stopPropagation());
      editor.addEventListener('mouseup', updateSlideTextFormatToolbarState);
      editor.addEventListener('keyup', updateSlideTextFormatToolbarState);
      editor.addEventListener('input', () => {
        updateSlideTextFormatToolbarState();
        scheduleWhiteboardSave(700);
      });
      editor.addEventListener('paste', (event) => {
        event.preventDefault();
        const text = event.clipboardData ? event.clipboardData.getData('text/plain') : '';
        insertPlainTextAtSlideSelection(editor, text);
        updateSlideTextFormatToolbarState();
        scheduleWhiteboardSave(700);
      });
      editor.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          finishActiveWhiteboardTextEditor(false);
        } else if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          editor.blur();
        } else if (event.key === 'Enter') {
          event.preventDefault();
          insertPlainTextAtSlideSelection(editor, '\n');
          updateSlideTextFormatToolbarState();
          scheduleWhiteboardSave(700);
        }
      });
      editor.addEventListener('blur', () => {
        window.setTimeout(() => {
          if (!activeWhiteboardTextEditor || activeWhiteboardTextEditor.element !== editor) return;
          if (activeWhiteboardTextEditor.suspendBlur) return;
          if (slideTextFormatToolbar.contains(document.activeElement)) return;
          finishActiveWhiteboardTextEditor(true);
        }, 0);
      });
      window.setTimeout(() => {
        if (!activeWhiteboardTextEditor || activeWhiteboardTextEditor.element !== editor) return;
        editor.focus();
        const end = editor.textContent.length;
        setSlideTextSelectionOffsets(editor, end, end);
        activeWhiteboardTextEditor.selectionStart = end;
        activeWhiteboardTextEditor.selectionEnd = end;
        updateSlideTextFormatToolbarState();
      }, 0);
    }

    async function handleWhiteboardTextContextAction(action) {
      const textId = slideTextContextId;
      const item = whiteboardTextItemById(textId);
      if (!item) {
        closeSlideTextContextMenu();
        return;
      }
      closeSlideTextContextMenu();
      if (action === 'font-color' || action === 'box-color') {
        const key = action === 'font-color' ? 'font_color' : 'box_color';
        const title = action === 'font-color' ? 'Choose font colour' : 'Choose text box colour';
        try {
          const result = await window.pywebview.api.choose_slide_annotation_color(item[key], title);
          if (!result.ok) throw new Error(result.error || 'Colour picker could not be opened.');
          if (!result.color) return;
          item[key] = normalizeAnnotationColor(result.color, item[key]);
          renderWhiteboardTexts();
          scheduleWhiteboardSave(0, `✓ ${action === 'font-color' ? 'Font' : 'Box'} colour saved`);
        } catch (error) {
          console.error(error);
          setStatus(error.message || 'Colour picker could not be opened.', 'error');
        }
        return;
      }
      if (action === 'copy' || action === 'cut') {
        try {
          const result = await window.pywebview.api.copy_text_to_clipboard(item.text);
          if (!result.ok) throw new Error(result.error || 'Text could not be copied.');
          if (action === 'copy') {
            setStatus('✓ Text copied', 'saved');
            return;
          }
          openWhiteboardTextEditor(item.x, item.y, {...item, text: '', format_runs: []});
          setStatus('✓ Text cut — type replacement text', 'saved');
        } catch (error) {
          console.error(error);
          setStatus(error.message || 'Text could not be copied.', 'error');
        }
        return;
      }
      if (action === 'paste') {
        try {
          const result = await window.pywebview.api.read_text_from_clipboard();
          if (!result.ok) throw new Error(result.error || 'Clipboard text could not be read.');
          const pasted = String(result.text || '');
          if (!pasted) return;
          if (item.text.length + pasted.length > 5000) throw new Error('Pasted text would make this Whiteboard text box too long.');
          item.text += pasted;
          renderWhiteboardTexts();
          scheduleWhiteboardSave(0, '✓ Clipboard text appended');
        } catch (error) {
          console.error(error);
          setStatus(error.message || 'Clipboard text could not be read.', 'error');
        }
        return;
      }
      if (action === 'delete') {
        whiteboardTexts = whiteboardTexts.filter((candidate) => candidate.id !== item.id);
        if (selectedWhiteboardTextId === item.id) selectedWhiteboardTextId = null;
        renderWhiteboardTexts();
        scheduleWhiteboardSave(0, '✓ Whiteboard text deleted');
      }
    }

    function closeSlideLabelPopover() {
      slideLabelPopover.hidden = true;
      slideLabelButton.setAttribute('aria-expanded', 'false');
    }

    function openSlideLabelPopover() {
      if (slideLabelMenu.hidden || slideLabelButton.disabled) return;
      closeDrawToolPopover();
      slideLabelPopover.hidden = false;
      slideLabelButton.setAttribute('aria-expanded', 'true');
    }

    function toggleSlideLabelPopover() {
      if (slideLabelPopover.hidden) openSlideLabelPopover();
      else closeSlideLabelPopover();
    }

    function closeDrawSizePopover() {
      drawSizePopover.hidden = true;
      activeSizeTool = null;
    }

    function closeDrawToolPopover() {
      drawToolPopover.hidden = true;
      drawMenuButton.setAttribute('aria-expanded', 'false');
      closeDrawSizePopover();
    }

    function openDrawToolPopover() {
      if (drawMenuButton.disabled) return;
      drawToolPopover.hidden = false;
      drawMenuButton.setAttribute('aria-expanded', 'true');
      updateDrawMenuUi();
    }

    function toggleDrawToolPopover() {
      if (drawToolPopover.hidden) openDrawToolPopover();
      else closeDrawToolPopover();
    }

    function openDrawSizePopover(tool, anchorButton) {
      activeSizeTool = tool;
      for (const option of drawSizeOptions) {
        option.classList.toggle('selected', option.dataset.drawSize === slideAnnotationSettings[`${tool}_size`]);
      }
      drawSizePopover.hidden = false;
      const anchorRect = anchorButton.getBoundingClientRect();
      const menuRect = drawToolPopover.getBoundingClientRect();
      const popupRect = drawSizePopover.getBoundingClientRect();
      const edge = 8;
      let left = anchorRect.left + (anchorRect.width - popupRect.width) / 2;
      let top = menuRect.bottom + 7;
      if (top + popupRect.height > window.innerHeight - edge) {
        top = menuRect.top - popupRect.height - 7;
      }
      left = Math.max(edge, Math.min(left, window.innerWidth - popupRect.width - edge));
      top = Math.max(edge, Math.min(top, window.innerHeight - popupRect.height - edge));
      drawSizePopover.style.left = `${Math.round(left)}px`;
      drawSizePopover.style.top = `${Math.round(top)}px`;
    }

    function updateDrawMenuUi() {
      drawToolCards.forEach((card) => {
        card.classList.toggle('selected', card.dataset.drawCard === slideAnnotationMode);
      });
      drawSizeButtons.forEach((button) => {
        const tool = button.dataset.sizeTool;
        const size = normalizeAnnotationSize(slideAnnotationSettings[`${tool}_size`]);
        const dot = button.querySelector('.draw-size-dot');
        if (dot) {
          dot.style.setProperty('--dot-size', `${annotationSizeDotPixels(size)}px`);
          const color = tool === 'marker'
            ? slideAnnotationSettings.marker_color
            : tool === 'highlighter'
              ? slideAnnotationSettings.highlighter_color
              : '#26C86F';
          dot.style.setProperty('--dot-color', color);
        }
      });
      slideLabelButton.classList.toggle('active', slideAnnotationMode === 'label');
      slideTextButton.classList.toggle('active', slideAnnotationMode === 'text');
      slideTextButton.setAttribute('aria-pressed', slideAnnotationMode === 'text' ? 'true' : 'false');
      const drawing = SLIDE_DRAW_TOOLS.has(slideAnnotationMode);
      drawMenuButton.classList.toggle('active', drawing);
      drawMenuButton.setAttribute('aria-pressed', drawing ? 'true' : 'false');
    }

    function setSlideAnnotationMode(mode) {
      const allowed = mode === 'text' || mode === 'label' || SLIDE_DRAW_TOOLS.has(mode) ? mode : null;
      const canAnnotateSlides = hasSlidesAttachment() && editorWorkspace.classList.contains('split-preview');
      const canAnnotate = allowed === 'label' ? canAnnotateSlides : (whiteboardModeActive || canAnnotateSlides);
      slideAnnotationMode = canAnnotate ? allowed : null;
      if (slideAnnotationMode !== 'label') pendingSlideLabelType = null;
      closeSlideTextContextMenu();
      clearSlideTextSelection();
      clearSlideLabelSelection();
      clearWhiteboardTextSelection();
      if (slideAnnotationMode) setBoxMode(false);
      slidesPdfViewer.classList.toggle('draw-mode', SLIDE_DRAW_TOOLS.has(slideAnnotationMode));
      slidesPdfViewer.classList.toggle('text-mode', slideAnnotationMode === 'text');
      slidesPdfViewer.classList.toggle('label-mode', slideAnnotationMode === 'label');
      whiteboardWorld.classList.toggle('draw-mode', whiteboardModeActive && SLIDE_DRAW_TOOLS.has(slideAnnotationMode));
      whiteboardWorld.classList.toggle('text-mode', whiteboardModeActive && slideAnnotationMode === 'text');
      updateDrawMenuUi();
      if (!slideAnnotationMode) {
        closeSlideLabelPopover();
        finishActiveTextEditor(false);
        finishActiveWhiteboardTextEditor(false);
      }
    }

    async function chooseSlideAnnotationColor(tool) {
      if (tool !== 'marker' && tool !== 'highlighter') return;
      closeDrawSizePopover();
      const key = `${tool}_color`;
      const label = tool === 'marker' ? 'drawing marker' : 'highlight marker';
      try {
        const result = await window.pywebview.api.choose_slide_annotation_color(
          slideAnnotationSettings[key],
          `Choose ${label} colour`
        );
        if (!result || !result.ok) {
          if (result && result.error) throw new Error(result.error);
          return;
        }
        if (!result.color) return;
        slideAnnotationSettings[key] = normalizeAnnotationColor(result.color, slideAnnotationSettings[key]);
        updateDrawMenuUi();
        closeDrawToolPopover();
        saveSlideAnnotationState(`✓ ${tool === 'marker' ? 'Marker' : 'Highlighter'} colour saved`);
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Colour picker could not be opened.', 'error');
      }
    }

    function annotationPathData(points) {
      if (!points.length) return '';
      const scale = 1000;
      return points.map((point, index) => {
        const x = Math.max(0, Math.min(scale, point.x * scale));
        const y = Math.max(0, Math.min(scale, point.y * scale));
        return `${index ? 'L' : 'M'} ${x.toFixed(2)} ${y.toFixed(2)}`;
      }).join(' ');
    }

    function createAnnotationStrokeElement(stroke) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.classList.add('slide-annotation-stroke');
      path.dataset.strokeId = stroke.id;
      path.setAttribute('d', annotationPathData(stroke.points));
      path.setAttribute('stroke', stroke.color);
      path.setAttribute('stroke-width', String(annotationStrokeWidth(stroke.tool, stroke.size)));
      path.setAttribute('opacity', stroke.tool === 'highlighter' ? '0.36' : '1');
      return path;
    }

    function ensureAnnotationSvg(layer) {
      let svg = layer.querySelector('.slide-annotation-svg');
      if (svg) return svg;
      svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.classList.add('slide-annotation-svg');
      svg.setAttribute('viewBox', '0 0 1000 1000');
      svg.setAttribute('preserveAspectRatio', 'none');
      layer.prepend(svg);
      return svg;
    }

    function estimateSlideLabelGeometry(label, layer, centerX, centerY) {
      const bounds = layer.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return null;
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      let textWidth = label.length * 9.5;
      if (context) {
        context.font = '700 16px Arial';
        textWidth = context.measureText(label).width;
      }
      const pixelWidth = Math.max(42, Math.ceil(textWidth + 18));
      const pixelHeight = 28;
      const width = Math.max(0.035, Math.min(0.5, pixelWidth / bounds.width));
      const height = Math.max(0.022, Math.min(0.25, pixelHeight / bounds.height));
      return {
        width,
        height,
        x: Math.max(0, Math.min(1 - width, centerX - width / 2)),
        y: Math.max(0, Math.min(1 - height, centerY - height / 2))
      };
    }

    function applySlideLabelGeometry(element, item, layer) {
      element.style.left = `${item.x * 100}%`;
      element.style.top = `${item.y * 100}%`;
      element.style.width = `${item.width * 100}%`;
      element.style.height = `${item.height * 100}%`;
      const bounds = layer.getBoundingClientRect();
      if (bounds.height) {
        const pixelHeight = item.height * bounds.height;
        element.style.fontSize = `${Math.max(9, Math.min(42, pixelHeight * 0.57))}px`;
        element.style.padding = `${Math.max(2, Math.min(8, pixelHeight * 0.11))}px ${Math.max(5, Math.min(16, pixelHeight * 0.28))}px`;
      }
    }

    function slideLabelItemById(labelId) {
      return slideAnnotationLabels.find((item) => item.id === labelId) || null;
    }

    function updateSlideLabelSelectionUi() {
      for (const element of slidesPdfViewer.querySelectorAll('.slide-label-annotation')) {
        element.classList.toggle('selected', element.dataset.labelId === selectedSlideLabelId);
      }
    }

    function selectSlideLabel(labelId) {
      clearSlideTextSelection();
      selectedSlideLabelId = labelId || null;
      updateSlideLabelSelectionUi();
    }

    function clearSlideLabelSelection() {
      if (!selectedSlideLabelId) return;
      selectedSlideLabelId = null;
      updateSlideLabelSelectionUi();
    }

    function beginSlideLabelTransform(event, item, layer, element, mode = 'move', handle = '') {
      if (event.button !== 0 || slideAnnotationMode) return;
      event.preventDefault();
      event.stopPropagation();
      closeSlideLabelContextMenu();
      selectSlideLabel(item.id);
      const bounds = layer.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return;
      const captureTarget = event.currentTarget;
      slideLabelTransformState = {
        pointerId: event.pointerId,
        mode,
        handle,
        item,
        layer,
        element,
        captureTarget,
        bounds,
        undoSnapshot: snapshotSlideUndoState(),
        startClientX: event.clientX,
        startClientY: event.clientY,
        start: {x: item.x, y: item.y, width: item.width, height: item.height},
        changed: false
      };
      try { captureTarget.setPointerCapture(event.pointerId); } catch (_error) {}
    }

    function moveSlideLabelTransform(event) {
      const state = slideLabelTransformState;
      if (!state || event.pointerId !== state.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      const dx = (event.clientX - state.startClientX) / state.bounds.width;
      const dy = (event.clientY - state.startClientY) / state.bounds.height;
      const start = state.start;
      let x = start.x;
      let y = start.y;
      let width = start.width;
      let height = start.height;

      if (state.mode === 'move') {
        x = Math.max(0, Math.min(1 - width, start.x + dx));
        y = Math.max(0, Math.min(1 - height, start.y + dy));
      } else {
        const minWidth = Math.max(0.035, 34 / state.bounds.width);
        const minHeight = Math.max(0.022, 22 / state.bounds.height);
        let left = start.x;
        let top = start.y;
        let right = start.x + start.width;
        let bottom = start.y + start.height;
        if (state.handle.includes('w')) left = Math.max(0, Math.min(right - minWidth, start.x + dx));
        if (state.handle.includes('e')) right = Math.min(1, Math.max(left + minWidth, start.x + start.width + dx));
        if (state.handle.includes('n')) top = Math.max(0, Math.min(bottom - minHeight, start.y + dy));
        if (state.handle.includes('s')) bottom = Math.min(1, Math.max(top + minHeight, start.y + start.height + dy));
        x = left;
        y = top;
        width = right - left;
        height = bottom - top;
      }

      const changed = Math.abs(x - state.item.x) > 0.000001
        || Math.abs(y - state.item.y) > 0.000001
        || Math.abs(width - state.item.width) > 0.000001
        || Math.abs(height - state.item.height) > 0.000001;
      if (!changed) return;
      state.changed = true;
      state.item.x = x;
      state.item.y = y;
      state.item.width = width;
      state.item.height = height;
      applySlideLabelGeometry(state.element, state.item, state.layer);
    }

    function endSlideLabelTransform(event) {
      const state = slideLabelTransformState;
      if (!state || event.pointerId !== state.pointerId) return;
      moveSlideLabelTransform(event);
      slideLabelTransformState = null;
      try { state.captureTarget.releasePointerCapture(event.pointerId); } catch (_error) {}
      if (state.changed) {
        commitSlideUndoSnapshot(state.undoSnapshot);
        saveSlideAnnotationState(state.mode === 'move' ? '✓ Slide label position saved' : '✓ Slide label resized');
      }
    }

    function cancelSlideLabelTransform(event) {
      const state = slideLabelTransformState;
      if (!state || event.pointerId !== state.pointerId) return;
      slideLabelTransformState = null;
      try { state.captureTarget.releasePointerCapture(event.pointerId); } catch (_error) {}
      Object.assign(state.item, state.start);
      applySlideLabelGeometry(state.element, state.item, state.layer);
    }

    function addSlideLabelResizeHandles(element, item, layer) {
      for (const handle of ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) {
        const grip = document.createElement('span');
        grip.className = 'slide-text-resize-handle';
        grip.dataset.handle = handle;
        grip.title = `Resize ${handle.toUpperCase()}`;
        grip.addEventListener('pointerdown', (event) => beginSlideLabelTransform(event, item, layer, element, 'resize', handle));
        grip.addEventListener('pointermove', moveSlideLabelTransform);
        grip.addEventListener('pointerup', endSlideLabelTransform);
        grip.addEventListener('pointercancel', cancelSlideLabelTransform);
        element.appendChild(grip);
      }
    }

    function createSlideLabelElement(item, layer) {
      const element = document.createElement('div');
      element.className = 'slide-label-annotation';
      element.dataset.labelId = item.id;
      element.tabIndex = -1;
      element.textContent = item.label;
      applySlideLabelGeometry(element, item, layer);
      addSlideLabelResizeHandles(element, item, layer);
      element.classList.toggle('selected', selectedSlideLabelId === item.id);
      element.title = 'Click to select. Drag to move. Right-click to delete.';
      element.addEventListener('pointerdown', (event) => {
        if (slideAnnotationMode || event.target.closest('.slide-text-resize-handle')) return;
        try { element.focus({preventScroll: true}); } catch (_error) { element.focus(); }
        beginSlideLabelTransform(event, item, layer, element, 'move');
      });
      element.addEventListener('pointermove', moveSlideLabelTransform);
      element.addEventListener('pointerup', endSlideLabelTransform);
      element.addEventListener('pointercancel', cancelSlideLabelTransform);
      element.addEventListener('click', (event) => {
        if (slideAnnotationMode || event.target.closest('.slide-text-resize-handle')) return;
        event.preventDefault();
        event.stopPropagation();
        try { element.focus({preventScroll: true}); } catch (_error) { element.focus(); }
        selectSlideLabel(item.id);
      });
      element.addEventListener('contextmenu', (event) => {
        if (slideAnnotationMode) return;
        event.preventDefault();
        event.stopPropagation();
        openSlideLabelContextMenu(event, item);
      });
      return element;
    }

    function placeSlideLabel(layer, pageNumber, position) {
      if (!pendingSlideLabelType) return false;
      const undoSnapshot = snapshotSlideUndoState();
      const geometry = estimateSlideLabelGeometry(pendingSlideLabelType, layer, position.x, position.y);
      if (!geometry) return false;
      const item = {
        id: makeSlideAnnotationId('label'),
        page_number: pageNumber,
        label: pendingSlideLabelType,
        ...geometry
      };
      slideAnnotationLabels.push(item);
      pendingSlideLabelType = null;
      setSlideAnnotationMode(null);
      renderSlideAnnotationsForLayer(layer, pageNumber);
      selectSlideLabel(item.id);
      commitSlideUndoSnapshot(undoSnapshot);
      saveSlideAnnotationState(`✓ ${item.label} label placed`);
      return true;
    }

    function applySlideTextGeometry(element, item) {
      element.style.left = `${item.x * 100}%`;
      element.style.top = `${item.y * 100}%`;
      element.style.width = `${item.width * 100}%`;
      element.style.height = `${item.height * 100}%`;
      element.style.color = item.font_color;
      element.style.backgroundColor = item.box_color;
    }

    function slideTextItemById(textId) {
      return slideAnnotationTexts.find((item) => item.id === textId) || null;
    }

    function slideTextLayerForItem(item) {
      if (!item) return null;
      return slidesPdfViewer.querySelector(`.slide-annotation-layer[data-page-number="${item.page_number}"]`);
    }

    function updateSlideTextSelectionUi() {
      for (const element of slidesPdfViewer.querySelectorAll('.slide-text-annotation')) {
        element.classList.toggle('selected', element.dataset.textId === selectedSlideTextId);
      }
    }

    function selectSlideText(textId) {
      clearSlideLabelSelection();
      selectedSlideTextId = textId || null;
      updateSlideTextSelectionUi();
    }

    function clearSlideTextSelection() {
      if (!selectedSlideTextId) return;
      selectedSlideTextId = null;
      updateSlideTextSelectionUi();
    }

    function closeSlideLabelContextMenu() {
      slideLabelContextMenu.hidden = true;
      slideLabelContextId = null;
    }

    function openSlideLabelContextMenu(event, item) {
      closeSlideTextContextMenu();
      closeSlideLabelContextMenu();
      selectSlideLabel(item.id);
      slideLabelContextId = item.id;
      slideLabelContextMenu.hidden = false;
      const menuRect = slideLabelContextMenu.getBoundingClientRect();
      const edge = 8;
      const left = Math.max(edge, Math.min(event.clientX, window.innerWidth - menuRect.width - edge));
      const top = Math.max(edge, Math.min(event.clientY, window.innerHeight - menuRect.height - edge));
      slideLabelContextMenu.style.left = `${Math.round(left)}px`;
      slideLabelContextMenu.style.top = `${Math.round(top)}px`;
    }

    function deleteSlideLabelById(labelId, successText = '✓ Slide label deleted') {
      const item = slideLabelItemById(labelId);
      if (!item) {
        closeSlideLabelContextMenu();
        return false;
      }
      const undoSnapshot = snapshotSlideUndoState();
      slideAnnotationLabels = slideAnnotationLabels.filter((candidate) => candidate.id !== item.id);
      if (selectedSlideLabelId === item.id) selectedSlideLabelId = null;
      closeSlideLabelContextMenu();
      const layer = slidesPdfViewer.querySelector(`.slide-annotation-layer[data-page-number="${item.page_number}"]`);
      if (layer) renderSlideAnnotationsForLayer(layer, item.page_number);
      commitSlideUndoSnapshot(undoSnapshot);
      saveSlideAnnotationState(successText);
      return true;
    }

    function closeSlideTextContextMenu() {
      slideTextContextMenu.hidden = true;
      slideTextContextId = null;
      slideTextContextKind = null;
    }

    function openSlideTextContextMenu(event, item) {
      closeSlideTextContextMenu();
      clearSlideTextSelection();
      slideTextContextId = item.id;
      slideTextContextKind = 'slide';
      slideTextContextMenu.hidden = false;
      const menuRect = slideTextContextMenu.getBoundingClientRect();
      const edge = 8;
      const left = Math.max(edge, Math.min(event.clientX, window.innerWidth - menuRect.width - edge));
      const top = Math.max(edge, Math.min(event.clientY, window.innerHeight - menuRect.height - edge));
      slideTextContextMenu.style.left = `${Math.round(left)}px`;
      slideTextContextMenu.style.top = `${Math.round(top)}px`;
    }

    function beginSlideTextTransform(event, item, layer, element, mode, handle = '') {
      if (event.button !== 0 || slideAnnotationMode) return;
      event.preventDefault();
      event.stopPropagation();
      closeSlideTextContextMenu();
      selectSlideText(item.id);
      const bounds = layer.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return;
      const captureTarget = event.currentTarget;
      slideTextTransformState = {
        pointerId: event.pointerId,
        mode,
        handle,
        item,
        layer,
        element,
        captureTarget,
        bounds,
        undoSnapshot: snapshotSlideUndoState(),
        startClientX: event.clientX,
        startClientY: event.clientY,
        start: {
          x: item.x,
          y: item.y,
          width: item.width,
          height: item.height
        },
        changed: false
      };
      try { captureTarget.setPointerCapture(event.pointerId); } catch (_error) {}
    }

    function moveSlideTextTransform(event) {
      const state = slideTextTransformState;
      if (!state || event.pointerId !== state.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      const dx = (event.clientX - state.startClientX) / state.bounds.width;
      const dy = (event.clientY - state.startClientY) / state.bounds.height;
      const start = state.start;
      let x = start.x;
      let y = start.y;
      let width = start.width;
      let height = start.height;

      if (state.mode === 'move') {
        x = Math.max(0, Math.min(1 - width, start.x + dx));
        y = Math.max(0, Math.min(1 - height, start.y + dy));
      } else {
        const minWidth = Math.max(0.06, 64 / state.bounds.width);
        const minHeight = Math.max(0.03, 30 / state.bounds.height);
        let left = start.x;
        let top = start.y;
        let right = start.x + start.width;
        let bottom = start.y + start.height;
        if (state.handle.includes('w')) left = Math.max(0, Math.min(right - minWidth, start.x + dx));
        if (state.handle.includes('e')) right = Math.min(1, Math.max(left + minWidth, start.x + start.width + dx));
        if (state.handle.includes('n')) top = Math.max(0, Math.min(bottom - minHeight, start.y + dy));
        if (state.handle.includes('s')) bottom = Math.min(1, Math.max(top + minHeight, start.y + start.height + dy));
        x = left;
        y = top;
        width = right - left;
        height = bottom - top;
      }

      const changed = Math.abs(x - state.item.x) > 0.000001
        || Math.abs(y - state.item.y) > 0.000001
        || Math.abs(width - state.item.width) > 0.000001
        || Math.abs(height - state.item.height) > 0.000001;
      if (!changed) return;
      state.changed = true;
      state.item.x = x;
      state.item.y = y;
      state.item.width = width;
      state.item.height = height;
      applySlideTextGeometry(state.element, state.item);
    }

    function endSlideTextTransform(event) {
      const state = slideTextTransformState;
      if (!state || event.pointerId !== state.pointerId) return;
      moveSlideTextTransform(event);
      slideTextTransformState = null;
      try { state.captureTarget.releasePointerCapture(event.pointerId); } catch (_error) {}
      if (state.changed) {
        commitSlideUndoSnapshot(state.undoSnapshot);
        saveSlideAnnotationState('✓ Slide text position saved');
      }
    }

    function cancelSlideTextTransform(event) {
      const state = slideTextTransformState;
      if (!state || event.pointerId !== state.pointerId) return;
      slideTextTransformState = null;
      try { state.captureTarget.releasePointerCapture(event.pointerId); } catch (_error) {}
      state.item.x = state.start.x;
      state.item.y = state.start.y;
      state.item.width = state.start.width;
      state.item.height = state.start.height;
      applySlideTextGeometry(state.element, state.item);
    }

    function addSlideTextSelectionControls(element, item, layer) {
      for (const edge of ['n', 'e', 's', 'w']) {
        const zone = document.createElement('span');
        zone.className = 'slide-text-move-zone';
        zone.dataset.edge = edge;
        zone.title = 'Drag to move text box';
        zone.addEventListener('pointerdown', (event) => beginSlideTextTransform(event, item, layer, element, 'move'));
        zone.addEventListener('pointermove', moveSlideTextTransform);
        zone.addEventListener('pointerup', endSlideTextTransform);
        zone.addEventListener('pointercancel', cancelSlideTextTransform);
        element.appendChild(zone);
      }
      for (const handle of ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) {
        const grip = document.createElement('span');
        grip.className = 'slide-text-resize-handle';
        grip.dataset.handle = handle;
        grip.title = `Resize ${handle.toUpperCase()}`;
        grip.addEventListener('pointerdown', (event) => beginSlideTextTransform(event, item, layer, element, 'resize', handle));
        grip.addEventListener('pointermove', moveSlideTextTransform);
        grip.addEventListener('pointerup', endSlideTextTransform);
        grip.addEventListener('pointercancel', cancelSlideTextTransform);
        element.appendChild(grip);
      }
    }

    function createSlideTextElement(item, layer) {
      const element = document.createElement('div');
      element.className = 'slide-text-annotation';
      element.dataset.textId = item.id;
      applySlideTextGeometry(element, item);
      const textNode = document.createElement('span');
      textNode.className = 'slide-text-content';
      renderSlideTextRichContent(textNode, item);
      element.appendChild(textNode);
      addSlideTextSelectionControls(element, item, layer);
      element.classList.toggle('selected', selectedSlideTextId === item.id);
      element.title = 'Click to select. Double-click to edit. Right-click for options.';
      element.addEventListener('click', (event) => {
        if (slideAnnotationMode || event.target.closest('.slide-text-resize-handle, .slide-text-move-zone')) return;
        event.preventDefault();
        event.stopPropagation();
        closeSlideTextContextMenu();
        selectSlideText(item.id);
      });
      element.addEventListener('dblclick', (event) => {
        if (slideAnnotationMode || event.target.closest('.slide-text-resize-handle, .slide-text-move-zone')) return;
        event.preventDefault();
        event.stopPropagation();
        openSlideTextEditor(layer, item.page_number, item.x, item.y, item);
      });
      element.addEventListener('contextmenu', (event) => {
        if (slideAnnotationMode) return;
        event.preventDefault();
        event.stopPropagation();
        openSlideTextContextMenu(event, item);
      });
      return element;
    }

    function renderSlideAnnotationsForLayer(layer, pageNumber) {
      if (!layer) return;
      if (activeTextEditor && activeTextEditor.layer === layer) return;
      layer.replaceChildren();
      const svg = ensureAnnotationSvg(layer);
      for (const stroke of slideAnnotationStrokes) {
        if (stroke.page_number === pageNumber) svg.appendChild(createAnnotationStrokeElement(stroke));
      }
      for (const item of slideAnnotationTexts) {
        if (item.page_number === pageNumber) layer.appendChild(createSlideTextElement(item, layer));
      }
      for (const item of slideAnnotationLabels) {
        if (item.page_number === pageNumber) layer.appendChild(createSlideLabelElement(item, layer));
      }
    }

    function refreshSlideAnnotations() {
      for (const layer of slidesPdfViewer.querySelectorAll('.slide-annotation-layer')) {
        const pageNumber = Number(layer.dataset.pageNumber);
        if (Number.isInteger(pageNumber)) renderSlideAnnotationsForLayer(layer, pageNumber);
      }
    }

    function annotationPointerPosition(event, layer) {
      const bounds = layer.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return null;
      return {
        x: Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width)),
        y: Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height)),
        bounds
      };
    }

    function activeTextFormattingState() {
      return activeWhiteboardTextEditor || activeTextEditor;
    }

    function positionSlideTextFormatToolbar() {
      const activeState = activeTextFormattingState();
      if (!activeState || slideTextFormatToolbar.hidden) return;
      const editorRect = activeState.element.getBoundingClientRect();
      const toolbarRect = slideTextFormatToolbar.getBoundingClientRect();
      const edge = 8;
      let left = Math.max(edge, Math.min(editorRect.left, window.innerWidth - toolbarRect.width - edge));
      let top = editorRect.top - toolbarRect.height - 8;
      if (top < edge) top = Math.min(window.innerHeight - toolbarRect.height - edge, editorRect.bottom + 8);
      slideTextFormatToolbar.style.left = `${Math.round(left)}px`;
      slideTextFormatToolbar.style.top = `${Math.round(Math.max(edge, top))}px`;
    }

    function slideTextSelectionOffsets(editor) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return null;
      const range = selection.getRangeAt(0);
      if (!editor.contains(range.startContainer) || !editor.contains(range.endContainer)) return null;
      try {
        const beforeStart = document.createRange();
        beforeStart.selectNodeContents(editor);
        beforeStart.setEnd(range.startContainer, range.startOffset);
        const beforeEnd = document.createRange();
        beforeEnd.selectNodeContents(editor);
        beforeEnd.setEnd(range.endContainer, range.endOffset);
        const start = beforeStart.toString().length;
        const end = beforeEnd.toString().length;
        return {start: Math.min(start, end), end: Math.max(start, end)};
      } catch (_error) {
        return null;
      }
    }

    function setSlideTextSelectionOffsets(editor, start, end) {
      const textLength = editor.textContent.length;
      const targetStart = Math.max(0, Math.min(textLength, Number(start) || 0));
      const targetEnd = Math.max(targetStart, Math.min(textLength, Number(end) || targetStart));
      const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
      let current = walker.nextNode();
      let offset = 0;
      let startNode = null;
      let startOffset = 0;
      let endNode = null;
      let endOffset = 0;
      while (current) {
        const nextOffset = offset + current.data.length;
        if (!startNode && targetStart >= offset && targetStart <= nextOffset) {
          startNode = current;
          startOffset = targetStart - offset;
        }
        if (!endNode && targetEnd >= offset && targetEnd <= nextOffset) {
          endNode = current;
          endOffset = targetEnd - offset;
        }
        if (startNode && endNode) break;
        offset = nextOffset;
        current = walker.nextNode();
      }
      if (!startNode || !endNode) {
        if (!editor.firstChild) editor.appendChild(document.createTextNode(''));
        const fallback = editor.lastChild.nodeType === Node.TEXT_NODE
          ? editor.lastChild
          : editor.appendChild(document.createTextNode(''));
        startNode = startNode || fallback;
        endNode = endNode || fallback;
        startOffset = startNode.data.length;
        endOffset = endNode.data.length;
      }
      const range = document.createRange();
      range.setStart(startNode, Math.min(startOffset, startNode.data.length));
      range.setEnd(endNode, Math.min(endOffset, endNode.data.length));
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function updateSlideTextFormatToolbarState() {
      const state = activeTextFormattingState();
      if (!state) {
        slideTextFormatToolbar.hidden = true;
        return;
      }
      const selection = slideTextSelectionOffsets(state.element);
      if (selection) {
        state.selectionStart = selection.start;
        state.selectionEnd = selection.end;
      }
      const hasSelection = Number.isInteger(state.selectionStart)
        && Number.isInteger(state.selectionEnd)
        && state.selectionEnd > state.selectionStart;
      for (const button of slideTextFormatActions) button.disabled = !hasSelection;
      slideTextFormatToolbar.hidden = false;
      positionSlideTextFormatToolbar();
    }

    function insertPlainTextAtSlideSelection(editor, text) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return;
      const range = selection.getRangeAt(0);
      if (!editor.contains(range.startContainer) || !editor.contains(range.endContainer)) return;
      range.deleteContents();
      const node = document.createTextNode(String(text || ''));
      range.insertNode(node);
      range.setStartAfter(node);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function closeSlideTextFormatToolbar() {
      slideTextFormatToolbar.hidden = true;
    }

    function updateSlideTextRunsForSelection(text, rawRuns, defaultFontColor, start, end, action, color = null) {
      const length = text.length;
      const fontAt = new Array(length).fill(null);
      const highlightAt = new Array(length).fill(null);
      for (const run of normalizeSlideTextFormatRuns(rawRuns, length)) {
        for (let index = run.start; index < run.end; index += 1) {
          if (run.font_color) fontAt[index] = run.font_color;
          if (run.highlight_color) highlightAt[index] = run.highlight_color;
        }
      }
      const safeStart = Math.max(0, Math.min(length, start));
      const safeEnd = Math.max(safeStart, Math.min(length, end));
      const normalizedDefault = normalizeAnnotationColor(defaultFontColor, '#111827');
      const normalizedColor = normalizeOptionalAnnotationColor(color);
      for (let index = safeStart; index < safeEnd; index += 1) {
        if (action === 'font-color') {
          fontAt[index] = normalizedColor === normalizedDefault ? null : normalizedColor;
        } else if (action === 'highlight-color') {
          highlightAt[index] = normalizedColor;
        } else if (action === 'clear-highlight') {
          highlightAt[index] = null;
        }
      }
      const runs = [];
      let index = 0;
      while (index < length) {
        const fontColor = fontAt[index];
        const highlightColor = highlightAt[index];
        if (!fontColor && !highlightColor) {
          index += 1;
          continue;
        }
        let runEnd = index + 1;
        while (runEnd < length && fontAt[runEnd] === fontColor && highlightAt[runEnd] === highlightColor) runEnd += 1;
        runs.push({
          start: index,
          end: runEnd,
          font_color: fontColor,
          highlight_color: highlightColor
        });
        index = runEnd;
      }
      return runs;
    }

    async function applySlideTextSelectionFormat(action) {
      const state = activeTextFormattingState();
      if (!state) return;
      const editor = state.element;
      updateSlideTextFormatToolbarState();
      const start = state.selectionStart;
      const end = state.selectionEnd;
      if (!Number.isInteger(start) || !Number.isInteger(end) || end <= start) {
        setStatus('Select part of the text first.', 'error');
        return;
      }

      let color = null;
      if (action === 'font-color' || action === 'highlight-color') {
        state.suspendBlur = true;
        try {
          const initial = action === 'font-color' ? state.fontColor : '#FFE14F';
          const title = action === 'font-color'
            ? 'Choose selected text colour'
            : 'Choose selected text highlight colour';
          const result = await window.pywebview.api.choose_slide_annotation_color(initial, title);
          if (!result.ok) throw new Error(result.error || 'Colour picker could not be opened.');
          if (!result.color) return;
          color = normalizeAnnotationColor(result.color, initial);
        } catch (error) {
          console.error(error);
          setStatus(error.message || 'Colour picker could not be opened.', 'error');
          return;
        } finally {
          state.suspendBlur = false;
        }
      }

      const stillActive = activeTextFormattingState();
      if (!stillActive || stillActive.element !== editor) return;
      const rich = serializeSlideTextRichContent(editor, state.fontColor);
      const nextRuns = updateSlideTextRunsForSelection(
        rich.text,
        rich.format_runs,
        state.fontColor,
        start,
        end,
        action,
        color
      );
      renderSlideTextRichContent(editor, {text: rich.text, format_runs: nextRuns});
      editor.focus();
      state.selectionStart = start;
      state.selectionEnd = end;
      setSlideTextSelectionOffsets(editor, start, end);
      updateSlideTextFormatToolbarState();
      setStatus(action === 'font-color'
        ? '✓ Selected text colour changed'
        : action === 'highlight-color'
          ? '✓ Selected text highlighted'
          : '✓ Selected text highlight removed', 'saved');
      if (state.kind === 'whiteboard') scheduleWhiteboardSave(0);
    }

    function finishActiveTextEditor(commit = true) {
      if (!activeTextEditor) return;
      const state = activeTextEditor;
      const exitTextCreationMode = commit && slideAnnotationMode === 'text' && !state.existingId;
      const rich = serializeSlideTextRichContent(state.element, state.fontColor);
      const value = rich.text;
      const hasValue = Boolean(value.trim());
      activeTextEditor = null;
      closeSlideTextFormatToolbar();
      const layerBounds = state.layer.getBoundingClientRect();
      const editorBounds = state.element.getBoundingClientRect();
      let width = state.width;
      let height = state.height;
      let x = state.x;
      let y = state.y;
      if (layerBounds.width && layerBounds.height) {
        width = Math.max(0.06, Math.min(1, editorBounds.width / layerBounds.width));
        height = Math.max(0.03, Math.min(1, editorBounds.height / layerBounds.height));
        x = Math.max(0, Math.min(1 - width, (editorBounds.left - layerBounds.left) / layerBounds.width));
        y = Math.max(0, Math.min(1 - height, (editorBounds.top - layerBounds.top) / layerBounds.height));
      }
      state.element.remove();
      selectedSlideTextId = null;
      if (commit) {
        if (state.existingId) {
          slideAnnotationTexts = slideAnnotationTexts.filter((item) => item.id !== state.existingId);
        }
        if (hasValue) {
          slideAnnotationTexts.push({
            id: state.existingId || makeSlideAnnotationId('text'),
            page_number: state.pageNumber,
            x,
            y,
            width,
            height,
            text: value,
            font_color: state.fontColor,
            box_color: state.boxColor,
            format_runs: rich.format_runs
          });
        }
      }
      renderSlideAnnotationsForLayer(state.layer, state.pageNumber);
      if (commit) {
        commitSlideUndoSnapshot(state.undoSnapshot);
        saveSlideAnnotationState(hasValue ? '✓ Slide text saved' : '✓ Slide text deleted');
      }
      if (exitTextCreationMode) setSlideAnnotationMode(null);
    }

    function openSlideTextEditor(layer, pageNumber, x, y, existing = null) {
      finishActiveWhiteboardTextEditor(true);
      finishActiveTextEditor(true);
      closeSlideTextContextMenu();
      clearSlideTextSelection();
      const width = existing ? existing.width : 0.28;
      const height = existing ? existing.height : 0.08;
      x = Math.max(0, Math.min(1 - width, x));
      y = Math.max(0, Math.min(1 - height, y));
      const fontColor = existing ? existing.font_color : '#111827';
      const boxColor = existing ? existing.box_color : '#FFFFFF';
      const editor = document.createElement('div');
      editor.className = 'slide-text-editor';
      editor.contentEditable = 'true';
      editor.spellcheck = true;
      editor.dataset.placeholder = 'Type on slide…';
      editor.style.left = `${x * 100}%`;
      editor.style.top = `${y * 100}%`;
      editor.style.width = `${width * 100}%`;
      editor.style.height = `${height * 100}%`;
      editor.style.color = fontColor;
      editor.style.backgroundColor = boxColor;
      if (existing) renderSlideTextRichContent(editor, existing);
      if (existing) {
        const existingElement = layer.querySelector(`[data-text-id="${CSS.escape(existing.id)}"]`);
        if (existingElement) existingElement.remove();
      }
      layer.appendChild(editor);
      activeTextEditor = {
        kind: 'slide',
        element: editor,
        layer,
        pageNumber,
        x,
        y,
        width,
        height,
        fontColor,
        boxColor,
        undoSnapshot: snapshotSlideUndoState(),
        existingId: existing ? existing.id : null,
        selectionStart: 0,
        selectionEnd: 0,
        suspendBlur: false
      };
      slideTextFormatToolbar.hidden = false;
      editor.addEventListener('pointerdown', (event) => event.stopPropagation());
      editor.addEventListener('mouseup', updateSlideTextFormatToolbarState);
      editor.addEventListener('keyup', updateSlideTextFormatToolbarState);
      editor.addEventListener('input', updateSlideTextFormatToolbarState);
      editor.addEventListener('paste', (event) => {
        event.preventDefault();
        const text = event.clipboardData ? event.clipboardData.getData('text/plain') : '';
        insertPlainTextAtSlideSelection(editor, text);
        updateSlideTextFormatToolbarState();
      });
      editor.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          finishActiveTextEditor(false);
        } else if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          editor.blur();
        } else if (event.key === 'Enter') {
          event.preventDefault();
          insertPlainTextAtSlideSelection(editor, '\n');
          updateSlideTextFormatToolbarState();
        }
      });
      editor.addEventListener('blur', () => {
        window.setTimeout(() => {
          if (!activeTextEditor || activeTextEditor.element !== editor) return;
          if (activeTextEditor.suspendBlur) return;
          if (slideTextFormatToolbar.contains(document.activeElement)) return;
          finishActiveTextEditor(true);
        }, 0);
      });
      window.setTimeout(() => {
        if (!activeTextEditor || activeTextEditor.element !== editor) return;
        editor.focus();
        const end = editor.textContent.length;
        setSlideTextSelectionOffsets(editor, end, end);
        activeTextEditor.selectionStart = end;
        activeTextEditor.selectionEnd = end;
        updateSlideTextFormatToolbarState();
      }, 0);
    }

    async function handleSlideTextContextAction(action) {
      if (slideTextContextKind === 'whiteboard') {
        await handleWhiteboardTextContextAction(action);
        return;
      }
      const textId = slideTextContextId;
      const item = slideTextItemById(textId);
      if (!item) {
        closeSlideTextContextMenu();
        return;
      }
      const layer = slideTextLayerForItem(item);
      closeSlideTextContextMenu();
      if (!layer) return;

      if (action === 'font-color' || action === 'box-color') {
        const key = action === 'font-color' ? 'font_color' : 'box_color';
        const title = action === 'font-color' ? 'Choose font colour' : 'Choose text box colour';
        try {
          const result = await window.pywebview.api.choose_slide_annotation_color(item[key], title);
          if (!result.ok) throw new Error(result.error || 'Colour picker could not be opened.');
          if (!result.color) return;
          const undoSnapshot = snapshotSlideUndoState();
          item[key] = normalizeAnnotationColor(result.color, item[key]);
          renderSlideAnnotationsForLayer(layer, item.page_number);
          commitSlideUndoSnapshot(undoSnapshot);
          saveSlideAnnotationState(`✓ ${action === 'font-color' ? 'Font' : 'Box'} colour saved`);
        } catch (error) {
          console.error(error);
          setStatus(error.message || 'Colour picker could not be opened.', 'error');
        }
        return;
      }

      if (action === 'copy' || action === 'cut') {
        try {
          const result = await window.pywebview.api.copy_text_to_clipboard(item.text);
          if (!result.ok) throw new Error(result.error || 'Text could not be copied.');
          if (action === 'copy') {
            setStatus('✓ Text copied', 'saved');
            return;
          }
          openSlideTextEditor(layer, item.page_number, item.x, item.y, {...item, text: ''});
          setStatus('✓ Text cut — type replacement text', 'saved');
        } catch (error) {
          console.error(error);
          setStatus(error.message || 'Text could not be copied.', 'error');
        }
        return;
      }

      if (action === 'paste') {
        try {
          const result = await window.pywebview.api.read_text_from_clipboard();
          if (!result.ok) throw new Error(result.error || 'Clipboard text could not be read.');
          const pasted = String(result.text || '');
          if (!pasted) return;
          if (item.text.length + pasted.length > 5000) {
            throw new Error('Pasted text would make this slide text box too long.');
          }
          const undoSnapshot = snapshotSlideUndoState();
          item.text += pasted;
          renderSlideAnnotationsForLayer(layer, item.page_number);
          commitSlideUndoSnapshot(undoSnapshot);
          saveSlideAnnotationState('✓ Clipboard text appended');
        } catch (error) {
          console.error(error);
          setStatus(error.message || 'Clipboard text could not be read.', 'error');
        }
        return;
      }

      if (action === 'delete') {
        const undoSnapshot = snapshotSlideUndoState();
        slideAnnotationTexts = slideAnnotationTexts.filter((candidate) => candidate.id !== item.id);
        if (selectedSlideTextId === item.id) selectedSlideTextId = null;
        renderSlideAnnotationsForLayer(layer, item.page_number);
        commitSlideUndoSnapshot(undoSnapshot);
        saveSlideAnnotationState('✓ Slide text deleted');
      }
    }

    slideTextContextActions.forEach((button) => {
      button.addEventListener('click', () => handleSlideTextContextAction(button.dataset.slideTextAction));
    });

    slideLabelDeleteAction.addEventListener('click', () => {
      if (slideLabelContextId) deleteSlideLabelById(slideLabelContextId);
    });

    slideTextFormatActions.forEach((button) => {
      button.addEventListener('pointerdown', (event) => event.preventDefault());
      button.addEventListener('click', () => applySlideTextSelectionFormat(button.dataset.slideTextFormat));
    });
    slidesStage.addEventListener('scroll', positionSlideTextFormatToolbar, {passive: true});
    window.addEventListener('resize', positionSlideTextFormatToolbar);
    document.addEventListener('selectionchange', () => {
      if (activeTextEditor || activeWhiteboardTextEditor) updateSlideTextFormatToolbarState();
    });


    function distanceToSegmentSquared(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      const lengthSquared = abx * abx + aby * aby;
      if (!lengthSquared) return apx * apx + apy * apy;
      const t = Math.max(0, Math.min(1, (apx * abx + apy * aby) / lengthSquared));
      const dx = px - (ax + t * abx);
      const dy = py - (ay + t * aby);
      return dx * dx + dy * dy;
    }

    function eraseSlideStrokesAt(pageNumber, position, layer) {
      const radius = annotationEraserRadius(slideAnnotationSettings.eraser_size);
      const radiusSquared = radius * radius;
      const px = position.x * position.bounds.width;
      const py = position.y * position.bounds.height;
      let changed = false;
      slideAnnotationStrokes = slideAnnotationStrokes.filter((stroke) => {
        if (stroke.page_number !== pageNumber) return true;
        const points = stroke.points;
        let touched = false;
        if (points.length === 1) {
          const dx = px - points[0].x * position.bounds.width;
          const dy = py - points[0].y * position.bounds.height;
          touched = dx * dx + dy * dy <= radiusSquared;
        } else {
          for (let index = 1; index < points.length; index += 1) {
            const a = points[index - 1];
            const b = points[index];
            if (distanceToSegmentSquared(
              px, py,
              a.x * position.bounds.width, a.y * position.bounds.height,
              b.x * position.bounds.width, b.y * position.bounds.height
            ) <= radiusSquared) {
              touched = true;
              break;
            }
          }
        }
        if (touched) changed = true;
        return !touched;
      });
      if (changed) renderSlideAnnotationsForLayer(layer, pageNumber);
      return changed;
    }

    function beginSlideAnnotationPointer(event) {
      if (!slideAnnotationMode || event.button !== 0) return;
      const layer = event.currentTarget;
      const pageNumber = Number(layer.dataset.pageNumber);
      if (!Number.isInteger(pageNumber)) return;

      if (slideAnnotationMode === 'text' && activeTextEditor) {
        event.preventDefault();
        event.stopPropagation();
        finishActiveTextEditor(true);
        return;
      }

      const position = annotationPointerPosition(event, layer);
      if (!position) return;
      event.preventDefault();
      event.stopPropagation();

      if (slideAnnotationMode === 'text') {
        openSlideTextEditor(layer, pageNumber, position.x, position.y);
        return;
      }

      if (slideAnnotationMode === 'label') {
        placeSlideLabel(layer, pageNumber, position);
        return;
      }

      if (slideAnnotationMode === 'eraser') {
        slideAnnotationDrawState = {
          mode: 'eraser', pointerId: event.pointerId, layer, pageNumber,
          undoSnapshot: snapshotSlideUndoState(),
          changed: eraseSlideStrokesAt(pageNumber, position, layer)
        };
        try { layer.setPointerCapture(event.pointerId); } catch (_error) {}
        return;
      }

      const tool = slideAnnotationMode;
      const stroke = {
        id: makeSlideAnnotationId('stroke'),
        page_number: pageNumber,
        tool,
        color: slideAnnotationSettings[`${tool}_color`],
        size: slideAnnotationSettings[`${tool}_size`],
        points: [{x: position.x, y: position.y}]
      };
      const svg = ensureAnnotationSvg(layer);
      const path = createAnnotationStrokeElement(stroke);
      svg.appendChild(path);
      slideAnnotationDrawState = {
        mode: tool, pointerId: event.pointerId, layer, pageNumber, stroke, path, lastPosition: position,
        undoSnapshot: snapshotSlideUndoState()
      };
      try { layer.setPointerCapture(event.pointerId); } catch (_error) {}
    }

    function moveSlideAnnotationPointer(event) {
      const state = slideAnnotationDrawState;
      if (!state || event.pointerId !== state.pointerId) return;
      const position = annotationPointerPosition(event, state.layer);
      if (!position) return;
      event.preventDefault();
      event.stopPropagation();
      if (state.mode === 'eraser') {
        if (eraseSlideStrokesAt(state.pageNumber, position, state.layer)) state.changed = true;
        return;
      }
      const last = state.stroke.points[state.stroke.points.length - 1];
      const dx = (position.x - last.x) * position.bounds.width;
      const dy = (position.y - last.y) * position.bounds.height;
      if (dx * dx + dy * dy < 2.25) return;
      state.stroke.points.push({x: position.x, y: position.y});
      state.path.setAttribute('d', annotationPathData(state.stroke.points));
      state.lastPosition = position;
    }

    function endSlideAnnotationPointer(event) {
      const state = slideAnnotationDrawState;
      if (!state || event.pointerId !== state.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      moveSlideAnnotationPointer(event);
      slideAnnotationDrawState = null;
      try { state.layer.releasePointerCapture(event.pointerId); } catch (_error) {}
      if (state.mode === 'eraser') {
        if (state.changed) {
          commitSlideUndoSnapshot(state.undoSnapshot);
          saveSlideAnnotationState('✓ Slide drawing erased');
        }
        return;
      }
      if (state.stroke.points.length === 1) {
        const point = state.stroke.points[0];
        state.stroke.points.push({x: Math.min(1, point.x + 0.0001), y: point.y});
        state.path.setAttribute('d', annotationPathData(state.stroke.points));
      }
      slideAnnotationStrokes.push(state.stroke);
      commitSlideUndoSnapshot(state.undoSnapshot);
      saveSlideAnnotationState('✓ Slide drawing saved');
    }

    function cancelSlideAnnotationPointer(event) {
      const state = slideAnnotationDrawState;
      if (!state || event.pointerId !== state.pointerId) return;
      slideAnnotationDrawState = null;
      try { state.layer.releasePointerCapture(event.pointerId); } catch (_error) {}
      if (state.mode === 'eraser') {
        if (state.changed) {
          commitSlideUndoSnapshot(state.undoSnapshot);
          saveSlideAnnotationState('✓ Slide drawing erased');
        }
      } else {
        state.path.remove();
      }
    }

    function prepareSlideAnnotationLayer(layer, pageNumber) {
      layer.dataset.pageNumber = String(pageNumber);
      layer.addEventListener('pointerdown', beginSlideAnnotationPointer);
      layer.addEventListener('pointermove', moveSlideAnnotationPointer);
      layer.addEventListener('pointerup', endSlideAnnotationPointer);
      layer.addEventListener('pointercancel', cancelSlideAnnotationPointer);
      renderSlideAnnotationsForLayer(layer, pageNumber);
    }


    function clampRevealSeconds(value) {
      const numeric = Number(value);
      if (!Number.isInteger(numeric)) return 3;
      return Math.max(1, Math.min(10, numeric));
    }

    function normalizeOcclusionBox(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const pageNumber = Number(raw.page_number);
      const x = Number(raw.x);
      const y = Number(raw.y);
      const width = Number(raw.width);
      const height = Number(raw.height);
      if (!Number.isInteger(pageNumber) || pageNumber <= 0) return null;
      if (![x, y, width, height].every(Number.isFinite)) return null;
      if (x < 0 || y < 0 || width <= 0 || height <= 0) return null;
      if (x + width > 1.000001 || y + height > 1.000001) return null;
      const id = String(raw.id || '').trim();
      if (!id) return null;
      return {id, page_number: pageNumber, x, y, width, height};
    }

    function loadOcclusionState(documentData) {
      const state = documentData && documentData.image_occlusion;
      boxRevealSeconds = clampRevealSeconds(state && state.reveal_seconds);
      const boxes = state && Array.isArray(state.boxes) ? state.boxes : [];
      occlusionBoxes = boxes.map(normalizeOcclusionBox).filter(Boolean);
      updateBoxTimerButton();
    }

    function makeOcclusionBoxId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return `box_${window.crypto.randomUUID().replace(/-/g, '')}`;
      }
      return `box_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    }

    function snapshotOcclusionBoxes() {
      return occlusionBoxes.map((box) => ({
        id: box.id,
        page_number: box.page_number,
        x: box.x,
        y: box.y,
        width: box.width,
        height: box.height
      }));
    }

    function saveOcclusionState(successText = '') {
      const boxes = snapshotOcclusionBoxes();
      const seconds = boxRevealSeconds;
      occlusionSaveQueue = occlusionSaveQueue.then(async () => {
        const result = await window.pywebview.api.save_image_occlusion_state(boxes, seconds);
        if (!result.ok) {
          throw new Error(result.error || 'Image occlusion could not be saved.');
        }
        if (successText) setStatus(successText, 'saved');
      }).catch((error) => {
        console.error(error);
        setStatus(error.message || 'Image occlusion could not be saved.', 'error');
      });
      return occlusionSaveQueue;
    }

    function updateBoxTimerButton() {
      boxTimerButton.textContent = `${boxRevealSeconds}s reveal`;
      boxTimerInput.value = String(boxRevealSeconds);
    }

    function closeBoxTimerPopover() {
      boxTimerPopover.hidden = true;
    }

    function openBoxTimerPopover() {
      if (boxTimerButton.disabled) return;
      boxTimerPopover.hidden = false;
      boxTimerInput.value = String(boxRevealSeconds);
      window.requestAnimationFrame(() => {
        boxTimerInput.focus();
        boxTimerInput.select();
      });
    }

    function commitBoxRevealSeconds(closeAfter = true) {
      const numeric = Number(boxTimerInput.value);
      if (!Number.isInteger(numeric) || numeric < 1 || numeric > 10) {
