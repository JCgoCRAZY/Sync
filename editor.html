        boxTimerInput.value = String(boxRevealSeconds);
        setStatus('Box reveal time must be a whole number from 1 to 10.', 'error');
        boxTimerInput.focus();
        boxTimerInput.select();
        return false;
      }
      const changed = numeric !== boxRevealSeconds;
      const undoSnapshot = changed ? snapshotSlideUndoState() : null;
      boxRevealSeconds = numeric;
      updateBoxTimerButton();
      if (closeAfter) closeBoxTimerPopover();
      if (changed) {
        commitSlideUndoSnapshot(undoSnapshot);
        saveOcclusionState(`✓ Box reveal set to ${boxRevealSeconds}s`);
      }
      return true;
    }

    function applyOcclusionGeometry(element, box) {
      element.style.left = `${box.x * 100}%`;
      element.style.top = `${box.y * 100}%`;
      element.style.width = `${box.width * 100}%`;
      element.style.height = `${box.height * 100}%`;
    }

    function revealOcclusionBoxTemporarily(element) {
      if (boxModeActive || element.classList.contains('draft')) return;
      window.clearTimeout(element.__studyHubRevealTimer);
      element.classList.add('revealed');
      element.__studyHubRevealTimer = window.setTimeout(() => {
        if (element.isConnected) element.classList.remove('revealed');
      }, boxRevealSeconds * 1000);
    }

    function deleteOcclusionBox(boxId, element) {
      if (!window.confirm('Delete this image-occlusion box?')) return;
      const undoSnapshot = snapshotSlideUndoState();
      occlusionBoxes = occlusionBoxes.filter((box) => box.id !== boxId);
      element.remove();
      commitSlideUndoSnapshot(undoSnapshot);
      saveOcclusionState('✓ Box deleted');
    }

    function createOcclusionElement(box) {
      const element = document.createElement('div');
      element.className = 'image-occlusion-box';
      element.dataset.boxId = box.id;
      element.title = 'Click to reveal temporarily. Right-click to delete.';
      applyOcclusionGeometry(element, box);
      element.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        revealOcclusionBoxTemporarily(element);
      });
      element.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        event.stopPropagation();
        deleteOcclusionBox(box.id, element);
      });
      return element;
    }

    function renderOcclusionBoxesForLayer(layer, pageNumber) {
      layer.replaceChildren();
      for (const box of occlusionBoxes) {
        if (box.page_number === pageNumber) {
          layer.appendChild(createOcclusionElement(box));
        }
      }
    }

    function refreshOcclusionBoxes() {
      for (const layer of slidesPdfViewer.querySelectorAll('.occlusion-layer')) {
        const pageNumber = Number(layer.dataset.pageNumber);
        if (Number.isInteger(pageNumber)) {
          renderOcclusionBoxesForLayer(layer, pageNumber);
        }
      }
    }

    function setBoxMode(active) {
      if (boxDrawState) {
        const state = boxDrawState;
        boxDrawState = null;
        state.draft.remove();
        try { state.layer.releasePointerCapture(state.pointerId); } catch (_error) {}
      }
      boxModeActive = Boolean(active) && hasSlidesAttachment();
      createBoxButton.classList.toggle('active', boxModeActive);
      createBoxButton.setAttribute('aria-pressed', boxModeActive ? 'true' : 'false');
      createBoxButton.title = boxModeActive
        ? 'Drag across a slide to create an image-occlusion box'
        : 'Draw an image-occlusion box on a PDF slide';
      slidesPdfViewer.classList.toggle('box-mode', boxModeActive);
      if (boxModeActive) {
        setSlideAnnotationMode(null);
        closeDrawToolPopover();
        closeBoxTimerPopover();
        setStatus('Box mode: drag across a slide.', 'saved');
      }
    }

    async function toggleBoxMode() {
      if (!hasSlidesAttachment()) {
        setStatus('Assign Slides before using + Box.', 'error');
        return;
      }
      if (!editorWorkspace.classList.contains('split-preview')) {
        await setSplitPreview(true);
      }
      setBoxMode(!boxModeActive);
    }

    function pointerPositionInLayer(event, layer) {
      const bounds = layer.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return null;
      return {
        x: Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width)),
        y: Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height)),
        bounds
      };
    }

    function updateDraftBox(event) {
      if (!boxDrawState || event.pointerId !== boxDrawState.pointerId) return;
      const position = pointerPositionInLayer(event, boxDrawState.layer);
      if (!position) return;
      const x = Math.min(boxDrawState.startX, position.x);
      const y = Math.min(boxDrawState.startY, position.y);
      const width = Math.abs(position.x - boxDrawState.startX);
      const height = Math.abs(position.y - boxDrawState.startY);
      applyOcclusionGeometry(boxDrawState.draft, {x, y, width, height});
      boxDrawState.current = {x, y, width, height, bounds: position.bounds};
    }

    function beginBoxDraw(event) {
      if (!boxModeActive || event.button !== 0) return;
      const layer = event.currentTarget;
      const position = pointerPositionInLayer(event, layer);
      if (!position) return;
      event.preventDefault();
      event.stopPropagation();

      const draft = document.createElement('div');
      draft.className = 'image-occlusion-box draft';
      applyOcclusionGeometry(draft, {x: position.x, y: position.y, width: 0, height: 0});
      layer.appendChild(draft);
      boxDrawState = {
        pointerId: event.pointerId,
        undoSnapshot: snapshotSlideUndoState(),
        layer,
        draft,
        pageNumber: Number(layer.dataset.pageNumber),
        startX: position.x,
        startY: position.y,
        current: {x: position.x, y: position.y, width: 0, height: 0, bounds: position.bounds}
      };
      try { layer.setPointerCapture(event.pointerId); } catch (_error) {}
    }

    function moveBoxDraw(event) {
      if (!boxDrawState) return;
      event.preventDefault();
      updateDraftBox(event);
    }

    function endBoxDraw(event) {
      if (!boxDrawState || event.pointerId !== boxDrawState.pointerId) return;
      event.preventDefault();
      updateDraftBox(event);
      const state = boxDrawState;
      boxDrawState = null;
      try { state.layer.releasePointerCapture(event.pointerId); } catch (_error) {}

      const current = state.current;
      const pixelWidth = current.width * current.bounds.width;
      const pixelHeight = current.height * current.bounds.height;
      state.draft.remove();
      if (pixelWidth < 6 || pixelHeight < 6) {
        setBoxMode(false);
        setStatus('Box was too small to save.', 'error');
        return;
      }

      const box = {
        id: makeOcclusionBoxId(),
        page_number: state.pageNumber,
        x: current.x,
        y: current.y,
        width: current.width,
        height: current.height
      };
      occlusionBoxes.push(box);
      state.layer.appendChild(createOcclusionElement(box));
      setBoxMode(false);
      commitSlideUndoSnapshot(state.undoSnapshot);
      saveOcclusionState('✓ Box saved');
    }

    function cancelBoxDraw(event) {
      if (!boxDrawState || event.pointerId !== boxDrawState.pointerId) return;
      const state = boxDrawState;
      boxDrawState = null;
      state.draft.remove();
      setBoxMode(false);
    }

    function prepareOcclusionLayer(layer, pageNumber) {
      layer.dataset.pageNumber = String(pageNumber);
      layer.addEventListener('pointerdown', beginBoxDraw);
      layer.addEventListener('pointermove', moveBoxDraw);
      layer.addEventListener('pointerup', endBoxDraw);
      layer.addEventListener('pointercancel', cancelBoxDraw);
      renderOcclusionBoxesForLayer(layer, pageNumber);
    }

    function persistSplitRatio() {
      queueEditorLayoutPatch({split_ratio: splitRatio}, 0);
    }

    function beginDividerDrag(event) {
      if (!editorWorkspace.classList.contains('split-preview')) return;
      event.preventDefault();
      dividerDrag = {pointerId: event.pointerId};
      editorWorkspace.classList.add('resizing');
      splitDivider.setPointerCapture(event.pointerId);
    }

    function moveDivider(event) {
      if (!dividerDrag || event.pointerId !== dividerDrag.pointerId) return;
      const bounds = editorWorkspace.getBoundingClientRect();
      if (!bounds.width) return;
      applySplitRatio((event.clientX - bounds.left) / bounds.width);
    }

    function endDividerDrag(event) {
      if (!dividerDrag || event.pointerId !== dividerDrag.pointerId) return;
      dividerDrag = null;
      editorWorkspace.classList.remove('resizing');
      try { splitDivider.releasePointerCapture(event.pointerId); } catch (_error) {}
      persistSplitRatio();
    }

    function setStatus(text, state = '') {
      statusLabel.textContent = text;
      statusLabel.dataset.state = state;
      statusLabel.style.color = state === 'error' ? '#dc6666'
        : state === 'saving' ? '#d39147'
        : state === 'saved' ? '#31b77b'
        : '#91a4b4';
    }

    function snapshot() {
      return {
        title: titleInput.value.trim() || 'Untitled Document',
        delta: quill.getContents()
      };
    }

    function clipboardImageFiles(event) {
      const clipboard = event.clipboardData;
      if (!clipboard) return [];

      const images = [];
      const seen = new Set();
      const addImage = (file) => {
        if (!file || !String(file.type || '').toLowerCase().startsWith('image/')) return;
        // Windows screenshot clipboard data can expose the same bitmap through both
        // clipboard.items and clipboard.files with slightly different filenames/timestamps.
        const key = `${String(file.type || '').toLowerCase()}:${file.size || 0}`;
        if (seen.has(key)) return;
        seen.add(key);
        images.push(file);
      };

      for (const item of Array.from(clipboard.items || [])) {
        if (item.kind === 'file' && String(item.type || '').toLowerCase().startsWith('image/')) {
          addImage(item.getAsFile());
        }
      }
      for (const file of Array.from(clipboard.files || [])) addImage(file);
      return images;
    }

    function readImageAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(reader.error || new Error('Clipboard image could not be read.'));
        reader.readAsDataURL(file);
      });
    }

    let lastImagePasteSignature = '';
    let lastImagePasteAt = 0;

    async function handleClipboardImagePaste(event) {
      const images = clipboardImageFiles(event);
      if (!images.length) return;
      const eventTarget = event.target instanceof Node ? event.target : null;
      if (eventTarget && !quill.root.contains(eventTarget) && !selectedImage) return;

      // Own image pastes at the document capture phase so Quill's native clipboard
      // path cannot also insert the same Windows+Shift+S bitmap a second time.
      event.preventDefault();
      event.stopImmediatePropagation();

      try {
        const uniqueDataUrls = [];
        const seenPayloads = new Set();
        for (const image of images) {
          const dataUrl = await readImageAsDataUrl(image);
          if (!dataUrl || seenPayloads.has(dataUrl)) continue;
          seenPayloads.add(dataUrl);
          uniqueDataUrls.push(dataUrl);
        }
        if (!uniqueDataUrls.length) return;

        const signature = uniqueDataUrls
          .map((value) => `${value.length}:${value.slice(-96)}`)
          .join('|');
        const now = performance.now();
        if (signature === lastImagePasteSignature && now - lastImagePasteAt < 650) return;
        lastImagePasteSignature = signature;
        lastImagePasteAt = now;

        let range = null;
        if (event.key === 'Escape' && selectedWhiteboardTextId) {
        event.preventDefault();
        clearWhiteboardTextSelection();
        return;
      }
      if (event.key === 'Escape' && activeWhiteboardTextEditor) {
        event.preventDefault();
        finishActiveWhiteboardTextEditor(false);
        return;
      }
      if (selectedImage && selectedImage.isConnected) {
          const blot = imageBlotForElement(selectedImage);
          if (blot) range = {index: quill.getIndex(blot) + 1, length: 0};
        }
        if (!range) range = quill.getSelection(true);
        if (!range) range = {index: Math.max(0, quill.getLength() - 1), length: 0};
        let insertAt = range.index;

        if (range.length) {
          quill.deleteText(insertAt, range.length, 'user');
        }

        for (const dataUrl of uniqueDataUrls) {
          quill.insertEmbed(insertAt, 'image', dataUrl, 'user');
          quill.insertText(insertAt + 1, '\n', 'user');
          insertAt += 2;
        }

        quill.setSelection(insertAt, 0, 'silent');
        quill.focus({preventScroll: true});
      } catch (error) {
        console.error(error);
        setStatus('Image paste failed', 'error');
      }
    }

    function imageBlotForElement(image) {
      if (!(image instanceof HTMLImageElement) || !quill.root.contains(image)) return null;
      const blot = Quill.find(image, true);
      return blot && blot.domNode === image ? blot : null;
    }

    function editorContentWidth() {
      const style = getComputedStyle(quill.root);
      const horizontalPadding = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      return Math.max(1, quill.root.clientWidth - horizontalPadding);
    }

    function selectedImageMode() {
      if (!selectedImage) return 'inline';
      return normalizeImageLayoutMode(selectedImage.getAttribute('data-image-mode'));
    }

    function selectedImageAnchor() {
      if (!selectedImage) return 'move';
      return normalizeImageAnchorMode(selectedImage.getAttribute('data-image-anchor'));
    }

    function imageModeLabel(mode) {
      return ({inline: 'In line', wrap: 'Wrap text', break: 'Break text', behind: 'Behind text', front: 'In front of text'})[mode] || 'In line';
    }

    function fixedImageParticipatesInTextFlow(image) {
      if (!(image instanceof HTMLImageElement)) return false;
      if (normalizeImageAnchorMode(image.getAttribute('data-image-anchor')) !== 'fixed') return false;
      const mode = normalizeImageLayoutMode(image.getAttribute('data-image-mode'));
      return mode !== 'behind' && mode !== 'front';
    }

    function clearFixedImageFlowHost(image) {
      const host = image && image.parentElement;
      if (!host) return;
      host.classList.remove('study-fixed-image-flow-host', 'study-fixed-image-flow-text');
      host.style.removeProperty('--study-fixed-flow-height');
      host.style.removeProperty('min-height');
      host.style.removeProperty('padding-top');
    }

    function syncFixedImageFlowSpace(image) {
      if (!(image instanceof HTMLImageElement) || !image.isConnected) return;
      const host = image.parentElement;
      if (!host) return;
      if (!fixedImageParticipatesInTextFlow(image)) {
        clearFixedImageFlowHost(image);
        return;
      }
      const rect = image.getBoundingClientRect();
      if (!(rect.height > 0)) return;
      const flowHeight = Math.max(24, Math.ceil(rect.height + 12));
      host.classList.add('study-fixed-image-flow-host');
      host.style.setProperty('--study-fixed-flow-height', `${flowHeight}px`);
      host.style.minHeight = `${flowHeight}px`;
      const hasText = Array.from(host.childNodes).some((node) => {
        if (node === image) return false;
        return String(node.textContent || '').trim().length > 0;
      });
      host.classList.toggle('study-fixed-image-flow-text', hasText);
      if (hasText) host.style.paddingTop = `${flowHeight}px`;
      else host.style.removeProperty('padding-top');
    }

    function syncAllFixedImageFlowSpaces() {
      quill.root.querySelectorAll('.study-fixed-image-flow-host').forEach((host) => {
        const image = host.querySelector('img[data-image-anchor="fixed"]');
        if (!image || !fixedImageParticipatesInTextFlow(image)) {
          host.classList.remove('study-fixed-image-flow-host', 'study-fixed-image-flow-text');
          host.style.removeProperty('--study-fixed-flow-height');
          host.style.removeProperty('min-height');
          host.style.removeProperty('padding-top');
        }
      });
      quill.root.querySelectorAll('img[data-image-anchor="fixed"]').forEach(syncFixedImageFlowSpace);
    }

    function refreshImageLayoutButtons() {
      const mode = selectedImageMode();
      const anchor = selectedImageAnchor();
      imageModeMenuLabel.textContent = imageModeLabel(mode);
      imageAnchorMenuLabel.textContent = anchor === 'fixed' ? 'Fix position on page' : 'Move with text';
      imageLayoutOptions.forEach((button) => {
        const active = button.dataset.imageMode === mode;
        button.classList.toggle('selected', active);
        button.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      imageAnchorOptions.forEach((button) => {
        const active = button.dataset.imageAnchor === anchor;
        button.classList.toggle('selected', active);
        button.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function closeImageControlMenus() {
      imageModeMenuPopover.hidden = true;
      imageAnchorMenuPopover.hidden = true;
      imageModeMenuButton.classList.remove('open');
      imageAnchorMenuButton.classList.remove('open');
      imageModeMenuButton.setAttribute('aria-expanded', 'false');
      imageAnchorMenuButton.setAttribute('aria-expanded', 'false');
    }

    function toggleImageControlMenu(which) {
      const openMode = which === 'mode' && imageModeMenuPopover.hidden;
      const openAnchor = which === 'anchor' && imageAnchorMenuPopover.hidden;
      closeImageControlMenus();
      if (openMode) {
        imageModeMenuPopover.hidden = false;
        imageModeMenuButton.classList.add('open');
        imageModeMenuButton.setAttribute('aria-expanded', 'true');
      } else if (openAnchor) {
        imageAnchorMenuPopover.hidden = false;
        imageAnchorMenuButton.classList.add('open');
        imageAnchorMenuButton.setAttribute('aria-expanded', 'true');
      }
    }

    function applyImageGeometry(image) {
      if (!(image instanceof HTMLImageElement) || !image.isConnected) return;
      const storedWidthPx = finiteImageNumber(image.getAttribute('data-image-width-px'));
      const widthPct = finiteImageNumber(image.getAttribute('data-image-width-pct'));
      const heightRatio = finiteImageNumber(image.getAttribute('data-image-height-ratio'));

      // Resized images are stored in screen pixels, not as a percentage of the
      // current lecture-paper width. This keeps their visible size unchanged
      // when switching Normal <-> Full-width or when the Slides pane appears.
      let renderedWidthPx = null;
      if (storedWidthPx !== null && storedWidthPx > 0) {
        renderedWidthPx = Math.max(1, storedWidthPx);
        image.style.width = `${renderedWidthPx}px`;
        image.style.maxWidth = 'none';
      } else if (widthPct !== null) {
        // Backward compatibility for documents saved by the older percentage-
        // based image system. These values are migrated to pixels after load.
        renderedWidthPx = editorContentWidth() * Math.max(1, Math.min(100, widthPct)) / 100;
        image.style.width = `${Math.max(1, renderedWidthPx)}px`;
        image.style.maxWidth = 'none';
      } else {
        image.style.removeProperty('width');
        image.style.removeProperty('height');
        image.style.removeProperty('max-width');
      }

      if (renderedWidthPx !== null) {
        if (heightRatio !== null && heightRatio > 0) {
          image.style.height = `${Math.max(12, renderedWidthPx * heightRatio)}px`;
        } else {
          image.style.height = 'auto';
        }
      }

      if (normalizeImageAnchorMode(image.getAttribute('data-image-anchor')) === 'fixed') {
        const x = finiteImageNumber(image.getAttribute('data-image-x'), 0);
        const y = finiteImageNumber(image.getAttribute('data-image-y'), 0);
        image.style.left = `${Math.max(0, Math.min(100, x))}%`;
        image.style.top = `${Math.max(0, y)}px`;
      } else {
        image.style.removeProperty('left');
        image.style.removeProperty('top');
      }
      syncFixedImageFlowSpace(image);
    }

    function migrateLegacyImageGeometryToPixels() {
      let changed = false;
      quill.root.querySelectorAll('img').forEach((image) => {
        if (!(image instanceof HTMLImageElement)) return;
        if (finiteImageNumber(image.getAttribute('data-image-width-px')) !== null) return;
        if (finiteImageNumber(image.getAttribute('data-image-width-pct')) === null) return;

        const blot = imageBlotForElement(image);
        if (!blot) return;
        const rect = image.getBoundingClientRect();
        if (!(rect.width > 0)) return;

        const index = quill.getIndex(blot);
        quill.formatText(index, 1, {
          imageWidthPx: rect.width,
          imageWidthPct: null,
          imageHeightRatio: rect.height / Math.max(1, rect.width),
        }, 'silent');
        changed = true;
      });
      return changed;
    }

    function refreshAllImageGeometry() {
      quill.root.querySelectorAll('img').forEach((image) => {
        if (imageResizeState && image === selectedImage) return;
        applyImageGeometry(image);
      });
      syncAllFixedImageFlowSpaces();
      if (selectedImage) window.requestAnimationFrame(updateImageLayoutToolbarPosition);
    }

    function updateImageSelectionOverlay() {
      if (!selectedImage || !selectedImage.isConnected || imageLayoutToolbar.hidden) {
        imageSelectionOverlay.hidden = true;
        return;
      }
      const rect = selectedImage.getBoundingClientRect();
      imageSelectionOverlay.hidden = false;
      imageSelectionOverlay.style.left = `${Math.round(rect.left - 2)}px`;
      imageSelectionOverlay.style.top = `${Math.round(rect.top - 2)}px`;
      imageSelectionOverlay.style.width = `${Math.max(4, Math.round(rect.width + 4))}px`;
      imageSelectionOverlay.style.height = `${Math.max(4, Math.round(rect.height + 4))}px`;
    }

    function updateImageLayoutToolbarPosition() {
      if (!selectedImage || !selectedImage.isConnected || imageLayoutToolbar.hidden) return;
      // Do not restore the last-saved geometry while a resize handle is being dragged.
      // The drag loop owns the image's live width/height until pointer-up persists them.
      if (!imageResizeState && !imageMoveState) applyImageGeometry(selectedImage);
      const imageRect = selectedImage.getBoundingClientRect();
      const stageRect = notesStage.getBoundingClientRect();
      if (
        imageRect.bottom < stageRect.top ||
        imageRect.top > stageRect.bottom ||
        imageRect.right < stageRect.left ||
        imageRect.left > stageRect.right
      ) {
        imageLayoutToolbar.style.visibility = 'hidden';
        imageSelectionOverlay.hidden = true;
        return;
      }

      updateImageSelectionOverlay();
      imageLayoutToolbar.style.visibility = 'hidden';
      const toolbarRect = imageLayoutToolbar.getBoundingClientRect();
      const edge = 8;
      const gap = 10;
      let left = imageRect.left + (imageRect.width - toolbarRect.width) / 2;
      let top = imageRect.bottom + gap;

      if (top + toolbarRect.height > window.innerHeight - edge) {
        top = imageRect.top - toolbarRect.height - gap;
      }
      left = Math.max(edge, Math.min(left, window.innerWidth - toolbarRect.width - edge));
      top = Math.max(edge, Math.min(top, window.innerHeight - toolbarRect.height - edge));
      imageLayoutToolbar.style.left = `${Math.round(left)}px`;
      imageLayoutToolbar.style.top = `${Math.round(top)}px`;
      imageLayoutToolbar.style.visibility = 'visible';
    }

    function clearSelectedImage() {
      if (selectedImage && selectedImage.isConnected) {
        selectedImage.classList.remove('study-image-selected');
      }
      selectedImage = null;
      closeImageControlMenus();
      imageLayoutToolbar.hidden = true;
      imageLayoutToolbar.style.visibility = 'hidden';
      imageSelectionOverlay.hidden = true;
    }

    function selectEditorImage(image) {
      if (!(image instanceof HTMLImageElement) || !quill.root.contains(image)) return;
      if (selectedImage && selectedImage !== image && selectedImage.isConnected) {
        selectedImage.classList.remove('study-image-selected');
      }
      selectedImage = image;
      selectedImage.setAttribute('data-image-mode', normalizeImageLayoutMode(selectedImage.getAttribute('data-image-mode')));
      selectedImage.setAttribute('data-image-anchor', normalizeImageAnchorMode(selectedImage.getAttribute('data-image-anchor')));
      selectedImage.classList.add('study-image-selected');
      applyImageGeometry(selectedImage);
      imageLayoutToolbar.hidden = false;
      refreshImageLayoutButtons();
      window.requestAnimationFrame(updateImageLayoutToolbarPosition);
    }

    function applySelectedImageMode(mode) {
      if (!selectedImage || !selectedImage.isConnected) {
        clearSelectedImage();
        return;
      }
      const normalized = normalizeImageLayoutMode(mode);
      const blot = imageBlotForElement(selectedImage);
      if (!blot) {
        clearSelectedImage();
        return;
      }
      const index = quill.getIndex(blot);
      clearFixedImageFlowHost(selectedImage);
      quill.formatText(index, 1, 'imageMode', normalized, 'user');
      if (blot.domNode instanceof HTMLImageElement) selectedImage = blot.domNode;
      selectedImage.classList.add('study-image-selected');
      applyImageGeometry(selectedImage);
      refreshImageLayoutButtons();
      window.requestAnimationFrame(updateImageLayoutToolbarPosition);
    }

    function applySelectedImageAnchor(anchor) {
      if (!selectedImage || !selectedImage.isConnected) {
        clearSelectedImage();
        return;
      }
      const normalized = normalizeImageAnchorMode(anchor);
      const blot = imageBlotForElement(selectedImage);
      if (!blot) {
        clearSelectedImage();
        return;
      }
      const index = quill.getIndex(blot);
      clearFixedImageFlowHost(selectedImage);
      const formats = {imageAnchor: normalized};
      if (normalized === 'fixed') {
        const imageRect = selectedImage.getBoundingClientRect();
        const rootRect = quill.root.getBoundingClientRect();
        formats.imageX = Math.max(0, Math.min(100, ((imageRect.left - rootRect.left) / Math.max(1, rootRect.width)) * 100));
        formats.imageY = Math.max(0, imageRect.top - rootRect.top);
      }
      quill.formatText(index, 1, formats, 'user');
      if (blot.domNode instanceof HTMLImageElement) selectedImage = blot.domNode;
      selectedImage.classList.add('study-image-selected');
      applyImageGeometry(selectedImage);
      refreshImageLayoutButtons();
      window.requestAnimationFrame(updateImageLayoutToolbarPosition);
    }

    function selectedImageBlotAndIndex() {
      if (!selectedImage || !selectedImage.isConnected) return null;
      const blot = imageBlotForElement(selectedImage);
      if (!blot) return null;
      return {blot, index: quill.getIndex(blot)};
    }

    function deleteSelectedImage() {
      const target = selectedImageBlotAndIndex();
      if (!target) {
        clearSelectedImage();
        return false;
      }
      const image = selectedImage;
      clearFixedImageFlowHost(image);
      const index = target.index;
      clearSelectedImage();
      quill.deleteText(index, 1, 'user');
      quill.setSelection(Math.min(index, Math.max(0, quill.getLength() - 1)), 0, 'silent');
      syncAllFixedImageFlowSpaces();
      return true;
    }

    function selectedImagePngBlob(image) {
      return new Promise((resolve, reject) => {
        if (!(image instanceof HTMLImageElement)) {
          reject(new Error('No image is selected.'));
          return;
        }
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, image.naturalWidth || Math.round(image.getBoundingClientRect().width));
        canvas.height = Math.max(1, image.naturalHeight || Math.round(image.getBoundingClientRect().height));
        const context = canvas.getContext('2d');
        if (!context) {
          reject(new Error('Image clipboard is unavailable.'));
          return;
        }
        try {
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
        } catch (error) {
          reject(error);
          return;
        }
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('Image clipboard conversion failed.'));
        }, 'image/png');
      });
    }

    async function copySelectedImageToClipboard() {
      if (!selectedImage || !selectedImage.isConnected) return false;
      try {
        if (navigator.clipboard && typeof navigator.clipboard.write === 'function' && typeof ClipboardItem !== 'undefined') {
          const blob = await selectedImagePngBlob(selectedImage);
          await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
          setStatus('✓ Image copied', 'saved');
          return true;
        }
      } catch (error) {
        console.warn('Clipboard API image copy failed; trying DOM copy.', error);
      }

      try {
        const nativeSelection = window.getSelection();
        const range = document.createRange();
        range.selectNode(selectedImage);
        nativeSelection.removeAllRanges();
        nativeSelection.addRange(range);
        const copied = document.execCommand('copy');
        nativeSelection.removeAllRanges();
        if (copied) {
          setStatus('✓ Image copied', 'saved');
          return true;
        }
      } catch (error) {
        console.warn('DOM image copy failed.', error);
      }
      setStatus('Image copy failed', 'error');
      return false;
    }

    function nearestQuillBlockIndex(clientY) {
      const children = Array.from(quill.root.children).filter((node) => node instanceof HTMLElement);
      if (!children.length) return Math.max(0, quill.getLength() - 1);
      let best = children[0];
      let bestDistance = Infinity;
      for (const child of children) {
        const rect = child.getBoundingClientRect();
        const center = (rect.top + rect.bottom) / 2;
        const distance = Math.abs(center - clientY);
        if (distance < bestDistance) {
          best = child;
          bestDistance = distance;
        }
      }
      const blot = Quill.find(best, true);
      if (!blot) return Math.max(0, quill.getLength() - 1);
      return Math.max(0, quill.getIndex(blot));
    }

    function selectedImageFormats(image) {
      return {
        imageMode: normalizeImageLayoutMode(image.getAttribute('data-image-mode')),
        imageAnchor: normalizeImageAnchorMode(image.getAttribute('data-image-anchor')),
        imageWidthPx: finiteImageNumber(image.getAttribute('data-image-width-px')),
        imageHeightRatio: finiteImageNumber(image.getAttribute('data-image-height-ratio')),
        imageX: finiteImageNumber(image.getAttribute('data-image-x')),
        imageY: finiteImageNumber(image.getAttribute('data-image-y')),
      };
    }

    function moveSelectedImageEmbed(targetIndex, formats) {
      const target = selectedImageBlotAndIndex();
      if (!target || !selectedImage) return null;
      const oldIndex = target.index;
      const src = selectedImage.getAttribute('src') || selectedImage.src;
      if (!src) return null;
      const maxIndex = Math.max(0, quill.getLength() - 1);
      targetIndex = Math.max(0, Math.min(maxIndex, Number(targetIndex) || 0));
      if (targetIndex === oldIndex || targetIndex === oldIndex + 1) return oldIndex;

      clearFixedImageFlowHost(selectedImage);
      let delta;
      let newIndex;
      if (targetIndex < oldIndex) {
        delta = {ops: [
          ...(targetIndex ? [{retain: targetIndex}] : []),
          {insert: {image: src}, attributes: formats},
          {retain: oldIndex - targetIndex},
          {delete: 1},
        ]};
        newIndex = targetIndex;
      } else {
        delta = {ops: [
          ...(oldIndex ? [{retain: oldIndex}] : []),
          {delete: 1},
          ...(targetIndex - oldIndex - 1 ? [{retain: targetIndex - oldIndex - 1}] : []),
          {insert: {image: src}, attributes: formats},
        ]};
        newIndex = targetIndex - 1;
      }
      quill.updateContents(delta, 'user');
      const leafInfo = quill.getLeaf(newIndex);
      const leaf = Array.isArray(leafInfo) ? leafInfo[0] : null;
      if (leaf && leaf.domNode instanceof HTMLImageElement) selectedImage = leaf.domNode;
      return newIndex;
    }

    let imageMoveState = null;

    function beginFixedImageMove(event) {
      const image = event.target instanceof HTMLImageElement ? event.target : null;
      if (!image || !quill.root.contains(image) || event.button !== 0) return;
      selectEditorImage(image);
      if (normalizeImageAnchorMode(image.getAttribute('data-image-anchor')) !== 'fixed') return;
      const rect = image.getBoundingClientRect();
      const rootRect = quill.root.getBoundingClientRect();
      imageMoveState = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        left: rect.left,
        top: rect.top,
        width: rect.width,
        height: rect.height,
        rootLeft: rootRect.left,
        rootTop: rootRect.top,
      };
      try { image.setPointerCapture(event.pointerId); } catch (_error) {}
      event.preventDefault();
      event.stopPropagation();
    }

    function moveFixedImage(event) {
      if (!imageMoveState || imageMoveState.pointerId !== event.pointerId || !selectedImage) return;
      const state = imageMoveState;
      const rootRect = quill.root.getBoundingClientRect();
      const dx = event.clientX - state.startX;
      const dy = event.clientY - state.startY;
      const maxLeft = Math.max(0, rootRect.width - state.width);
      const maxTop = Math.max(0, quill.root.scrollHeight - state.height);
      const leftPx = Math.max(0, Math.min(maxLeft, state.left - state.rootLeft + dx));
      const topPx = Math.max(0, Math.min(maxTop, state.top - state.rootTop + dy));
      selectedImage.style.left = `${Math.max(0, Math.min(100, leftPx / Math.max(1, rootRect.width) * 100))}%`;
      selectedImage.style.top = `${topPx}px`;
      updateImageSelectionOverlay();
      updateImageLayoutToolbarPosition();
      event.preventDefault();
      event.stopPropagation();
    }

    function endFixedImageMove(event) {
      if (!imageMoveState || imageMoveState.pointerId !== event.pointerId || !selectedImage) return;
      const state = imageMoveState;
      imageMoveState = null;
      const image = selectedImage;
      try { image.releasePointerCapture(event.pointerId); } catch (_error) {}
      const rootRect = quill.root.getBoundingClientRect();
      const rect = image.getBoundingClientRect();
      const leftPct = Math.max(0, Math.min(100, (rect.left - rootRect.left) / Math.max(1, rootRect.width) * 100));
      const topPx = Math.max(0, rect.top - rootRect.top);
      const formats = selectedImageFormats(image);
      formats.imageX = leftPct;
      formats.imageY = topPx;
      formats.imageWidthPx = rect.width;
      formats.imageHeightRatio = rect.height / Math.max(1, rect.width);

      // Move the Quill embed to the nearest vertical text block as well. The image
      // remains absolutely positioned, but this host reserves space at the drop area,
      // preventing normal text from sitting invisibly behind a fixed image.
      const targetIndex = nearestQuillBlockIndex(event.clientY);
      const newIndex = moveSelectedImageEmbed(targetIndex, formats);
      if (newIndex !== null && selectedImage && selectedImage.isConnected) {
        const blot = imageBlotForElement(selectedImage);
        if (blot) {
          quill.formatText(quill.getIndex(blot), 1, formats, 'silent');
        }
        selectedImage.classList.add('study-image-selected');
        applyImageGeometry(selectedImage);
        syncFixedImageFlowSpace(selectedImage);
        refreshImageLayoutButtons();
        window.requestAnimationFrame(updateImageLayoutToolbarPosition);
      }
      event.preventDefault();
      event.stopPropagation();
    }

    let imageResizeState = null;

    function beginImageResize(event) {
      if (!selectedImage || !selectedImage.isConnected) return;
      const handle = event.currentTarget.dataset.handle;
      const rect = selectedImage.getBoundingClientRect();
      const rootRect = quill.root.getBoundingClientRect();
      imageResizeState = {
        pointerId: event.pointerId,
        handle,
        startX: event.clientX,
        startY: event.clientY,
        width: rect.width,
        height: rect.height,
        left: rect.left,
        top: rect.top,
        rootLeft: rootRect.left,
        rootTop: rootRect.top,
        fixed: selectedImageAnchor() === 'fixed',
        ratio: rect.height / Math.max(1, rect.width),
      };
      event.currentTarget.setPointerCapture(event.pointerId);
      event.preventDefault();
      event.stopPropagation();
    }

    function moveImageResize(event) {
      if (!imageResizeState || imageResizeState.pointerId !== event.pointerId || !selectedImage) return;
      const state = imageResizeState;
      const dx = event.clientX - state.startX;
      const dy = event.clientY - state.startY;
      const west = state.handle.includes('w');
      const east = state.handle.includes('e');
      const north = state.handle.includes('n');
      const south = state.handle.includes('s');
      const horizontal = west || east;
      const vertical = north || south;
      const corner = horizontal && vertical;
      const minWidth = 40;
      const minHeight = 30;
      // Width is measured in screen pixels so the result is independent of
      // Normal/Full-width paper geometry. Keep the same practical viewport cap
      // the user sees while dragging.
      const maxWidth = Math.max(minWidth, window.innerWidth - 24);

      let width = state.width;
      let height = state.height;

      if (corner) {
        // Google-Docs-style corner resizing: preserve the image's current aspect ratio.
        const rawWidth = state.width + (east ? dx : -dx);
        const rawHeight = state.height + (south ? dy : -dy);
        const ratio = Math.max(0.05, state.ratio);
        const heightDrivenWidth = rawHeight / ratio;

        if (Math.abs(rawWidth - state.width) >= Math.abs(rawHeight - state.height)) {
          width = Math.max(minWidth, Math.min(maxWidth, rawWidth));
          height = Math.max(minHeight, width * ratio);
        } else {
          height = Math.max(minHeight, rawHeight);
          width = Math.max(minWidth, Math.min(maxWidth, heightDrivenWidth));
          height = width * ratio;
        }
      } else if (horizontal) {
        // Side handles alter only width.
        width = state.width + (east ? dx : -dx);
        width = Math.max(minWidth, Math.min(maxWidth, width));
      } else if (vertical) {
        // Top/bottom handles alter only height.
        height = state.height + (south ? dy : -dy);
        height = Math.max(minHeight, height);
      }

      selectedImage.style.width = `${width}px`;
      selectedImage.style.height = `${height}px`;
      selectedImage.style.maxWidth = 'none';

      if (state.fixed) {
        // When resizing from the top or left, keep the opposite edge stationary.
        let left = state.left;
        let top = state.top;
        if (west) left = state.left + (state.width - width);
        if (north) top = state.top + (state.height - height);
        const rootWidth = Math.max(1, quill.root.getBoundingClientRect().width);
        selectedImage.style.left = `${Math.max(0, Math.min(100, (left - state.rootLeft) / rootWidth * 100))}%`;
        selectedImage.style.top = `${Math.max(0, top - state.rootTop)}px`;
      }

      updateImageSelectionOverlay();
      updateImageLayoutToolbarPosition();
      event.preventDefault();
      event.stopPropagation();
    }

    function endImageResize(event) {
      if (!imageResizeState || imageResizeState.pointerId !== event.pointerId || !selectedImage) return;
      const state = imageResizeState;
      imageResizeState = null;
      const blot = imageBlotForElement(selectedImage);
      if (!blot) return;
      const index = quill.getIndex(blot);
      const rect = selectedImage.getBoundingClientRect();
      const formats = {
        imageWidthPx: rect.width,
        imageWidthPct: null,
        imageHeightRatio: rect.height / Math.max(1, rect.width),
      };
      if (state.fixed) {
        const rootRect = quill.root.getBoundingClientRect();
        formats.imageX = Math.max(0, Math.min(100, (rect.left - rootRect.left) / Math.max(1, rootRect.width) * 100));
        formats.imageY = Math.max(0, rect.top - rootRect.top);
      }
      quill.formatText(index, 1, formats, 'user');
      if (blot.domNode instanceof HTMLImageElement) selectedImage = blot.domNode;
      selectedImage.classList.add('study-image-selected');
      applyImageGeometry(selectedImage);
      syncFixedImageFlowSpace(selectedImage);
      refreshImageLayoutButtons();
      window.requestAnimationFrame(updateImageLayoutToolbarPosition);
      event.preventDefault();
      event.stopPropagation();
    }

    function handleEditorImageClick(event) {
      const image = event.target instanceof HTMLImageElement ? event.target : null;
      if (!image || !quill.root.contains(image)) return;
      event.preventDefault();
      event.stopPropagation();
      selectEditorImage(image);
    }

    function markDirty() {
      if (!initialized) return;
      editRevision += 1;
      dirty = true;
      setStatus('Unsaved');
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => saveNow(), 750);
    }

    function saveNow() {
      window.clearTimeout(saveTimer);
      const revision = editRevision;
      const data = snapshot();
      saveQueue = saveQueue.then(async () => {
        setStatus('Saving…', 'saving');
        const result = await window.pywebview.api.save_document(data.title, data.delta);
        if (!result.ok) throw new Error(result.error || 'Save failed');
        if (revision === editRevision) {
          dirty = false;
          setStatus('✓ Saved', 'saved');
        }
      }).catch((error) => {
        console.error(error);
        setStatus('Save failed', 'error');
      });
      return saveQueue;
    }

    async function flushPendingSave() {
      window.clearTimeout(saveTimer);
      if (dirty) await saveNow();
      else await saveQueue;
    }

    async function requestClose() {
      if (closingRequested) return;
      if (!infoPopover.hidden) closeInfoPopover(true);
      if (!boxTimerPopover.hidden && !commitBoxRevealSeconds(true)) return;
      finishActiveTextEditor(true);
      finishActiveWhiteboardTextEditor(true);
      if (whiteboardExists) {
        whiteboardScrollX = whiteboardLogicalScrollX();
        whiteboardScrollY = whiteboardLogicalScrollY();
        queueWhiteboardViewportSave(0);
      }
      closeDrawToolPopover();
      setSlideAnnotationMode(null);
      setBoxMode(false);
      closingRequested = true;
      backButton.disabled = true;
      saveButton.disabled = true;
      queueEditorLayoutPatch({
        notes_scroll_top: Math.max(0, Math.round(notesStage.scrollTop)),
        slides_scroll_top: Math.max(0, Math.round(slidesStage.scrollTop)),
        slides_visible: editorWorkspace.classList.contains('split-preview'),
        split_ratio: splitRatio,
        document_format: documentFormat
      }, 0);
      await Promise.all([
        flushPendingSave(),
        flushEditorLayoutPatch(),
        flushWhiteboardSave(),
        flushWhiteboardViewportSave(),
        occlusionSaveQueue,
        slideAnnotationSaveQueue
      ]);
      await window.pywebview.api.request_close();
    }

    function hasSlidesAttachment() {
      return Boolean(slidesAttachment && slidesAttachment.relative_path);
    }

    function showSlidesPlaceholder(title, copy) {
      slidesPlaceholderTitle.textContent = title;
      slidesPlaceholderCopy.textContent = copy;
      slidesPlaceholder.hidden = false;
      slidesPdfViewer.hidden = true;
    }

    function renderSlidesAttachment() {
      if (!hasSlidesAttachment()) {
        renderedPdfPath = null;
        slidesPdfViewer.replaceChildren();
        showSlidesPlaceholder('Slides', 'Assign a PDF with + Slides.');
        return;
      }
      if (renderedPdfPath !== slidesAttachment.relative_path) {
        slidesPdfViewer.replaceChildren();
        showSlidesPlaceholder(
          slidesAttachment.display_name || 'Assigned PDF',
          'Loading PDF…'
        );
      }
    }

    async function loadPdfJs() {
      if (!pdfServiceConfig || !pdfServiceConfig.pdfJsUrl) {
        throw new Error('The local PDF service is not ready.');
      }
      if (!pdfJsModulePromise) {
        pdfJsModulePromise = import(pdfServiceConfig.pdfJsUrl);
      }
      const pdfjsLib = await pdfJsModulePromise;
      pdfjsLib.GlobalWorkerOptions.workerSrc = pdfServiceConfig.pdfWorkerUrl;
      return pdfjsLib;
    }

    async function renderAssignedPdf() {
      if (!hasSlidesAttachment()) return;
      if (!pdfServiceConfig || !pdfServiceConfig.pdfUrl) return;
      if (renderedPdfPath === slidesAttachment.relative_path && slidesPdfViewer.childElementCount) {
        refreshOcclusionBoxes();
        refreshSlideAnnotations();
        slidesPdfViewer.classList.toggle('box-mode', boxModeActive);
        slidesPdfViewer.classList.toggle('draw-mode', SLIDE_DRAW_TOOLS.has(slideAnnotationMode));
        slidesPdfViewer.classList.toggle('text-mode', slideAnnotationMode === 'text');
        slidesPdfViewer.classList.toggle('label-mode', slideAnnotationMode === 'label');
        slidesPlaceholder.hidden = true;
        slidesPdfViewer.hidden = false;
        return;
      }
      if (pdfRenderPromise) return pdfRenderPromise;

      const attachmentPath = slidesAttachment.relative_path;
      pdfRenderPromise = (async () => {
        showSlidesPlaceholder(
          slidesAttachment.display_name || 'Assigned PDF',
          'Loading PDF…'
        );
        try {
          const pdfjsLib = await loadPdfJs();
          const loadingTask = pdfjsLib.getDocument({ url: pdfServiceConfig.pdfUrl });
          const pdf = await loadingTask.promise;
          const viewerFragment = document.createDocumentFragment();
          const availableWidth = Math.max(320, slidesStage.clientWidth - 48);
          const outputScale = Math.min(window.devicePixelRatio || 1, 1.5);

          for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
            const page = await pdf.getPage(pageNumber);
            const baseViewport = page.getViewport({ scale: 1 });
            const cssScale = availableWidth / baseViewport.width;
            const renderViewport = page.getViewport({ scale: cssScale * outputScale });

            const pageFrame = document.createElement('div');
            pageFrame.className = 'slides-pdf-page';
            pageFrame.dataset.pageNumber = String(pageNumber);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.floor(renderViewport.width));
            canvas.height = Math.max(1, Math.floor(renderViewport.height));
            canvas.setAttribute('aria-label', `PDF page ${pageNumber}`);
            const occlusionLayer = document.createElement('div');
            occlusionLayer.className = 'occlusion-layer';
            prepareOcclusionLayer(occlusionLayer, pageNumber);
            const annotationLayer = document.createElement('div');
            annotationLayer.className = 'slide-annotation-layer';
            prepareSlideAnnotationLayer(annotationLayer, pageNumber);
            pageFrame.appendChild(canvas);
            pageFrame.appendChild(occlusionLayer);
            pageFrame.appendChild(annotationLayer);
            viewerFragment.appendChild(pageFrame);

            const context = canvas.getContext('2d', { alpha: false });
            await page.render({ canvasContext: context, viewport: renderViewport }).promise;
          }

          if (!slidesAttachment || slidesAttachment.relative_path !== attachmentPath) return;
          slidesPdfViewer.replaceChildren(viewerFragment);
          slidesPdfViewer.classList.toggle('box-mode', boxModeActive);
          slidesPdfViewer.classList.toggle('draw-mode', SLIDE_DRAW_TOOLS.has(slideAnnotationMode));
          slidesPdfViewer.classList.toggle('text-mode', slideAnnotationMode === 'text');
          slidesPdfViewer.classList.toggle('label-mode', slideAnnotationMode === 'label');
          renderedPdfPath = attachmentPath;
          slidesPlaceholder.hidden = true;
          slidesPdfViewer.hidden = false;
        } catch (error) {
          console.error(error);
          renderedPdfPath = null;
          const message = error && error.message ? error.message : 'PDF could not be rendered.';
          showSlidesPlaceholder(
            slidesAttachment && slidesAttachment.display_name ? slidesAttachment.display_name : 'Slides',
            `PDF rendering failed: ${message}`
          );
          setStatus(`PDF rendering failed: ${message}`, 'error');
        } finally {
          pdfRenderPromise = null;
        }
      })();
      return pdfRenderPromise;
    }

    function configureClickAudio() {
      clickAudio = null;
      if (!pdfServiceConfig || !pdfServiceConfig.clickAudioUrl) return;
      if (pdfServiceConfig.clickAudioEnabled === false) return;
      const audio = new Audio(pdfServiceConfig.clickAudioUrl);
      audio.preload = 'auto';
      const volume = Number(pdfServiceConfig.clickAudioVolume);
      audio.volume = Number.isFinite(volume)
        ? Math.max(0, Math.min(1, volume))
        : 0.55;
      clickAudio = audio;
    }

    function playInterfaceClick() {
      if (!clickAudio) return;
      try {
        clickAudio.pause();
        clickAudio.currentTime = 0;
        const playback = clickAudio.play();
        if (playback && typeof playback.catch === 'function') {
          playback.catch(() => {});
        }
      } catch (_error) {
        // Click audio is cosmetic; never interrupt the editor for it.
      }
    }

    function normalizeScrollSensitivity(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return 1.0;
      if (![0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0].includes(numeric)) return 1.0;
      return numeric;
    }

    function scaledWheelDelta(stage, value, deltaMode) {
      if (deltaMode === 1) return value * 16;
      if (deltaMode === 2) return value * Math.max(1, stage.clientHeight);
      return value;
    }

    function handleSensitiveWheel(stage, event) {
      if (Math.abs(scrollSensitivity - 1.0) < 0.001) return;
      if (event.ctrlKey || event.metaKey || !stage || stage.scrollHeight <= stage.clientHeight) return;
      const deltaY = scaledWheelDelta(stage, event.deltaY, event.deltaMode);
      const deltaX = scaledWheelDelta(stage, event.deltaX, event.deltaMode);
      event.preventDefault();
      stage.scrollTop += deltaY * scrollSensitivity;
      if (deltaX) stage.scrollLeft += deltaX * scrollSensitivity;
    }

    async function refreshScrollSensitivityFromHost() {
      if (!(window.pywebview && window.pywebview.api)) return;
      if (typeof window.pywebview.api.get_scroll_sensitivity !== 'function') return;
      try {
        scrollSensitivity = normalizeScrollSensitivity(
          await window.pywebview.api.get_scroll_sensitivity()
        );
      } catch (_error) {
        // Keep the last known sensitivity if the host is temporarily unavailable.
      }
    }

    function setPdfServiceConfig(config) {
      pdfServiceConfig = config || null;
      scrollSensitivity = normalizeScrollSensitivity(
        pdfServiceConfig && pdfServiceConfig.scrollSensitivity
      );
      configureClickAudio();
      pdfJsModulePromise = null;
      if (editorWorkspace.classList.contains('split-preview')) {
        renderAssignedPdf();
      }
    }

    function updateSlidesButton(showSlides) {
      const hasSlides = hasSlidesAttachment();
      const canAnnotateSlides = hasSlides && showSlides;
      const canAnnotate = whiteboardModeActive || canAnnotateSlides;
      slideLabelMenu.hidden = !canAnnotateSlides;
      slideLabelButton.disabled = !canAnnotateSlides;
      if (!canAnnotateSlides) {
        closeSlideLabelPopover();
        if (slideAnnotationMode === 'label') setSlideAnnotationMode(null);
      }
      createBoxButton.disabled = !hasSlides;
      boxTimerButton.disabled = !hasSlides;
      slideTextButton.disabled = !canAnnotate;
      drawMenuButton.disabled = !canAnnotate;
      slideTextButton.title = whiteboardModeActive
        ? (hasSlides && showSlides ? 'Add persistent text to the Whiteboard or PDF slides' : 'Add persistent text to the Whiteboard')
        : 'Add persistent text to a PDF slide';
      drawMenuButton.title = whiteboardModeActive
        ? (hasSlides && showSlides ? 'Draw on the Whiteboard or PDF slides' : 'Draw on the Whiteboard')
        : 'Draw on PDF slides';
      if (!canAnnotate) {
        setSlideAnnotationMode(null);
        closeDrawToolPopover();
      }
      if (!hasSlides) {
        setBoxMode(false);
        closeBoxTimerPopover();
        slidesLayoutButton.textContent = '+ Slides';
        slidesLayoutButton.title = 'Assign one PDF slide deck to this lecture';
        slidesLayoutButton.setAttribute('aria-pressed', 'false');
        return;
      }
      slidesLayoutButton.textContent = showSlides ? 'Hide Slides' : 'Unhide Slides';
      slidesLayoutButton.title = showSlides ? 'Hide assigned slides' : 'Show assigned slides';
      slidesLayoutButton.setAttribute('aria-pressed', showSlides ? 'true' : 'false');
    }

    async function setSplitPreview(visible, persist = true) {
      const showSlides = Boolean(visible) && hasSlidesAttachment();
      const wasVisible = editorWorkspace.classList.contains('split-preview');
      if (wasVisible && !showSlides) {
        rememberedSlidesScrollTop = Math.max(0, Math.round(slidesStage.scrollTop));
      }
      if (!showSlides) {
        setBoxMode(false);
        if (!whiteboardModeActive) setSlideAnnotationMode(null);
      }
      editorWorkspace.classList.toggle('split-preview', showSlides);
      slidesStage.hidden = !showSlides;
      updateSlidesButton(showSlides);
      updateFormatMenu();
      if (persist && initialized && showSlides !== wasVisible) {
        queueEditorLayoutPatch({
          slides_visible: showSlides,
          slides_scroll_top: rememberedSlidesScrollTop
        });
      }
      if (showSlides) {
        await renderAssignedPdf();
        window.requestAnimationFrame(() => {
          slidesStage.scrollTop = rememberedSlidesScrollTop;
          updateImageLayoutToolbarPosition();
          positionInfoPopover();
        });
      } else {
        window.requestAnimationFrame(() => {
          updateImageLayoutToolbarPosition();
          positionInfoPopover();
        });
      }
    }

    function finishSlidesUpload() {
      slidesUploadPending = false;
      slidesBusy = false;
      slidesLayoutButton.disabled = false;
      slidesFileInput.value = '';
      updateSlidesButton(editorWorkspace.classList.contains('split-preview'));
    }

    async function processSlidesUploadResult() {
      if (!slidesUploadPending) return;

      try {
        let result = null;
        try {
          const body = slidesUploadFrame.contentDocument && slidesUploadFrame.contentDocument.body;
          const text = body ? body.textContent.trim() : '';
          if (text) result = JSON.parse(text);
        } catch (_parseError) {
          // The authoritative Lecture JSON below is the fallback/source of truth.
        }

        if (result && result.ok === false) {
          throw new Error(result.error || 'Slides could not be assigned.');
        }

        const documentData = await window.pywebview.api.load_document();
        slidesAttachment = documentData.slides_attachment || (result && result.attachment) || null;
        loadOcclusionState(documentData);
        loadSlideAnnotationState(documentData);
        renderedPdfPath = null;
        if (!hasSlidesAttachment()) {
          throw new Error(
            (result && result.error) || 'The PDF upload finished, but no attachment was saved.'
          );
        }

        renderSlidesAttachment();
        const layout = documentData.editor_layout || (result && result.editor_layout) || {};
        applySplitRatio(layout.split_ratio);
        applyDocumentFormat(layout.document_format, false);
        setSplitPreview(layout.slides_visible !== false);
        setStatus('✓ Slides assigned', 'saved');
      } catch (error) {
        console.error(error);
        const message = error && error.message ? error.message : 'Slides could not be assigned.';
        setStatus(`Slides import failed: ${message}`, 'error');
        slidesLayoutButton.title = `Slides import failed: ${message}`;
      } finally {
        finishSlidesUpload();
      }
    }

    async function importSelectedSlides() {
      const file = slidesFileInput.files && slidesFileInput.files[0]
        ? slidesFileInput.files[0]
        : null;
      if (!file) return;

      if (!file.name.toLowerCase().endsWith('.pdf')) {
        slidesFileInput.value = '';
        setStatus('Slides import failed: select a PDF file.', 'error');
        return;
      }

      slidesBusy = true;
      slidesLayoutButton.disabled = true;
      slidesLayoutButton.textContent = 'Importing…';
      try {
        await flushPendingSave();
        slidesUploadPending = true;
        slidesUploadForm.submit();
      } catch (error) {
        console.error(error);
        const message = error && error.message ? error.message : 'Slides could not be assigned.';
        setStatus(`Slides import failed: ${message}`, 'error');
        finishSlidesUpload();
      }
    }

    function handleSlidesButton() {
      if (slidesBusy) return;

      if (hasSlidesAttachment()) {
        setSplitPreview(!editorWorkspace.classList.contains('split-preview'));
        return;
      }

      slidesFileInput.value = '';
      slidesFileInput.click();
    }

    let selectedRangeBeforeInfo = null;
    let activeInfoId = null;
    let activeInfoEditing = false;

    function makeInfoId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return `info_${window.crypto.randomUUID().replace(/-/g, '')}`;
      }
      return `info_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    }

    function captureInfoSelection() {
      const selection = quill.getSelection();
      selectedRangeBeforeInfo = selection && selection.length
        ? {index: selection.index, length: selection.length}
        : null;
    }

    function infoNodes(infoId) {
      if (!infoId) return [];
      return Array.from(quill.root.querySelectorAll('[data-info-id]')).filter(
        (node) => node.getAttribute('data-info-id') === infoId
      );
    }

    function infoPayloadFromId(infoId) {
      const node = infoNodes(infoId)[0];
      return node
        ? {id: infoId, text: node.getAttribute('data-info-text') || ''}
        : {id: infoId, text: ''};
    }

    function infoRanges(infoId) {
      const ranges = [];
      let index = 0;
      for (const op of (quill.getContents().ops || [])) {
        const length = typeof op.insert === 'string' ? op.insert.length : 1;
        const payload = normalizeInfoPayload(op.attributes && op.attributes.info);
        if (payload.id === infoId) ranges.push({index, length});
        index += length;
      }
      return ranges;
    }

    function updateInfoValue(infoId, text, source = 'user') {
      const ranges = infoRanges(infoId);
      if (!ranges.length) return false;
      const normalizedText = String(text || '').trim();
      if (!normalizedText) {
        for (const range of ranges) {
          quill.formatText(range.index, range.length, 'info', false, source);
        }
        return false;
      }
      const value = serializeInfoPayload({id: infoId, text: normalizedText});
      for (const range of ranges) {
        quill.formatText(range.index, range.length, 'info', value, source);
      }
      return true;
    }

    function getInfoAnchorRect(infoId) {
      const nodes = infoNodes(infoId).filter((node) => {
        const rect = node.getBoundingClientRect();
        return rect.width > 0 && rect.height > 0;
      });
      if (!nodes.length) return null;
      const rects = nodes.map((node) => node.getBoundingClientRect());
      return {
        left: Math.min(...rects.map((rect) => rect.left)),
        right: Math.max(...rects.map((rect) => rect.right)),
        top: Math.min(...rects.map((rect) => rect.top)),
        bottom: Math.max(...rects.map((rect) => rect.bottom))
      };
    }

    function positionInfoPopover() {
      if (infoPopover.hidden || !activeInfoId) return;
      const anchor = getInfoAnchorRect(activeInfoId);
      if (!anchor) {
        closeInfoPopover(false);
        return;
      }

      const edge = 12;
      const gap = 18;
      const popoverRect = infoPopover.getBoundingClientRect();
      const anchorCenter = (anchor.left + anchor.right) / 2;
      let left = anchorCenter - (popoverRect.width / 2);
      left = Math.max(edge, Math.min(left, window.innerWidth - popoverRect.width - edge));

      let top = anchor.top - popoverRect.height - gap;
      let below = false;
      if (top < edge) {
        top = anchor.bottom + gap;
        below = true;
      }
      infoPopover.classList.toggle('below', below);
      infoPopover.style.left = `${Math.round(left)}px`;
      infoPopover.style.top = `${Math.round(top)}px`;

    function openInfoPopover(infoId, editing = false) {
      const payload = infoPayloadFromId(infoId);
      activeInfoId = infoId;
      activeInfoEditing = Boolean(editing);
      infoPopoverContent.textContent = payload.text;
      infoPopoverContent.contentEditable = activeInfoEditing ? 'true' : 'false';
      infoPopoverContent.classList.toggle('editing', activeInfoEditing);
      infoPopover.hidden = false;
      window.requestAnimationFrame(() => {
        positionInfoPopover();
        if (activeInfoEditing) {
          infoPopoverContent.focus({preventScroll: true});
          const range = document.createRange();
          range.selectNodeContents(infoPopoverContent);
          range.collapse(false);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        }
      });
    }

    function closeInfoPopover(commit = true) {
      if (infoPopover.hidden) return;
      const infoId = activeInfoId;
      const shouldCommit = commit && activeInfoEditing && infoId;
      const text = infoPopoverContent.textContent || '';
      infoPopover.hidden = true;
      infoPopover.classList.remove('below');
      infoPopoverContent.contentEditable = 'false';
      infoPopoverContent.classList.remove('editing');
      activeInfoId = null;
      activeInfoEditing = false;
      if (shouldCommit) {

    function createInfoFromSelection() {
      const selection = selectedRangeBeforeInfo || quill.getSelection();
      selectedRangeBeforeInfo = null;
      if (!selection || !selection.length) {
        setStatus('Select text before using + Info.', 'error');
        return;
      }

      const rawText = quill.getText(selection.index, selection.length);
      const leadingWhitespace = (rawText.match(/^\s*/) || [''])[0].length;
      const trailingWhitespace = (rawText.match(/\s*$/) || [''])[0].length;
      const infoLength = selection.length - leadingWhitespace - trailingWhitespace;
      if (infoLength <= 0) {
        setStatus('Select text before using + Info.', 'error');
        return;
      }

      const infoIndex = selection.index + leadingWhitespace;
      const existing = normalizeInfoPayload(quill.getFormat(infoIndex, Math.max(1, infoLength)).info);
      const infoId = existing.id || makeInfoId();
      const value = serializeInfoPayload({id: infoId, text: existing.text || ''});
      quill.formatText(infoIndex, infoLength, 'info', value, 'user');
      quill.setSelection(null, 'silent');
      if (typeof quill.blur === 'function') quill.blur();
      const nativeSelection = window.getSelection && window.getSelection();
      if (nativeSelection) nativeSelection.removeAllRanges();
      openInfoPopover(infoId, true);

      let left = buttonRect.right + gap;

      left = Math.max(edge, Math.min(left, window.innerWidth - panelRect.width - edge));

      }
      if (!targetIsEditable && selectedSlideLabelId && (event.key === 'Backspace' || event.key === 'Delete')) {
        event.preventDefault();
        event.stopPropagation();
        deleteSlideLabelById(selectedSlideLabelId);
        return;
      }
      if (selectedImage && selectedImage.isConnected) {
        const key = String(event.key || '').toLowerCase();
        if (event.key === 'Backspace' || event.key === 'Delete') {
          event.preventDefault();
          event.stopPropagation();
          deleteSelectedImage();
          return;
        }
        if ((event.ctrlKey || event.metaKey) && key === 'c') {
          event.preventDefault();
          event.stopPropagation();
          copySelectedImageToClipboard();
          return;
        }
        if ((event.ctrlKey || event.metaKey) && key === 'x') {
          event.preventDefault();
          event.stopPropagation();
          copySelectedImageToClipboard().then((copied) => {
            if (copied && selectedImage && selectedImage.isConnected) deleteSelectedImage();
          });
          return;
        }
      }
      if (event.key === 'Escape' && !infoPopover.hidden) {
        event.preventDefault();
        closeInfoPopover(true);
        return;
      }
      if (event.key === 'Escape' && selectedImage) {
        event.preventDefault();
        clearSelectedImage();
        return;
      }
      if (event.key === 'Escape' && !formatMenuPopover.hidden) {
        event.preventDefault();
        closeFormatMenu();
        return;
      }
      if (event.key === 'Escape' && !slideLabelPopover.hidden) {
        event.preventDefault();
        closeSlideLabelPopover();
        return;
      }
      if (event.key === 'Escape' && !drawSizePopover.hidden) {
        event.preventDefault();
        closeDrawSizePopover();
        return;
      }
      if (event.key === 'Escape' && !drawToolPopover.hidden) {
        event.preventDefault();
        closeDrawToolPopover();
        return;
      }
      if (event.key === 'Escape' && slideAnnotationMode) {
        event.preventDefault();
        finishActiveTextEditor(false);
        setSlideAnnotationMode(null);
        setStatus('Slide annotation mode cancelled.');
        return;
      }
      if (event.key === 'Escape' && !boxTimerPopover.hidden) {
        event.preventDefault();
        updateBoxTimerButton();
        closeBoxTimerPopover();
        return;
      }
      if (event.key === 'Escape' && boxModeActive) {
        event.preventDefault();
        setBoxMode(false);
        setStatus('Box mode cancelled.');
        return;
      }
      if (event.key === 'Escape' && !questionOverlay.hidden) {
        event.preventDefault();
        closeQuestionDialog();
        return;
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
        event.preventDefault();
        if (activeWhiteboardTextEditor) finishActiveWhiteboardTextEditor(true);
        Promise.all([saveNow(), flushWhiteboardSave(), flushWhiteboardViewportSave()]);
      }
    });
  </script>
  <script src="../cloud_sync.js"></script>
  <script src="browser_editor_bridge.js"></script>
</body>
</html>
