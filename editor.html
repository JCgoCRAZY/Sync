<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Study Material</title>
  <link rel="stylesheet" href="quill/quill.snow.css">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      --bg: #09131d;
      --bar: #0d1924;
      --card: #11212d;
      --inner: #172d3b;
      --accent: #26c8b8;
      --text: #f1f5f9;
      --muted: #91a4b4;
      --paper: #fbfcfd;
      --ink: #1c2730;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body { color: var(--text); }

    .app {
      display: grid;
      grid-template-rows: 64px auto minmax(0, 1fr);
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      min-width: 0;
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(240px, 1fr) auto auto;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;
      background: var(--bar);
      border-bottom: 1px solid #1c3341;
    }

    button, input, textarea { font: inherit; }

    .nav-button, .save-button {
      border: 0;
      border-radius: 11px;
      padding: 10px 14px;
      color: var(--text);
      background: var(--inner);
      font-weight: 650;
      cursor: pointer;
    }

    .nav-button:hover { background: #1b3545; }

    .save-button {
      min-width: 82px;
      background: #123b3d;
    }

    .save-button:hover { background: var(--accent); color: #071314; }

    #title {
      width: 100%;
      border: 0;
      border-radius: 10px;
      outline: none;
      padding: 9px 12px;
      color: var(--text);
      background: transparent;
      font-size: 17px;
      font-weight: 700;
    }

    #title:focus { background: var(--inner); }

    #save-status {
      min-width: 82px;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    #toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 50px;
      padding: 7px 20px;
      overflow: visible;
      background: var(--card);
      border: 0;
      border-bottom: 1px solid #1c3341;
    }

    #toolbar .ql-formats { margin-right: 10px; }

    #toolbar .study-actions {
      display: flex !important;
      flex: 1 1 720px;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 100%;
      min-width: 0;
      margin-right: 0;
    }
    #toolbar button, #toolbar .ql-picker-label { border-radius: 6px; }
    #toolbar button:hover, #toolbar button.ql-active,
    #toolbar .ql-picker-label:hover { background: var(--inner); }
    .ql-snow .ql-stroke { stroke: var(--muted); }
    .ql-snow .ql-fill { fill: var(--muted); }
    .ql-snow .ql-picker { color: var(--muted); }
    .ql-snow .ql-picker-options {
      background: var(--card);
      border-color: #284353;
    }

    .format-menu {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin-left: 4px;
      margin-right: 8px;
      vertical-align: middle;
    }

    #format-menu-button {
      float: none;
      width: auto;
      min-width: 86px;
      height: 36px;
      padding: 0 12px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 650;
      line-height: 36px;
      cursor: pointer;
    }

    #format-menu-button:hover,
    #format-menu-button[aria-expanded="true"] {
      color: var(--text);
      background: var(--inner);
    }

    #format-menu-button:disabled {
      opacity: 0.42;
      cursor: default;
      background: transparent;
    }

    .format-menu-popover[hidden] { display: none; }
    .format-menu-popover {
      position: absolute;
      z-index: 1250;
      left: 0;
      top: calc(100% + 7px);
      width: 142px;
      padding: 6px;
      border: 1px solid #284353;
      border-radius: 9px;
      background: var(--bar);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.34);
    }

    .format-option {
      display: block !important;
      float: none !important;
      width: 100% !important;
      height: 34px !important;
      padding: 0 10px !important;
      border: 0;
      border-radius: 6px;
      color: var(--text);
      background: transparent;
      font-size: 13px;
      font-weight: 650;
      line-height: 34px;
      text-align: left;
      cursor: pointer;
      clear: both;
    }

    .format-option:hover, .format-option.selected {
      background: var(--inner);
    }

    .format-option.selected::after {
      content: "✓";
      float: right;
      color: var(--accent);
    }

    #whiteboard-toggle-button, #create-question-button, #slides-layout-button, #create-term-button, #create-info-button, #slide-label-button, #slide-text-button, #draw-menu-button, #create-box-button {
      float: none;
      width: auto;
      min-width: 116px;
      height: 36px;
      padding: 0 14px;
      color: var(--text);
      background: #123b3d;
      font-size: 13px;
      font-weight: 700;
      line-height: 36px;
    }

    #whiteboard-toggle-button:hover, #create-question-button:hover, #slides-layout-button:hover, #create-term-button:hover,
    #create-info-button:hover, #slide-label-button:hover, #slide-label-button.active, #slide-text-button:hover, #slide-text-button.active, #draw-menu-button:hover, #draw-menu-button.active, #create-box-button:hover, #create-box-button.active {
      color: #071314;
      background: var(--accent);
    }

    #whiteboard-toggle-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 126px;
      margin-right: 4px;
      white-space: nowrap;
    }

    .whiteboard-toggle-icon,
    .whiteboard-toggle-label {
      pointer-events: none;
    }

    .whiteboard-zoom-controls {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      height: 34px;
      margin-left: 4px;
      border: 1px solid #284353;
      border-radius: 7px;
      overflow: hidden;
      background: #0d2630;
      color: var(--text);
      vertical-align: middle;
    }

    .whiteboard-zoom-controls[hidden] { display: none !important; }

    #toolbar .whiteboard-zoom-controls button {
      float: none;
      width: 30px;
      min-width: 30px;
      height: 32px;
      padding: 0;
      border-radius: 0;
      color: var(--text);
      background: transparent;
      font-size: 16px;
      font-weight: 800;
      line-height: 32px;
    }

    #toolbar .whiteboard-zoom-controls button:hover:not(:disabled) {
      color: #071314;
      background: var(--accent);
    }

    #toolbar .whiteboard-zoom-controls button:disabled {
      opacity: 0.38;
      cursor: default;
    }

    #whiteboard-zoom-value {
      min-width: 56px;
      padding: 0 7px;
      border-left: 1px solid #284353;
      border-right: 1px solid #284353;
      font-size: 13px;
      font-weight: 750;
      line-height: 32px;
      text-align: center;
      white-space: nowrap;
      user-select: none;
    }

    #toolbar #whiteboard-zoom-reset {
      width: auto;
      min-width: 48px;
      padding: 0 9px;
      border-left: 1px solid #284353;
      font-size: 11px;
      font-weight: 700;
    }

    #slide-label-button:disabled, #slide-text-button:disabled, #draw-menu-button:disabled, #create-box-button:disabled, #box-timer-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .box-tool-stack {
      position: relative;
      display: inline-flex;
      flex: 0 1 auto;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 100%;
      min-width: 0;
      margin-left: auto;
      vertical-align: middle;
    }

    .slide-annotation-tools {
      display: inline-flex;
      flex: 0 1 auto;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 100%;
      min-width: 0;
    }

    .draw-tool-menu,
    .slide-label-menu {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .slide-label-menu[hidden] { display: none !important; }

    #slide-label-button, #slide-text-button, #draw-menu-button {
      min-width: 100px;
    }

    .slide-label-popover[hidden] { display: none; }
    .slide-label-popover {
      position: absolute;
      z-index: 1550;
      left: 0;
      top: calc(100% + 7px);
      width: 132px;
      padding: 4px 0;
      border: 1px solid #315356;
      border-radius: 2px;
      background: #123b3d;
      box-shadow: 0 8px 24px rgba(3, 12, 16, 0.28);
    }
    #toolbar .slide-label-option {
      float: none;
      display: block;
      width: 100%;
      height: 34px;
      padding: 0 12px;
      border: 0;
      border-radius: 0;
      color: #ffffff;
      background: #123b3d;
      font-size: 13px;
      font-weight: 600;
      line-height: 34px;
      text-align: left;
      cursor: pointer;
    }
    #toolbar .slide-label-option:hover {
      color: #071314;
      background: var(--accent);
    }

    .draw-tool-popover[hidden], .draw-size-popover[hidden] { display: none; }
    .draw-tool-popover {
      position: absolute;
      z-index: 1500;
      left: 50%;
      top: calc(100% + 8px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 104px);
      overflow: visible;
      border: 1px solid #52616a;
      border-radius: 8px;
      background: #f7f8fa;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.38);
    }

    .draw-tool-card {
      position: relative;
      min-height: 126px;
      padding: 10px 8px 8px;
      border: 0;
      border-right: 1px solid #aab1b8;
      color: #15191c;
      background: #ffffff;
      text-align: center;
    }
    .draw-tool-card:last-child { border-right: 0; }
    .draw-tool-card.selected { background: #e7ebff; }
    .draw-tool-card-main {
      display: flex !important;
      float: none !important;
      width: 100% !important;
      height: 74px !important;
      padding: 0 !important;
      align-items: center;
      justify-content: center;
      border: 0 !important;
      background: transparent !important;
      cursor: pointer;
    }
    .draw-tool-card-main svg { width: 58px; height: 58px; }
    .draw-tool-card.selected .draw-tool-card-main svg { color: #3457e5; }
    .draw-tool-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 28px;
    }
    .draw-size-button, .draw-color-button {
      display: inline-grid !important;
      float: none !important;
      width: 26px !important;
      min-width: 26px !important;
      height: 26px !important;
      padding: 0 !important;
      place-items: center;
      border: 0 !important;
      border-radius: 5px !important;
      background: transparent !important;
      cursor: pointer;
    }
    .draw-size-button:hover, .draw-color-button:hover { background: #e8edf2 !important; }
    .draw-size-dot {
      display: block;
      width: var(--dot-size, 12px);
      height: var(--dot-size, 12px);
      border: 2px solid #5368ff;
      border-radius: 50%;
      background: var(--dot-color, #26c86f);
      box-shadow: 0 0 0 2px #fff inset;
    }
    .draw-color-wheel {
      display: block;
      width: 20px;
      height: 20px;
      border: 1px solid #7d8790;
      border-radius: 50%;
      background: conic-gradient(#ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
    }

    .draw-size-popover {
      position: fixed;
      z-index: 1700;
      width: 42px;
      padding: 5px;
      border: 1px solid #9aa4ad;
      border-radius: 7px;
      background: #ffffff;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.3);
    }
    .draw-size-option {
      display: grid !important;
      float: none !important;
      width: 30px !important;
      min-width: 30px !important;
      height: 34px !important;
      padding: 0 !important;
      place-items: center;
      border: 0 !important;
      border-radius: 5px !important;
      background: transparent !important;
      cursor: pointer;
    }
    .draw-size-option:hover, .draw-size-option.selected { background: #eef2f6 !important; }
    .draw-size-option .draw-size-dot { --dot-color: #26c86f; }

    .slide-annotation-layer {
      position: absolute;
      z-index: 4;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      touch-action: none;
    }
    .slide-annotation-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .slide-annotation-stroke {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }
    .slide-text-annotation {
      position: absolute;
      z-index: 6;
      box-sizing: border-box;
      min-width: 64px;
      min-height: 30px;
      padding: 4px 7px;
      border: 1px solid rgba(40, 53, 64, 0.28);
      border-radius: 2px;
      color: #111827;
      background: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.28;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow: hidden;
      cursor: text;
      pointer-events: auto;
      user-select: text;
    }
    .slide-text-annotation.selected {
      z-index: 9;
      border: 2px solid #1a73e8;
      overflow: visible;
    }
    .slide-text-content {
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }
    .slide-text-move-zone,
    .slide-text-resize-handle {
      display: none;
      position: absolute;
      z-index: 12;
      touch-action: none;
      user-select: none;
    }
    .slide-text-annotation.selected .slide-text-move-zone,
    .slide-text-annotation.selected .slide-text-resize-handle {
      display: block;
    }
    .slide-text-move-zone { cursor: move; }
    .slide-text-move-zone[data-edge="n"] { left: 9px; right: 9px; top: -6px; height: 10px; }
    .slide-text-move-zone[data-edge="e"] { top: 9px; bottom: 9px; right: -6px; width: 10px; }
    .slide-text-move-zone[data-edge="s"] { left: 9px; right: 9px; bottom: -6px; height: 10px; }
    .slide-text-move-zone[data-edge="w"] { top: 9px; bottom: 9px; left: -6px; width: 10px; }
    .slide-text-resize-handle {
      width: 10px;
      height: 10px;
      border: 2px solid #1a73e8;
      border-radius: 50%;
      background: #fff;
      box-sizing: border-box;
    }
    .slide-text-resize-handle[data-handle="nw"] { left: -6px; top: -6px; cursor: nwse-resize; }
    .slide-text-resize-handle[data-handle="n"] { left: 50%; top: -6px; transform: translateX(-50%); cursor: ns-resize; }
    .slide-text-resize-handle[data-handle="ne"] { right: -6px; top: -6px; cursor: nesw-resize; }
    .slide-text-resize-handle[data-handle="e"] { right: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
    .slide-text-resize-handle[data-handle="se"] { right: -6px; bottom: -6px; cursor: nwse-resize; }
    .slide-text-resize-handle[data-handle="s"] { left: 50%; bottom: -6px; transform: translateX(-50%); cursor: ns-resize; }
    .slide-text-resize-handle[data-handle="sw"] { left: -6px; bottom: -6px; cursor: nesw-resize; }
    .slide-text-resize-handle[data-handle="w"] { left: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
    .slide-text-editor {
      position: absolute;
      z-index: 10;
      box-sizing: border-box;
      min-width: 64px;
      min-height: 30px;
      padding: 4px 7px;
      border: 2px solid #1a73e8;
      border-radius: 2px;
      outline: none;
      color: #111827;
      background: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.28;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow: auto;
      resize: both;
      pointer-events: auto;
      user-select: text;
      caret-color: currentColor;
    }
    .slide-text-editor:empty::before {
      content: attr(data-placeholder);
      color: #8a939d;
      pointer-events: none;
    }

    .slide-label-annotation {
      position: absolute;
      z-index: 7;
      box-sizing: border-box;
      min-width: 34px;
      min-height: 22px;
      padding: 3px 8px;
      border: 1px solid transparent;
      border-radius: 1px;
      color: #ffffff;
      background: #123b3d;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: move;
      pointer-events: auto;
      user-select: none;
    }
    .slide-label-annotation.selected {
      z-index: 10;
      border: 2px solid #1a73e8;
      overflow: visible;
    }
    .slide-label-annotation.selected .slide-text-resize-handle { display: block; }
    .slide-text-format-toolbar[hidden] { display: none; }
    .slide-text-format-toolbar {
      position: fixed;
      z-index: 2100;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border: 1px solid #d7dce2;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 6px 22px rgba(20, 32, 45, 0.2);
      color: #202124;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }
    .slide-text-format-toolbar button {
      height: 32px;
      padding: 0 10px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .slide-text-format-toolbar button:hover { background: #f1f3f4; }
    .slide-text-format-toolbar button:disabled {
      color: #9aa0a6;
      cursor: default;
      background: transparent;
    }
    .slide-text-format-toolbar .format-divider {
      width: 1px;
      height: 22px;
      background: #e4e7eb;
    }
    .slide-text-context-menu[hidden] { display: none; }
    .slide-text-context-menu {
      position: fixed;
      z-index: 2000;
      width: 250px;
      padding: 6px 0;
      border: 1px solid #d7dce2;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(20, 32, 45, 0.22);
      color: #202124;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }
    .slide-text-context-menu button {
      width: 100%;
      height: 38px;
      padding: 0 14px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .slide-text-context-menu button:hover { background: #f1f3f4; }
    .slide-text-context-menu .menu-separator {
      height: 1px;
      margin: 5px 0;
      background: #e4e7eb;
    }
    #slide-label-context-menu { width: 150px; }
    .slides-pdf-viewer.draw-mode .slide-annotation-layer,
    .slides-pdf-viewer.text-mode .slide-annotation-layer,
    .slides-pdf-viewer.label-mode .slide-annotation-layer {
      pointer-events: auto;
    }
    .slides-pdf-viewer.draw-mode .slide-annotation-layer,
    .slides-pdf-viewer.label-mode .slide-annotation-layer { cursor: crosshair; }
    .slides-pdf-viewer.text-mode .slide-annotation-layer { cursor: text; }
    .slides-pdf-viewer.draw-mode .slide-text-annotation,
    .slides-pdf-viewer.text-mode .slide-text-annotation,
    .slides-pdf-viewer.label-mode .slide-text-annotation,
    .slides-pdf-viewer.box-mode .slide-text-annotation,
    .slides-pdf-viewer.draw-mode .slide-label-annotation,
    .slides-pdf-viewer.text-mode .slide-label-annotation,
    .slides-pdf-viewer.label-mode .slide-label-annotation,
    .slides-pdf-viewer.box-mode .slide-label-annotation { pointer-events: none; }

    #box-timer-button {
      float: none;
      width: auto;
      min-width: 96px;
      height: 36px;
      padding: 0 12px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: #172d3b;
      font-size: 13px;
      font-weight: 700;
      line-height: 36px;
      cursor: pointer;
    }

    #box-timer-button:hover { color: var(--text); background: #1b3545; }

    #create-box-button {
      width: auto;
      min-width: 116px;
      height: 36px;
    }

    .box-timer-popover[hidden] { display: none; }
    .box-timer-popover {
      position: absolute;
      z-index: 1250;
      right: 0;
      bottom: calc(100% + 8px);
      width: 260px;
      padding: 10px 12px;
      border: 1px solid #284353;
      border-radius: 10px;
      color: var(--text);
      background: var(--bar);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.34);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .box-timer-popover input {
      width: 42px;
      height: 26px;
      margin: 0 4px;
      padding: 2px 5px;
      border: 1px solid #284353;
      border-radius: 7px;
      outline: none;
      color: var(--text);
      background: var(--inner);
      text-align: center;
      font-weight: 700;
    }

    .box-timer-popover input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .whiteboard-shell[hidden] { display: none; }
    .editor-stage.whiteboard-active {
      position: relative;
      overflow: hidden;
      padding: 0 !important;
    }
    .whiteboard-shell {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #eef1f3;
    }
    .whiteboard-scrollport {
      position: absolute;
      inset: 0;
      overflow: scroll;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      background: #eef1f3;
      touch-action: none;
    }
    .whiteboard-scrollport.grabbing,
    .whiteboard-scrollport.grabbing * {
      cursor: grabbing !important;
      user-select: none !important;
    }
    .whiteboard-surface {
      position: relative;
      min-width: 1px;
      min-height: 1px;
      overflow: visible;
    }
    .whiteboard-world {
      position: absolute;
      left: 0;
      top: 0;
      box-sizing: border-box;
      transform-origin: 0 0;
      min-width: 1px;
      min-height: 1px;
      overflow: hidden;
      background-color: #fbfbfa;
      background-image:
        linear-gradient(rgba(72, 91, 108, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 91, 108, 0.09) 1px, transparent 1px);
      background-size: 32px 32px;
      box-shadow: inset 0 0 0 1px rgba(65, 82, 98, 0.18);
      cursor: default;
      touch-action: none;
    }
    .whiteboard-world.draw-mode { cursor: crosshair; }
    .whiteboard-world.text-mode { cursor: text; }
    .whiteboard-svg {
      position: absolute;
      z-index: 2;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }
    .whiteboard-text-layer {
      position: absolute;
      z-index: 4;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }
    .whiteboard-text-annotation,
    .whiteboard-text-editor {
      pointer-events: auto;
    }
    .whiteboard-world.draw-mode .whiteboard-text-annotation,
    .whiteboard-world.text-mode .whiteboard-text-annotation {
      pointer-events: none;
    }
    .whiteboard-add-space {
      position: absolute;
      z-index: 25;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      filter: drop-shadow(0 4px 8px rgba(15, 28, 38, 0.28));
      cursor: pointer;
    }
    .whiteboard-add-space:hover { transform: scale(1.04); }
    .whiteboard-add-space:active { transform: scale(0.98); }
    .whiteboard-add-space img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }
    .whiteboard-add-right {
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .whiteboard-add-right:hover { transform: translateY(-50%) scale(1.04); }
    .whiteboard-add-right:active { transform: translateY(-50%) scale(0.98); }
    .whiteboard-add-bottom {
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
    }
    .whiteboard-add-bottom:hover { transform: translateX(-50%) scale(1.04); }
    .whiteboard-add-bottom:active { transform: translateX(-50%) scale(0.98); }
    .whiteboard-toolbar-disabled {
      opacity: 0.45 !important;
      cursor: default !important;
    }

    .editor-workspace {
      display: flex;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .editor-stage {
      flex: 1 1 auto;
      min-width: 0;
      overflow: auto;
      padding: 34px 5vw 70px;
      background: var(--bg);
    }

    .split-divider {
      display: none;
      flex: 0 0 6px;
      background: #1c3341;
      border-left: 1px solid #284353;
      border-right: 1px solid #09131d;
      cursor: col-resize;
      touch-action: none;
      user-select: none;
    }

    .split-divider:hover,
    .editor-workspace.resizing .split-divider {
      background: var(--accent);
    }

    .slides-stage {
      display: none;
      flex: 1 1 0;
      width: 0;
      max-width: 100%;
      min-width: 0;
      overflow: auto;
      padding: 34px 24px 70px;
      background: #0b1620;
    }

    .editor-workspace.split-preview .editor-stage {
      flex: 0 0 calc((var(--notes-ratio, 0.5) * 100%) - 3px);
    }

    .editor-workspace.split-preview .split-divider {
      display: block;
    }

    .editor-workspace.split-preview .slides-stage {
      display: block;
    }

    .editor-workspace.full-width .editor-stage {
      padding: 0 0 70px;
    }

    .editor-workspace.full-width .paper {
      width: 100%;
      max-width: none;
      margin: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .editor-workspace.full-width.split-preview .editor-stage {
      padding-right: 6px;
    }

    .slides-placeholder {
      display: grid;
      place-items: center;
      align-content: center;
      min-height: 100%;
      padding: 28px;
      border: 1px dashed #284353;
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
    }

    .slides-placeholder strong {
      margin-bottom: 8px;
      color: var(--text);
      font-size: 18px;
    }

    .slides-placeholder span {
      max-width: 330px;
      font-size: 13px;
      line-height: 1.5;
    }

    .slides-pdf-viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
    }

    .slides-pdf-page {
      position: relative;
      width: 100%;
      background: #ffffff;
      border-radius: 3px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.34);
      overflow: hidden;
    }

    .slides-pdf-page canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
    }

    .occlusion-layer {
      position: absolute;
      z-index: 2;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      touch-action: none;
    }

    .image-occlusion-box {
      position: absolute;
      z-index: 3;
      min-width: 2px;
      min-height: 2px;
      border: 2px solid #26c8b8;
      border-radius: 2px;
      background: rgba(9, 19, 29, 0.97);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.32);
      cursor: pointer;
      pointer-events: auto;
      transition: opacity 100ms ease;
      user-select: none;
    }

    .image-occlusion-box.revealed {
      opacity: 0;
      pointer-events: none;
    }

    .image-occlusion-box.draft {
      border-style: dashed;
      background: rgba(9, 19, 29, 0.72);
      pointer-events: none;
    }

    .slides-pdf-viewer.box-mode .occlusion-layer {
      cursor: crosshair;
      pointer-events: auto;
    }

    .slides-pdf-viewer.box-mode .image-occlusion-box:not(.draft) {
      pointer-events: none;
    }

    .paper {
      width: min(850px, 100%);
      min-height: 1050px;
      margin: 0 auto;
      background: var(--paper);
      border-radius: 3px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.38);
    }

    #editor {
      min-height: 1050px;
      color: var(--ink);
      background: var(--paper);
      border: 0;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    #editor .ql-editor {
      position: relative;
      min-height: 1050px;
      padding: 72px 82px;
      line-height: 1.65;
    }

    #editor .ql-editor.ql-blank::before {
      left: 82px;
      color: #87949d;
      font-style: normal;
    }

    #editor .ql-editor [data-term-id] {
      background: #b9efc5;
      border-radius: 3px;
      box-shadow: inset 0 -1px 0 rgba(42, 121, 66, 0.18);
      color: inherit;
      padding: 0 1px;
    }

    #editor .ql-editor [data-info-id] {
      color: inherit;
      background: #d9dde1 !important;
      background-color: #d9dde1 !important;
      border-radius: 3px;
      box-shadow: inset 0 -1px 0 rgba(78, 88, 97, 0.18) !important;
      padding: 0 1px;
    }

    .info-popover[hidden] { display: none; }
    .info-popover {
      --pointer-left: 50%;
      position: fixed;
      z-index: 1500;
      width: min(320px, calc(100vw - 24px));
      min-height: 76px;
      padding: 12px 14px;
      border: 2px solid #1f252b;
      border-radius: 2px;
      color: #f4f6f8;
      background: #5d5d5d;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      user-select: text;
    }

    .info-popover::before, .info-popover::after {
      content: "";
      position: absolute;
      left: var(--pointer-left);
      transform: translateX(-50%);
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .info-popover::before {
      top: 100%;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 20px solid #1f252b;
    }

    .info-popover::after {
      top: calc(100% - 2px);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 16px solid #5d5d5d;
    }

    .info-popover.below::before {
      top: auto;
      bottom: 100%;
      border-top: 0;
      border-bottom: 20px solid #1f252b;
    }

    .info-popover.below::after {
      top: auto;
      bottom: calc(100% - 2px);
      border-top: 0;
      border-bottom: 16px solid #5d5d5d;
    }

    .info-popover-content {
      min-height: 48px;
      outline: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      cursor: text;
      user-select: text;
    }

    .info-popover-content.editing:empty::before {
      content: "Type information…";
      color: #d0d4d8;
      pointer-events: none;
    }

    #editor .ql-editor::after {
      content: "";
      display: table;
      clear: both;
    }

    #editor .ql-editor img {
      width: auto;
      max-width: 100%;
      height: auto;
      object-fit: fill;
      cursor: pointer;
      box-sizing: border-box;
    }

    #editor .ql-editor img:not([data-image-mode]),
    #editor .ql-editor img[data-image-mode="inline"] {
      position: static;
      z-index: auto;
      display: inline-block;
      float: none;
      clear: none;
      max-width: 100%;
      margin: 2px 4px;
      vertical-align: middle;
    }

    #editor .ql-editor img[data-image-mode="wrap"] {
      position: relative;
      z-index: 1;
      display: block;
      float: left;
      clear: none;
      max-width: min(70%, 100%);
      margin: 6px 14px 8px 0;
    }

    #editor .ql-editor img[data-image-mode="break"] {
      position: relative;
      z-index: 1;
      display: block;
      float: none;
      clear: both;
      max-width: 100%;
      margin: 14px 0;
    }

    #editor .ql-editor > *:has(img[data-image-mode="behind"]:not([data-image-anchor="fixed"])),
    #editor .ql-editor li:has(img[data-image-mode="behind"]:not([data-image-anchor="fixed"])),
    #editor .ql-editor > *:has(img[data-image-mode="front"]:not([data-image-anchor="fixed"])),
    #editor .ql-editor li:has(img[data-image-mode="front"]:not([data-image-anchor="fixed"])) {
      position: relative;
      isolation: isolate;
      min-height: 1.65em;
    }

    #editor .ql-editor img[data-image-mode="behind"],
    #editor .ql-editor img[data-image-mode="front"] {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      float: none;
      clear: none;
      max-width: 100%;
      margin: 0;
    }

    #editor .ql-editor img[data-image-mode="behind"] { z-index: -1; }
    #editor .ql-editor img[data-image-mode="front"] { z-index: 8; }

    #editor .ql-editor > *:has(img[data-image-anchor="fixed"]),
    #editor .ql-editor li:has(img[data-image-anchor="fixed"]) {
      position: static !important;
      isolation: auto !important;
    }

    /* A fixed image is visually positioned independently, but its Quill host still
       reserves document space so ordinary text cannot silently run underneath it. */
    #editor .ql-editor .study-fixed-image-flow-host {
      min-height: var(--study-fixed-flow-height, 1.65em) !important;
      box-sizing: border-box;
    }

    #editor .ql-editor .study-fixed-image-flow-host.study-fixed-image-flow-text {
      padding-top: var(--study-fixed-flow-height, 0px) !important;
    }

    #editor .ql-editor img[data-image-anchor="fixed"] {
      position: absolute !important;
      float: none !important;
      clear: none !important;
      margin: 0 !important;
      max-width: none !important;
      cursor: move;
      touch-action: none;
      user-select: none;
    }

    #editor .ql-editor img.study-image-selected[data-image-mode="behind"] {
      z-index: 8;
    }

    .image-selection-overlay[hidden] { display: none; }
    .image-selection-overlay {
      position: fixed;
      z-index: 1490;
      border: 2px solid #1a73e8;
      pointer-events: none;
      box-sizing: border-box;
    }

    .image-resize-handle {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 1px solid #1a73e8;
      background: #ffffff;
      border-radius: 1px;
      pointer-events: auto;
      box-sizing: border-box;
    }

    .image-resize-handle[data-handle="nw"] { left: -6px; top: -6px; cursor: nwse-resize; }
    .image-resize-handle[data-handle="n"]  { left: 50%; top: -6px; transform: translateX(-50%); cursor: ns-resize; }
    .image-resize-handle[data-handle="ne"] { right: -6px; top: -6px; cursor: nesw-resize; }
    .image-resize-handle[data-handle="e"]  { right: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
    .image-resize-handle[data-handle="se"] { right: -6px; bottom: -6px; cursor: nwse-resize; }
    .image-resize-handle[data-handle="s"]  { left: 50%; bottom: -6px; transform: translateX(-50%); cursor: ns-resize; }
    .image-resize-handle[data-handle="sw"] { left: -6px; bottom: -6px; cursor: nesw-resize; }
    .image-resize-handle[data-handle="w"]  { left: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }

    .image-layout-toolbar[hidden] { display: none; }
    .image-layout-toolbar {
      position: fixed;
      z-index: 1500;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      border: 1px solid #dadce0;
      border-radius: 22px;
      color: #3c4043;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(60, 64, 67, 0.30);
      user-select: none;
      font-family: Arial, sans-serif;
    }

    .image-toolbar-divider {
      width: 1px;
      height: 28px;
      background: #dadce0;
    }

    .image-control-dropdown { position: relative; }

    .image-control-menu-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: 17px;
      color: #3c4043;
      background: transparent;
      cursor: pointer;
      font: 500 13px/1 Arial, sans-serif;
      white-space: nowrap;
    }

    .image-control-menu-button:hover,
    .image-control-menu-button.open { background: #f1f3f4; }

    .image-control-menu-button svg {
      width: 26px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .image-control-caret {
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #5f6368;
    }

    .image-dropdown-menu[hidden] { display: none; }
    .image-dropdown-menu {
      position: absolute;
      left: 0;
      top: calc(100% + 7px);
      z-index: 1510;
      min-width: 210px;
      padding: 6px 0;
      border: 1px solid #dadce0;
      border-radius: 8px;
      color: #3c4043;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(60, 64, 67, 0.30);
    }

    .image-layout-option,
    .image-anchor-option {
      display: grid;
      grid-template-columns: 34px 1fr 22px;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      padding: 6px 12px;
      border: 0;
      color: #3c4043;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font: 500 13px/1.2 Arial, sans-serif;
    }

    .image-layout-option:hover,
    .image-anchor-option:hover { background: #f1f3f4; }

    .image-layout-option.selected,
    .image-anchor-option.selected { background: #e8f0fe; }

    .image-layout-option svg {
      width: 30px;
      height: 24px;
      overflow: visible;
      stroke: #5f6368;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .image-option-check {
      color: #1a73e8;
      font-size: 18px;
      text-align: center;
      visibility: hidden;
    }

    .image-layout-option.selected .image-option-check,
    .image-anchor-option.selected .image-option-check { visibility: visible; }

    .ql-snow .ql-tooltip { z-index: 10; }

    .question-overlay[hidden], .question-toast[hidden] { display: none; }

    .question-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: transparent;
      pointer-events: none;
    }

    .question-dialog {
      position: fixed;
      width: min(340px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow: auto;
      padding: 14px;
      border: 1px solid #284353;
      border-radius: 14px;
      background: var(--bar);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.32);
      pointer-events: auto;
    }

    .question-dialog h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .question-field {
      display: block;
      margin: 0 0 10px;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .question-field textarea {
      display: block;
      width: 100%;
      height: 68px;
      min-height: 68px;
      margin-top: 5px;
      padding: 8px 10px;
      resize: vertical;
      border: 1px solid #284353;
      border-radius: 9px;
      outline: none;
      color: var(--text);
      background: var(--inner);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
    }

    .question-field.answer textarea { height: 96px; min-height: 96px; }
    .question-field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .question-error {
      min-height: 18px;
      margin: -2px 0 8px;
      color: #ff8c8c;
      font-size: 12px;
    }

    .question-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .question-actions button {
      min-width: 74px;
      padding: 7px 12px;
      border: 1px solid #284353;
      border-radius: 9px;
      color: var(--text);
      background: var(--inner);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .question-actions .question-save { background: #123b3d; }
    .question-actions .question-save:hover { background: var(--accent); color: #071314; }
    .question-actions button:disabled { opacity: 0.55; cursor: default; }

    .question-toast {
      position: fixed;
      z-index: 1100;
      right: 24px;
      bottom: 24px;
      padding: 12px 16px;
      border: 1px solid #1f655f;
      border-radius: 12px;
      color: #c9fff9;
      background: #123b3d;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
      font-size: 14px;
      font-weight: 700;
    }

    /* Keep the lecture toolbar and split PDF view inside the native window on
       narrower displays and in macOS WKWebView, whose font metrics are wider
       than the Windows WebView defaults. */
    @media (max-width: 1900px) {
      #toolbar { padding-left: 12px; padding-right: 12px; }
      #toolbar .ql-formats { margin-right: 6px; }
      #whiteboard-toggle-button, #create-question-button, #slides-layout-button,
      #create-term-button, #create-info-button, #slide-label-button,
      #slide-text-button, #draw-menu-button, #create-box-button {
        min-width: 92px;
        padding-left: 10px;
        padding-right: 10px;
      }
      #whiteboard-toggle-button { min-width: 106px; }
      .format-menu { margin-left: 2px; margin-right: 4px; }
      #format-menu-button { min-width: 78px; padding-left: 8px; padding-right: 8px; }
      .slides-stage { padding-left: 16px; padding-right: 16px; }
    }

    @media (max-width: 1400px) {
      #toolbar .study-actions { flex-basis: 100%; }
      .box-tool-stack { margin-left: 0; }
      .editor-stage { padding-left: 3vw; padding-right: 3vw; }
      .slides-stage { padding-left: 12px; padding-right: 12px; }
    }

    @media (max-width: 760px) {
      .topbar { grid-template-columns: auto 1fr auto; }
      #save-status { display: none; }
      .editor-stage { padding: 18px 12px 48px; }
      #editor .ql-editor { padding: 46px 36px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="back-button" class="nav-button" type="button">← Study Material</button>
      <input id="title" value="Untitled Document" aria-label="Document title">
      <span id="save-status">Loading…</span>
      <button id="save-button" class="save-button" type="button">Save</button>
    </header>

    <div id="toolbar">
      <span class="ql-formats">
        <button class="ql-undo" type="button" title="Undo">↶</button>
        <button class="ql-redo" type="button" title="Redo">↷</button>
      </span>
      <span class="ql-formats">
        <select class="ql-header" title="Text style">
          <option selected></option>
          <option value="1"></option>
          <option value="2"></option>
        </select>
      </span>
      <span class="ql-formats">
        <button class="ql-bold" type="button" title="Bold"></button>
        <button class="ql-italic" type="button" title="Italic"></button>
        <button class="ql-underline" type="button" title="Underline"></button>
      </span>
      <span class="ql-formats">
        <button class="ql-list" value="ordered" type="button" title="Numbered list"></button>
        <button class="ql-list" value="bullet" type="button" title="Bullet list"></button>
      </span>
      <span class="ql-formats">
        <select class="ql-align" title="Alignment"></select>
        <button class="ql-link" type="button" title="Link"></button>

    const IMAGE_LAYOUT_MODES = new Set(['inline', 'wrap', 'break', 'behind', 'front']);
    const IMAGE_ANCHOR_MODES = new Set(['move', 'fixed']);

    function normalizeImageLayoutMode(value) {
      return IMAGE_LAYOUT_MODES.has(String(value || '')) ? String(value) : 'inline';
    }

    function normalizeImageAnchorMode(value) {
      return IMAGE_ANCHOR_MODES.has(String(value || '')) ? String(value) : 'move';
    }

    function finiteImageNumber(value, fallback = null) {
      // Missing geometry must stay missing. Number(null) and Number('') are 0,
      // which previously collapsed a newly selected image to the 1% minimum.
      if (value === null || value === undefined || String(value).trim() === '') {
        return fallback;
      }
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric : fallback;
    }

    const BaseImageBlot = Quill.import('formats/image');
    class StudyImageBlot extends BaseImageBlot {
      static create(value) {
        const node = super.create(value);
        if (!node.hasAttribute('data-image-mode')) node.setAttribute('data-image-mode', 'inline');
        if (!node.hasAttribute('data-image-anchor')) node.setAttribute('data-image-anchor', 'move');
        return node;
      }

      static formats(node) {
        const formats = super.formats(node) || {};
        formats.imageMode = normalizeImageLayoutMode(node.getAttribute('data-image-mode'));
        formats.imageAnchor = normalizeImageAnchorMode(node.getAttribute('data-image-anchor'));
        for (const [format, attribute] of [
          ['imageWidthPx', 'data-image-width-px'],
          ['imageWidthPct', 'data-image-width-pct'],
          ['imageHeightRatio', 'data-image-height-ratio'],
          ['imageX', 'data-image-x'],
          ['imageY', 'data-image-y'],
        ]) {
          const value = node.getAttribute(attribute);
          if (value !== null && value !== '') formats[format] = value;
        }
        return formats;
      }

      format(name, value) {
        if (name === 'imageMode') {
          this.domNode.setAttribute('data-image-mode', normalizeImageLayoutMode(value));
          return;
        }
        if (name === 'imageAnchor') {
          this.domNode.setAttribute('data-image-anchor', normalizeImageAnchorMode(value));
          return;
        }
        const geometryAttributes = {
          imageWidthPx: 'data-image-width-px',
          imageWidthPct: 'data-image-width-pct',
          imageHeightRatio: 'data-image-height-ratio',
          imageX: 'data-image-x',
          imageY: 'data-image-y',
        };
        if (Object.prototype.hasOwnProperty.call(geometryAttributes, name)) {
          const attribute = geometryAttributes[name];
          const numeric = finiteImageNumber(value);
          if (numeric === null) this.domNode.removeAttribute(attribute);
          else this.domNode.setAttribute(attribute, String(numeric));
          return;
        }
        super.format(name, value);
      }
    }
    StudyImageBlot.blotName = 'image';
    StudyImageBlot.tagName = 'IMG';
    Quill.register(StudyImageBlot, true);

    const InlineBlot = Quill.import('blots/inline');
    class TermBlot extends InlineBlot {
      static create(value) {
        const node = super.create();
        node.setAttribute('data-term-id', String(value));
        return node;
      }

      static formats(node) {
        return node.getAttribute('data-term-id');
      }

      format(name, value) {
        if (name === 'term') {
          if (value) this.domNode.setAttribute('data-term-id', String(value));
          else this.domNode.removeAttribute('data-term-id');
          return;
        }
        super.format(name, value);
      }
    }
    TermBlot.blotName = 'term';
    TermBlot.tagName = 'SPAN';

    function normalizeInfoPayload(value) {

            text: String(parsed.text || '')

    function normalizeAnnotationColor(value, fallback) {
      const text = String(value || '').trim();
      return /^#[0-9a-fA-F]{6}$/.test(text) ? text.toUpperCase() : fallback;
    }

    function normalizeOptionalAnnotationColor(value) {
      const text = String(value || '').trim();
      return /^#[0-9a-fA-F]{6}$/.test(text) ? text.toUpperCase() : null;
    }

    function normalizeSlideTextFormatRuns(rawRuns, textLength) {
      if (!Array.isArray(rawRuns) || !Number.isInteger(textLength) || textLength <= 0) return [];
      const normalized = [];
      for (const raw of rawRuns) {
        if (!raw || typeof raw !== 'object') continue;
        let start = Number(raw.start);
        let end = Number(raw.end);
        if (!Number.isInteger(start) || !Number.isInteger(end)) continue;
        start = Math.max(0, Math.min(textLength, start));
        end = Math.max(0, Math.min(textLength, end));
        if (end <= start) continue;
        const fontColor = normalizeOptionalAnnotationColor(raw.font_color);
        const highlightColor = normalizeOptionalAnnotationColor(raw.highlight_color);
        if (!fontColor && !highlightColor) continue;
        normalized.push({
          start,
          end,
          font_color: fontColor,
          highlight_color: highlightColor
        });
      }
      normalized.sort((a, b) => a.start - b.start || a.end - b.end);
      return normalized;
    }

    function renderSlideTextRichContent(container, item) {
      container.replaceChildren();
      const text = String(item && item.text || '');
      if (!text) return;
      const runs = normalizeSlideTextFormatRuns(item && item.format_runs, text.length);
      if (!runs.length) {
        container.appendChild(document.createTextNode(text));
        return;
      }
      const fontAt = new Array(text.length).fill(null);
      const highlightAt = new Array(text.length).fill(null);
      for (const run of runs) {
        for (let index = run.start; index < run.end; index += 1) {
          if (run.font_color) fontAt[index] = run.font_color;
          if (run.highlight_color) highlightAt[index] = run.highlight_color;
        }
      }
      let start = 0;
      while (start < text.length) {
        const fontColor = fontAt[start];
        const highlightColor = highlightAt[start];
        let end = start + 1;
        while (end < text.length && fontAt[end] === fontColor && highlightAt[end] === highlightColor) end += 1;
        const value = text.slice(start, end);
        if (fontColor || highlightColor) {
          const span = document.createElement('span');
          if (fontColor) span.style.color = fontColor;
          if (highlightColor) span.style.backgroundColor = highlightColor;
          span.textContent = value;
          container.appendChild(span);
        } else {
          container.appendChild(document.createTextNode(value));
        }
        start = end;
      }
    }

    function cssColorToHex(value) {
      const text = String(value || '').trim();
      if (!text || text === 'transparent' || text === 'rgba(0, 0, 0, 0)') return null;
      if (/^#[0-9a-fA-F]{6}$/.test(text)) return text.toUpperCase();
      const match = text.match(/^rgba?\(\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)(?:\s*,\s*([0-9.]+))?\s*\)$/i);
      if (!match) return null;
      if (match[4] !== undefined && Number(match[4]) === 0) return null;
      const parts = match.slice(1, 4).map((part) => Math.max(0, Math.min(255, Math.round(Number(part)))));
      return `#${parts.map((part) => part.toString(16).padStart(2, '0')).join('').toUpperCase()}`;
    }

    function serializeSlideTextRichContent(editor, defaultFontColor) {
      const defaultColor = normalizeAnnotationColor(defaultFontColor, '#111827');
      const segments = [];
      let text = '';

      function append(value, fontColor, highlightColor) {
        if (!value) return;
        const start = text.length;
        text += value;
        const end = text.length;
        const normalizedFont = normalizeOptionalAnnotationColor(fontColor);
        const normalizedHighlight = normalizeOptionalAnnotationColor(highlightColor);
        const effectiveFont = normalizedFont && normalizedFont !== defaultColor ? normalizedFont : null;
        if (!effectiveFont && !normalizedHighlight) return;
        const previous = segments[segments.length - 1];
        if (previous && previous.end === start && previous.font_color === effectiveFont && previous.highlight_color === normalizedHighlight) {
          previous.end = end;
        } else {
          segments.push({start, end, font_color: effectiveFont, highlight_color: normalizedHighlight});
        }
      }

      function walk(node, inheritedFont = null, inheritedHighlight = null) {
        if (node.nodeType === Node.TEXT_NODE) {
          append(node.data, inheritedFont, inheritedHighlight);
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (node.tagName === 'BR') {
          append('\n', inheritedFont, inheritedHighlight);
          return;
        }
        const inlineFont = cssColorToHex(node.style && node.style.color);
        const inlineHighlight = cssColorToHex(node.style && node.style.backgroundColor);
        const nextFont = inlineFont || inheritedFont;
        const nextHighlight = inlineHighlight || inheritedHighlight;
        for (const child of node.childNodes) walk(child, nextFont, nextHighlight);
        if (node !== editor && (node.tagName === 'DIV' || node.tagName === 'P') && node.nextSibling) {
          append('\n', nextFont, nextHighlight);
        }
      }

      for (const child of editor.childNodes) walk(child, null, null);
      return {text, format_runs: normalizeSlideTextFormatRuns(segments, text.length)};
    }

    function normalizeAnnotationSize(value) {
      return SLIDE_ANNOTATION_SIZES.has(String(value || '')) ? String(value) : 'medium';

    function annotationStrokeWidth(tool, size) {
      const normalized = normalizeAnnotationSize(size);
      if (tool === 'highlighter') {

      return {small: 2.5, medium: 5, large: 8}[normalized];

    function annotationEraserRadius(size) {

    function annotationSizeDotPixels(size) {

    function normalizeSlideAnnotationStroke(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const id = String(raw.id || '').trim();
      const pageNumber = Number(raw.page_number);
      const tool = String(raw.tool || '');
      const color = normalizeAnnotationColor(raw.color, tool === 'highlighter' ? '#FFE14F' : '#2457E6');
      const size = normalizeAnnotationSize(raw.size);
      const points = Array.isArray(raw.points)
        ? raw.points.map((point) => ({x: Number(point && point.x), y: Number(point && point.y)}))
          .filter((point) => Number.isFinite(point.x) && Number.isFinite(point.y) && point.x >= 0 && point.x <= 1 && point.y >= 0 && point.y <= 1)
        : [];
      if (!id || !Number.isInteger(pageNumber) || pageNumber <= 0) return null;
      if (tool !== 'marker' && tool !== 'highlighter') return null;
      if (!points.length) return null;
      return {id, page_number: pageNumber, tool, color, size, points};
    }

    function normalizeSlideAnnotationText(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const id = String(raw.id || '').trim();
      const pageNumber = Number(raw.page_number);
      let x = Number(raw.x);
      let y = Number(raw.y);
      let width = Number(raw.width);
      let height = Number(raw.height);
      const text = String(raw.text || '');
      if (!id || !Number.isInteger(pageNumber) || pageNumber <= 0) return null;
      if (![x, y].every(Number.isFinite) || x < 0 || x > 1 || y < 0 || y > 1) return null;
      if (!Number.isFinite(width)) width = 0.28;
      if (!Number.isFinite(height)) height = 0.08;
      width = Math.max(0.06, Math.min(1, width));
      height = Math.max(0.03, Math.min(1, height));
      x = Math.max(0, Math.min(1 - width, x));
      y = Math.max(0, Math.min(1 - height, y));
      if (!text.trim()) return null;
      return {
        id,
        page_number: pageNumber,
        x,
        y,
        width,
        height,
        text,
        font_color: normalizeAnnotationColor(raw.font_color, '#111827'),
        box_color: normalizeAnnotationColor(raw.box_color, '#FFFFFF'),
        format_runs: normalizeSlideTextFormatRuns(raw.format_runs, text.length)
      };
    }

    function normalizeSlideAnnotationLabel(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const id = String(raw.id || '').trim();
      const pageNumber = Number(raw.page_number);
      const label = String(raw.label || '').trim();
      let x = Number(raw.x);
      let y = Number(raw.y);
      let width = Number(raw.width);
      let height = Number(raw.height);
      if (!id || !Number.isInteger(pageNumber) || pageNumber <= 0) return null;
      if (!['Exam', 'Important', 'Disregard'].includes(label)) return null;
      if (![x, y, width, height].every(Number.isFinite)) return null;
      width = Math.max(0.035, Math.min(1, width));
      height = Math.max(0.022, Math.min(1, height));
      x = Math.max(0, Math.min(1 - width, x));
      y = Math.max(0, Math.min(1 - height, y));
      return {id, page_number: pageNumber, label, x, y, width, height};
    }

    function loadSlideAnnotationState(documentData) {

    function slideUndoSignature(snapshot) {

    function commitSlideUndoSnapshot(beforeSnapshot) {
      if (slideUndoApplying || !beforeSnapshot) return false;
      const currentSnapshot = snapshotSlideUndoState();
      if (slideUndoSignature(beforeSnapshot) === slideUndoSignature(currentSnapshot)) return false;
      const snapshotCopy = cloneSlideUndoValue(beforeSnapshot);
      const last = slideUndoStack[slideUndoStack.length - 1];
      if (!last || slideUndoSignature(last) !== slideUndoSignature(snapshotCopy)) {
        slideUndoStack.push(snapshotCopy);
        if (slideUndoStack.length > SLIDE_UNDO_LIMIT) slideUndoStack.splice(0, slideUndoStack.length - SLIDE_UNDO_LIMIT);
      }
      return true;

    function applySlideUndoSnapshot(snapshot) {
      if (!snapshot || typeof snapshot !== 'object') return;
      const annotations = snapshot.annotations && typeof snapshot.annotations === 'object' ? snapshot.annotations : {};
      const settings = annotations.settings && typeof annotations.settings === 'object' ? annotations.settings : {};
      slideAnnotationSettings = {
        marker_color: normalizeAnnotationColor(settings.marker_color, '#2457E6'),
        highlighter_color: normalizeAnnotationColor(settings.highlighter_color, '#FFE14F'),
        marker_size: normalizeAnnotationSize(settings.marker_size),
        highlighter_size: normalizeAnnotationSize(settings.highlighter_size),
        eraser_size: normalizeAnnotationSize(settings.eraser_size)
      };
      slideAnnotationStrokes = Array.isArray(annotations.strokes)
        ? annotations.strokes.map(normalizeSlideAnnotationStroke).filter(Boolean) : [];
      slideAnnotationTexts = Array.isArray(annotations.texts)
        ? annotations.texts.map(normalizeSlideAnnotationText).filter(Boolean) : [];
      slideAnnotationLabels = Array.isArray(annotations.labels)
        ? annotations.labels.map(normalizeSlideAnnotationLabel).filter(Boolean) : [];

      const occlusion = snapshot.occlusion && typeof snapshot.occlusion === 'object' ? snapshot.occlusion : {};
      boxRevealSeconds = clampRevealSeconds(occlusion.reveal_seconds);
      occlusionBoxes = Array.isArray(occlusion.boxes)
        ? occlusion.boxes.map(normalizeOcclusionBox).filter(Boolean) : [];

    async function undoLastSlideChange() {
      if (!slideUndoStack.length) return false;
      const snapshot = slideUndoStack.pop();
      slideUndoApplying = true;
      try {
        applySlideUndoSnapshot(snapshot);
        await Promise.all([saveSlideAnnotationState(), saveOcclusionState()]);
        setStatus('↶ Slide change undone', 'saved');
        return true;
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Slide change could not be undone.', 'error');
        return false;
      } finally {
        slideUndoApplying = false;

        if (!result.ok) throw new Error(result.error || 'Slide annotations could not be saved.');

    function makeSlideAnnotationId(prefix) {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {

    }

    function whiteboardWorldWidth() {
      return Math.max(1, whiteboardPageWidth * whiteboardPagesX);
    }

    function whiteboardWorldHeight() {
      return Math.max(1, whiteboardPageHeight * whiteboardPagesY);
    }

    function normalizeWhiteboardZoom(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return 100;
      return Math.max(10, Math.min(500, Math.round(numeric / 10) * 10));
    }

    function whiteboardZoomScale() {
      return whiteboardZoomPercent / 100;
    }

    function whiteboardLogicalScrollX() {
      return Math.max(0, whiteboardScrollport.scrollLeft / whiteboardZoomScale());
    }

    function whiteboardLogicalScrollY() {
      return Math.max(0, whiteboardScrollport.scrollTop / whiteboardZoomScale());
    }

    function updateWhiteboardZoomControls() {
      whiteboardZoomControls.hidden = !whiteboardModeActive;
      whiteboardZoomValue.textContent = `${whiteboardZoomPercent}%`;
      whiteboardZoomOutButton.disabled = !whiteboardModeActive || whiteboardZoomPercent <= 10;
      whiteboardZoomInButton.disabled = !whiteboardModeActive || whiteboardZoomPercent >= 500;
      whiteboardZoomResetButton.disabled = !whiteboardModeActive || whiteboardZoomPercent === 100;
    }

    function applyWhiteboardZoom(value, persist = true) {
      const nextZoom = normalizeWhiteboardZoom(value);
      if (nextZoom === whiteboardZoomPercent) {
        updateWhiteboardZoomControls();
        return;
      }
      const oldScale = whiteboardZoomScale();
      const viewportWidth = Math.max(0, whiteboardScrollport.clientWidth);
      const viewportHeight = Math.max(0, whiteboardScrollport.clientHeight);
      const visibleWorldWidth = Math.min(whiteboardWorldWidth(), viewportWidth / oldScale);
      const visibleWorldHeight = Math.min(whiteboardWorldHeight(), viewportHeight / oldScale);
      const centerWorldX = Math.min(whiteboardWorldWidth(), whiteboardLogicalScrollX() + visibleWorldWidth / 2);
      const centerWorldY = Math.min(whiteboardWorldHeight(), whiteboardLogicalScrollY() + visibleWorldHeight / 2);
      whiteboardZoomPercent = nextZoom;
      updateWhiteboardWorldSize();
      updateWhiteboardZoomControls();
      const newScale = whiteboardZoomScale();
      window.requestAnimationFrame(() => {
        whiteboardScrollport.scrollLeft = Math.max(0, centerWorldX * newScale - whiteboardScrollport.clientWidth / 2);
        whiteboardScrollport.scrollTop = Math.max(0, centerWorldY * newScale - whiteboardScrollport.clientHeight / 2);
        whiteboardScrollX = whiteboardLogicalScrollX();
        whiteboardScrollY = whiteboardLogicalScrollY();
        positionSlideTextFormatToolbar();
        if (persist && whiteboardExists) {
          setStatus('Saving…');
          queueWhiteboardViewportSave(180, `✓ Whiteboard zoom ${whiteboardZoomPercent}% saved`);
        }
      });
    }

    function changeWhiteboardZoom(delta) {
      if (!whiteboardModeActive) return;
      applyWhiteboardZoom(whiteboardZoomPercent + Number(delta || 0), true);
    }

    function normalizeWhiteboardText(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const id = String(raw.id || '').trim();
      const text = String(raw.text || '');
      if (!id || !text.trim()) return null;
      const width = Math.max(64, Number(raw.width) || 260);
      const height = Math.max(30, Number(raw.height) || 90);
      const maxX = Math.max(0, whiteboardWorldWidth() - width);
      const maxY = Math.max(0, whiteboardWorldHeight() - height);
      return {
        id,
        x: Math.max(0, Math.min(maxX, Number(raw.x) || 0)),
        y: Math.max(0, Math.min(maxY, Number(raw.y) || 0)),
        width: Math.min(whiteboardWorldWidth(), width),
        height: Math.min(whiteboardWorldHeight(), height),
        text,
        font_color: normalizeAnnotationColor(raw.font_color, '#111827'),
        box_color: normalizeAnnotationColor(raw.box_color, '#FFFFFF'),
        format_runs: normalizeSlideTextFormatRuns(raw.format_runs, text.length)
      };
    }

    function loadWhiteboardState(documentData) {
      const raw = documentData && documentData.whiteboard && typeof documentData.whiteboard === 'object'
        ? documentData.whiteboard
        : null;
      whiteboardExists = Boolean(raw && raw.exists);
      whiteboardPageWidth = raw && Number.isFinite(Number(raw.page_width)) && Number(raw.page_width) >= 320
        ? Number(raw.page_width)
        : 0;
      whiteboardPageHeight = raw && Number.isFinite(Number(raw.page_height)) && Number(raw.page_height) >= 320
        ? Number(raw.page_height)
        : 0;
      whiteboardPagesX = raw ? Math.max(1, Math.floor(Number(raw.pages_x) || 1)) : 1;
      whiteboardPagesY = raw ? Math.max(1, Math.floor(Number(raw.pages_y) || 1)) : 1;
      whiteboardScrollX = raw ? Math.max(0, Number(raw.scroll_x) || 0) : 0;
      whiteboardScrollY = raw ? Math.max(0, Number(raw.scroll_y) || 0) : 0;
      whiteboardZoomPercent = normalizeWhiteboardZoom(raw && raw.zoom_percent);
      whiteboardStrokes = [];
      if (raw && Array.isArray(raw.drawings)) {
        for (const candidate of raw.drawings) {
          if (!candidate || typeof candidate !== 'object') continue;
          const tool = candidate.tool === 'highlighter' ? 'highlighter' : candidate.tool === 'marker' ? 'marker' : null;
          if (!tool || !Array.isArray(candidate.points) || !candidate.points.length) continue;
          const points = candidate.points.map((point) => ({
            x: Math.max(0, Number(point && point.x) || 0),
            y: Math.max(0, Number(point && point.y) || 0)
          }));
          whiteboardStrokes.push({
            id: String(candidate.id || makeSlideAnnotationId('wbstroke')),
            tool,
            color: normalizeAnnotationColor(candidate.color, tool === 'highlighter' ? '#FFE14F' : '#2457E6'),
            size: normalizeAnnotationSize(candidate.size),
            points
          });
        }
      }
      whiteboardTexts = raw && Array.isArray(raw.text_objects)
        ? raw.text_objects.map(normalizeWhiteboardText).filter(Boolean)
        : [];
      if (whiteboardExists && whiteboardPageWidth && whiteboardPageHeight) {
        updateWhiteboardWorldSize();
        renderWhiteboardStrokes();
        renderWhiteboardTexts();
      }
    }

    function ensureWhiteboardDimensions() {
      let created = false;
      if (!(whiteboardPageWidth >= 320) || !(whiteboardPageHeight >= 320)) {
        whiteboardPageWidth = Math.max(640, Math.round(notesStage.clientWidth || 850));
        whiteboardPageHeight = Math.max(720, Math.round(notesStage.clientHeight || 1050));
        whiteboardPagesX = 1;
        whiteboardPagesY = 1;
        whiteboardScrollX = 0;
        whiteboardScrollY = 0;
        whiteboardZoomPercent = 100;
        created = true;
      }
      if (!whiteboardExists) {
        whiteboardExists = true;
        created = true;
      }
      updateWhiteboardWorldSize();
      return created;
    }

    function updateWhiteboardWorldSize() {
      const width = whiteboardWorldWidth();
      const height = whiteboardWorldHeight();
      const scale = whiteboardZoomScale();
      whiteboardSurface.style.width = `${Math.max(1, width * scale)}px`;
      whiteboardSurface.style.height = `${Math.max(1, height * scale)}px`;
      whiteboardWorld.style.width = `${Math.round(width)}px`;
      whiteboardWorld.style.height = `${Math.round(height)}px`;
      whiteboardWorld.style.transform = `scale(${scale})`;
      whiteboardSvg.setAttribute('width', String(Math.round(width)));
      whiteboardSvg.setAttribute('height', String(Math.round(height)));
      whiteboardSvg.setAttribute('viewBox', `0 0 ${Math.round(width)} ${Math.round(height)}`);
    }

    function whiteboardPathData(points) {
      if (!Array.isArray(points) || !points.length) return '';
      return points.map((point, index) => `${index ? 'L' : 'M'} ${Number(point.x).toFixed(2)} ${Number(point.y).toFixed(2)}`).join(' ');
    }

    function createWhiteboardStrokeElement(stroke) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.classList.add('slide-annotation-stroke', 'whiteboard-stroke');
      path.dataset.strokeId = stroke.id;
      path.setAttribute('d', whiteboardPathData(stroke.points));
      path.setAttribute('stroke', stroke.color);
      path.setAttribute('stroke-width', String(annotationStrokeWidth(stroke.tool, stroke.size)));
      path.setAttribute('opacity', stroke.tool === 'highlighter' ? '0.36' : '1');
      return path;
    }

    function renderWhiteboardStrokes() {
      whiteboardSvg.replaceChildren();
      for (const stroke of whiteboardStrokes) whiteboardSvg.appendChild(createWhiteboardStrokeElement(stroke));
    }

    function applyWhiteboardTextGeometry(element, item) {
      element.style.left = `${item.x}px`;
      element.style.top = `${item.y}px`;
      element.style.width = `${item.width}px`;
      element.style.height = `${item.height}px`;
      element.style.color = item.font_color;
      element.style.backgroundColor = item.box_color;
    }

    function whiteboardTextItemById(textId) {
      return whiteboardTexts.find((item) => item.id === textId) || null;
    }

    function updateWhiteboardTextSelectionUi() {
      for (const element of whiteboardTextLayer.querySelectorAll('.whiteboard-text-annotation')) {
        element.classList.toggle('selected', element.dataset.textId === selectedWhiteboardTextId);
      }
    }

    function selectWhiteboardText(textId) {
      selectedWhiteboardTextId = textId || null;
      updateWhiteboardTextSelectionUi();
    }

    function clearWhiteboardTextSelection() {
      if (!selectedWhiteboardTextId) return;
      selectedWhiteboardTextId = null;
      updateWhiteboardTextSelectionUi();
    }

    function beginWhiteboardTextTransform(event, item, element, mode, handle = '') {
      if (event.button !== 0 || slideAnnotationMode) return;
      event.preventDefault();
      event.stopPropagation();
      closeSlideTextContextMenu();
      selectWhiteboardText(item.id);
      const captureTarget = event.currentTarget;
      whiteboardTextTransformState = {
        pointerId: event.pointerId,
        mode,
        handle,
        item,
        element,
        captureTarget,
        startClientX: event.clientX,
        startClientY: event.clientY,
        start: {x: item.x, y: item.y, width: item.width, height: item.height},
        changed: false
      };
      try { captureTarget.setPointerCapture(event.pointerId); } catch (_error) {}
    }

    function moveWhiteboardTextTransform(event) {
      const state = whiteboardTextTransformState;
      if (!state || event.pointerId !== state.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      const scale = whiteboardZoomScale();
      const dx = (event.clientX - state.startClientX) / scale;
      const dy = (event.clientY - state.startClientY) / scale;
      const start = state.start;
      const worldWidth = whiteboardWorldWidth();
      const worldHeight = whiteboardWorldHeight();
      let x = start.x;
      let y = start.y;
      let width = start.width;
      let height = start.height;
      if (state.mode === 'move') {
        x = Math.max(0, Math.min(worldWidth - width, start.x + dx));
        y = Math.max(0, Math.min(worldHeight - height, start.y + dy));
      } else {
        const minWidth = 64;
        const minHeight = 30;
        let left = start.x;
        let top = start.y;
        let right = start.x + start.width;
        let bottom = start.y + start.height;
        if (state.handle.includes('w')) left = Math.max(0, Math.min(right - minWidth, start.x + dx));
        if (state.handle.includes('e')) right = Math.min(worldWidth, Math.max(left + minWidth, start.x + start.width + dx));
        if (state.handle.includes('n')) top = Math.max(0, Math.min(bottom - minHeight, start.y + dy));
        if (state.handle.includes('s')) bottom = Math.min(worldHeight, Math.max(top + minHeight, start.y + start.height + dy));
        x = left;
        y = top;
        width = right - left;
        height = bottom - top;
      }
      if (
        Math.abs(x - state.item.x) < 0.01 && Math.abs(y - state.item.y) < 0.01
        && Math.abs(width - state.item.width) < 0.01 && Math.abs(height - state.item.height) < 0.01
      ) return;
      state.changed = true;
      Object.assign(state.item, {x, y, width, height});
      applyWhiteboardTextGeometry(state.element, state.item);
    }

    function endWhiteboardTextTransform(event) {
      const state = whiteboardTextTransformState;
      if (!state || event.pointerId !== state.pointerId) return;
      moveWhiteboardTextTransform(event);
      whiteboardTextTransformState = null;
      try { state.captureTarget.releasePointerCapture(event.pointerId); } catch (_error) {}
      if (state.changed) scheduleWhiteboardSave(0, '✓ Whiteboard text position saved');
    }

    function cancelWhiteboardTextTransform(event) {
      const state = whiteboardTextTransformState;
      if (!state || event.pointerId !== state.pointerId) return;
      whiteboardTextTransformState = null;
      try { state.captureTarget.releasePointerCapture(event.pointerId); } catch (_error) {}
      Object.assign(state.item, state.start);
      applyWhiteboardTextGeometry(state.element, state.item);
    }

    function addWhiteboardTextSelectionControls(element, item) {
      for (const edge of ['n', 'e', 's', 'w']) {
        const zone = document.createElement('span');
        zone.className = 'slide-text-move-zone';
        zone.dataset.edge = edge;
        zone.title = 'Drag to move text box';
        zone.addEventListener('pointerdown', (event) => beginWhiteboardTextTransform(event, item, element, 'move'));
        zone.addEventListener('pointermove', moveWhiteboardTextTransform);
        zone.addEventListener('pointerup', endWhiteboardTextTransform);
        zone.addEventListener('pointercancel', cancelWhiteboardTextTransform);
        element.appendChild(zone);
      }
      for (const handle of ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) {
        const grip = document.createElement('span');
        grip.className = 'slide-text-resize-handle';
        grip.dataset.handle = handle;
        grip.title = `Resize ${handle.toUpperCase()}`;
        grip.addEventListener('pointerdown', (event) => beginWhiteboardTextTransform(event, item, element, 'resize', handle));
        grip.addEventListener('pointermove', moveWhiteboardTextTransform);
        grip.addEventListener('pointerup', endWhiteboardTextTransform);
        grip.addEventListener('pointercancel', cancelWhiteboardTextTransform);
        element.appendChild(grip);
      }
    }

    function openWhiteboardTextContextMenu(event, item) {
      closeSlideTextContextMenu();
      clearWhiteboardTextSelection();
      slideTextContextId = item.id;
      slideTextContextKind = 'whiteboard';
      slideTextContextMenu.hidden = false;
      const menuRect = slideTextContextMenu.getBoundingClientRect();
      const edge = 8;
      const left = Math.max(edge, Math.min(event.clientX, window.innerWidth - menuRect.width - edge));
      const top = Math.max(edge, Math.min(event.clientY, window.innerHeight - menuRect.height - edge));
      slideTextContextMenu.style.left = `${Math.round(left)}px`;
      slideTextContextMenu.style.top = `${Math.round(top)}px`;
    }

    function createWhiteboardTextElement(item) {
      const element = document.createElement('div');
      element.className = 'slide-text-annotation whiteboard-text-annotation';
      element.dataset.textId = item.id;
      applyWhiteboardTextGeometry(element, item);
      const textNode = document.createElement('span');
      textNode.className = 'slide-text-content';
      renderSlideTextRichContent(textNode, item);
      element.appendChild(textNode);
      addWhiteboardTextSelectionControls(element, item);
      element.classList.toggle('selected', selectedWhiteboardTextId === item.id);
      element.title = 'Click to select. Double-click to edit. Right-click for options.';
      element.addEventListener('click', (event) => {
        if (slideAnnotationMode || event.target.closest('.slide-text-resize-handle, .slide-text-move-zone')) return;
        event.preventDefault();
        event.stopPropagation();
        closeSlideTextContextMenu();
        selectWhiteboardText(item.id);
      });
      element.addEventListener('dblclick', (event) => {
        if (slideAnnotationMode || event.target.closest('.slide-text-resize-handle, .slide-text-move-zone')) return;
        event.preventDefault();
        event.stopPropagation();
        openWhiteboardTextEditor(item.x, item.y, item);
      });
      element.addEventListener('contextmenu', (event) => {
        if (slideAnnotationMode) return;
        event.preventDefault();
        event.stopPropagation();
        openWhiteboardTextContextMenu(event, item);
      });
      return element;
    }

    function renderWhiteboardTexts() {
      if (activeWhiteboardTextEditor) return;
      whiteboardTextLayer.replaceChildren();
      for (const item of whiteboardTexts) whiteboardTextLayer.appendChild(createWhiteboardTextElement(item));
    }

    function snapshotActiveWhiteboardText() {
      const state = activeWhiteboardTextEditor;
      if (!state) return null;
      const rich = serializeSlideTextRichContent(state.element, state.fontColor);
      if (!rich.text.trim()) return null;
      const width = Math.max(64, Math.min(whiteboardWorldWidth(), state.element.offsetWidth || state.width));
      const height = Math.max(30, Math.min(whiteboardWorldHeight(), state.element.offsetHeight || state.height));
      const x = Math.max(0, Math.min(whiteboardWorldWidth() - width, state.element.offsetLeft));
      const y = Math.max(0, Math.min(whiteboardWorldHeight() - height, state.element.offsetTop));
      return {
        id: state.id,
        x,
        y,
        width,
        height,
        text: rich.text,
        font_color: state.fontColor,
        box_color: state.boxColor,
        format_runs: rich.format_runs
      };
    }

    function snapshotWhiteboardState() {
      const active = snapshotActiveWhiteboardText();
      const texts = whiteboardTexts
        .filter((item) => !active || item.id !== active.id)
        .map((item) => ({
          id: item.id,
          x: item.x,
          y: item.y,
          width: item.width,
          height: item.height,
          text: item.text,
          font_color: item.font_color,
          box_color: item.box_color,
          format_runs: normalizeSlideTextFormatRuns(item.format_runs, item.text.length).map((run) => ({...run}))
        }));
      if (active) texts.push(active);
      return {
        exists: whiteboardExists,
        page_width: whiteboardPageWidth,
        page_height: whiteboardPageHeight,
        pages_x: whiteboardPagesX,
        pages_y: whiteboardPagesY,
        scroll_x: whiteboardLogicalScrollX(),
        scroll_y: whiteboardLogicalScrollY(),
        zoom_percent: whiteboardZoomPercent,
        drawings: whiteboardStrokes.map((stroke) => ({
          id: stroke.id,
          tool: stroke.tool,
          color: stroke.color,
          size: stroke.size,
          points: stroke.points.map((point) => ({x: point.x, y: point.y}))
        })),
        text_objects: texts
      };
    }

    async function saveWhiteboardState(successText = '') {
      if (!initialized || !whiteboardExists || !(window.pywebview && window.pywebview.api)) return;
      const state = snapshotWhiteboardState();
      whiteboardSaveQueue = whiteboardSaveQueue.then(async () => {
        const result = await window.pywebview.api.save_whiteboard_state(state);
        if (!result || !result.ok) throw new Error(result && result.error ? result.error : 'Whiteboard could not be saved.');
        if (successText) setStatus(successText, 'saved');
      }).catch((error) => {
        console.error(error);
